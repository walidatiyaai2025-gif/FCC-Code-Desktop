name: P06-007 Reconciliation Worker Fix

on:
  push:
    branches:
      - worker/fccd-p06-007-reconcile

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch validator and cleanup contract
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = '.github/workflows/p06-007-reconcile-worker.yml'
          $text = [IO.File]::ReadAllText($path)

          function Replace-Exactly-Once {
            param([string]$Text, [string]$Old, [string]$New, [string]$Label)
            $count = ([regex]::Matches($Text, [regex]::Escape($Old))).Count
            if ($count -ne 1) { throw "$Label expected exactly one match, found $count." }
            return $Text.Replace($Old, $New)
          }

          $oldCheck = '            if (@(git diff --name-only) -notcontains $required) { throw "Expected reconciliation change missing: $required" }'
          $newCheck = '            if (($required -eq ''evidence/phases/P06/P06_007_INTEGRATED_RECONCILIATION_2026-09-06.md'' -and -not (Test-Path -LiteralPath $required)) -or ($required -ne ''evidence/phases/P06/P06_007_INTEGRATED_RECONCILIATION_2026-09-06.md'' -and @(git diff --name-only) -notcontains $required)) { throw "Expected reconciliation change missing: $required" }'
          $text = Replace-Exactly-Once $text $oldCheck $newCheck 'Evidence assertion line'

          $oldCleanup = '          git rm .github/workflows/p06-007-reconcile-worker.yml'
          $newCleanup = "          git rm .github/workflows/p06-007-reconcile-worker.yml`n          if (Test-Path -LiteralPath '.p06-007-reconcile-trigger') { git rm .p06-007-reconcile-trigger }"
          $text = Replace-Exactly-Once $text $oldCleanup $newCleanup 'Temporary trigger cleanup'

          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p06-007-reconcile-worker-fix.yml
          git add .github/workflows/p06-007-reconcile-worker.yml
          git commit -m "Repair P06-007 reconciliation validator"
          git push origin HEAD:worker/fccd-p06-007-reconcile
