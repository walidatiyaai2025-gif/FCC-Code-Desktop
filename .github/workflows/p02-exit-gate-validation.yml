name: P02 Exit Gate Exact Validation

on:
  push:
    branches:
      - validation/p02-exit-gate-8b264cc

permissions:
  contents: read

jobs:
  exact-gate:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@v7
        with:
          ref: 8b264cc352656030382f95846410ac60d81f7c24
          fetch-depth: 0

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Assert exact candidate and canonical P02 task state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '8b264cc352656030382f95846410ac60d81f7c24'
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $expected) { throw "Wrong candidate: $head" }
          if (git status --porcelain) { throw 'Fresh checkout is not clean.' }

          $phase = Get-Content -LiteralPath .\CURRENT_PHASE.md -Raw
          if (-not $phase.Contains('CURRENT_PHASE: P02')) { throw 'P02 is not the canonical current phase on the candidate.' }
          if (-not $phase.Contains('PHASE_EXIT_GATE: NOT_RUN')) { throw 'Candidate does not have the expected pre-closure P02 gate state.' }
          if (-not $phase.Contains('VERIFIED_FINAL_COMPLETE: false')) { throw 'Final-completion guard is not false.' }

          $ledger = Get-Content -LiteralPath .\docs\TASK_LEDGER.md -Raw
          foreach ($task in 1..9) {
            $id = ('FCCD-P02-{0:D3}' -f $task)
            $pattern = [regex]::Escape($id) + '\s*\|[^\r\n]*\|\s*CLOSED\s*\|'
            if ($ledger -notmatch $pattern) { throw "$id is not CLOSED in the candidate ledger." }
          }
          Write-Host 'Exact candidate and P02 mandatory-task reconciliation: PASS.'

      - name: Restore format build and test baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = (& dotnet --version 2>&1 | Out-String).Trim()
          if ($sdk -ne '10.0.400') { throw "Expected .NET SDK 10.0.400 but resolved '$sdk'." }
          dotnet restore .\FCCCodeDesktop.sln --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet format .\FCCCodeDesktop.sln --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Format/analyzer verification failed.' }
          dotnet build .\FCCCodeDesktop.sln -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          pwsh -NoProfile -File .\tools\testing\run-tests.ps1 -Suite all -Configuration Release -NoRestore -NoBuild
          if ($LASTEXITCODE -ne 0) { throw 'Unit/integration test suite failed.' }

      - name: Complete P02 deterministic and Windows runtime validators
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $validators = @(
            '.\tools\ui\validate-design-system.ps1 -RunFixtures',
            '.\tools\ui\validate-semantic-themes.ps1 -RunFixtures -RequireRuntime',
            '.\tools\ui\validate-app-chrome.ps1 -RunFixtures -RequireRuntime',
            '.\tools\ui\validate-workspace-layout.ps1 -RunFixtures -RequireRuntime',
            '.\tools\ui\validate-navigation-surfaces.ps1 -RunFixtures -RequireRuntime',
            '.\tools\ui\validate-bottom-tool-panel.ps1 -RunFixtures -RequireRuntime',
            '.\tools\ui\validate-command-palette.ps1 -RunFixtures -RequireRuntime',
            '.\tools\ui\validate-common-states.ps1 -RunFixtures -RequireRuntime',
            '.\tools\ui\validate-dpi-layout.ps1 -RunFixtures -RequireRuntime'
          )
          foreach ($validator in $validators) {
            Write-Host "P02 gate validator: $validator"
            & pwsh -NoProfile -Command "& $validator"
            if ($LASTEXITCODE -ne 0) { throw "P02 validator failed: $validator" }
          }
          Write-Host 'Complete P02 deterministic/runtime validator set: PASS.'

      - name: Minimum-resolution and placeholder architecture guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dpiValidator = Get-Content -LiteralPath .\tools\ui\validate-dpi-layout.ps1 -Raw
          foreach ($required in @(
            'coordinator.Update(state, 1366d, 768d, 1d, 1d);',
            'Assert(coordinator.Profile == WorkspaceViewportProfile.Wide, "1366x768 wide profile");',
            'coordinator.Update(state, 1024d, 700d, 1.25d, 1.25d);',
            'coordinator.Update(state, 720d, 520d, 1.5d, 1.5d);',
            'coordinator.Update(state, 1366d, 768d, 2d, 2d);'
          )) {
            if (-not $dpiValidator.Contains($required)) { throw "DPI/minimum-resolution gate is missing required fixture: $required" }
          }

          $forbidden = '(?i)\b(TODO|FIXME|Coming soon|Placeholder)\b'
          $hits = New-Object System.Collections.Generic.List[string]
          foreach ($file in (Get-ChildItem -LiteralPath .\src\FCCCodeDesktop.App -Recurse -File | Where-Object { $_.Extension -in '.xaml', '.cs' })) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            if ($text -match $forbidden) { $hits.Add($file.FullName) }
          }
          if ($hits.Count -gt 0) {
            $hits | ForEach-Object { Write-Host "PLACEHOLDER_HIT: $_" }
            throw 'Production P02 application shell contains forbidden placeholder markers.'
          }
          Write-Host 'Minimum-resolution/DPI baseline and no-placeholder architecture guard: PASS.'

      - name: Canonical Windows CI baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File .\tools\ci\validate-windows-ci.ps1 -RequireDotNet
          if ($LASTEXITCODE -ne 0) { throw 'Windows CI contract validation failed.' }
          pwsh -NoProfile -File .\tools\ci\run-windows-ci.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Windows Release baseline failed.' }

      - name: Diff hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --cached --check failed.' }
          Write-Host 'Diff hygiene: PASS.'

      - name: Tracked-file secret sanity scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patterns = @(
            '-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----',
            '\bAKIA[0-9A-Z]{16}\b',
            '\bgh[pousr]_[A-Za-z0-9]{30,}\b',
            '\bgithub_pat_[A-Za-z0-9_]{40,}\b',
            '\bsk-[A-Za-z0-9_-]{20,}\b',
            '\bxox[baprs]-[A-Za-z0-9-]{20,}\b'
          )
          $approvedFixtureFiles = @(
            'tools/contract-probes/fcc/self-test.mjs',
            'evidence/phases/P01/CLOSURE.md'
          )
          $approvedFixtureValue = 'sk-selftest-THIS_MUST_NOT_APPEAR_123456'
          $hits = New-Object System.Collections.Generic.List[string]
          foreach ($file in (git ls-files)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { continue }
            try { $text = Get-Content -LiteralPath $file -Raw -ErrorAction Stop } catch { continue }
            foreach ($pattern in $patterns) {
              foreach ($match in [regex]::Matches($text, $pattern)) {
                if ($approvedFixtureFiles -contains $file -and $match.Value -eq $approvedFixtureValue) { continue }
                $hits.Add("$file :: $pattern")
              }
            }
          }
          if ($hits.Count -gt 0) {
            foreach ($hit in $hits) { Write-Host "SECRET_SCAN_HIT: $hit" }
            throw 'Tracked-file secret sanity scan found credential-like material outside the exact deterministic fixture allowlist.'
          }
          Write-Host 'Tracked-file secret sanity scan: PASS (exact deterministic fixture only).'

      - name: Final clean worktree
        shell: pwsh
        run: |
          if (git status --porcelain) { git status --short; throw 'Validation left tracked/untracked residue.' }
          Write-Host 'P02 exact-head exit-gate validation: PASS.'
