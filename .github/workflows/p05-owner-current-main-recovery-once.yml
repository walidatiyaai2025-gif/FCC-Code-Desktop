name: P05 Owner Current-Main Recovery Once

on:
  push:
    branches:
      - reconcile/p05-owner-real-target-current-main
    paths:
      - tools/reconciliation/recover-p05-owner-real-target-current-main.ps1
      - .github/workflows/p05-owner-current-main-recovery-once.yml

permissions:
  contents: write

concurrency:
  group: p05-owner-current-main-recovery-once
  cancel-in-progress: false

jobs:
  recover:
    name: Recover P05 owner evidence on current main
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce recovery baseline and run reconciliation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = '.\tools\reconciliation\recover-p05-owner-real-target-current-main.ps1'
          $text = Get-Content $scriptPath -Raw
          $old = @'
          $head = (& git rev-parse HEAD).Trim()
          if ($head -ne $currentMainBase) { throw "Recovery branch must start from exact main $currentMainBase; got $head." }
          '@
          $new = @'
          & git merge-base --is-ancestor $currentMainBase HEAD
          if ($LASTEXITCODE -ne 0) { throw "Recovery branch is not descended from exact main $currentMainBase." }
          $allowedStaging = @(
              'tools/reconciliation/recover-p05-owner-real-target-current-main.ps1',
              '.github/workflows/p05-owner-current-main-recovery-once.yml'
          )
          $unexpected = @(& git diff --name-only "$currentMainBase..HEAD" | Where-Object { $_ -and ($allowedStaging -notcontains $_) })
          if ($unexpected.Count -gt 0) { throw "Unexpected pre-recovery branch changes: $($unexpected -join ', ')" }
          '@
          if (-not $text.Contains($old)) { throw 'Staging head guard not found.' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText((Resolve-Path $scriptPath), $text, [Text.UTF8Encoding]::new($false))
          & $scriptPath

      - name: Remove one-shot recovery machinery
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.\tools\reconciliation\recover-p05-owner-real-target-current-main.ps1' -Force
          Remove-Item -LiteralPath '.\.github\workflows\p05-owner-current-main-recovery-once.yml' -Force
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed after cleanup.' }

      - name: Commit recovered canonical state
        shell: pwsh
        run: |
          $changed = git status --porcelain
          if (-not $changed) { throw 'Recovery produced no changes.' }
          git config user.name 'fcc-cloud-reconciliation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff check failed.' }
          git commit -m 'P05: recover owner exit evidence on current main'
          git push origin HEAD:reconcile/p05-owner-real-target-current-main
