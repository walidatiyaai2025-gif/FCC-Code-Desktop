name: P06-005 Ledger Next Action Temp

on:
  push:
    branches:
      - worker-b/fccd-p06-005-reconcile

permissions:
  contents: write

jobs:
  reconcile-next-action:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconcile ledger next action
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = 'docs/TASK_LEDGER.md'
          $text = [IO.File]::ReadAllText($path)
          $old = @'
`CURRENT_PHASE = P06` and P06 remains `IN_PROGRESS` with `PHASE_EXIT_GATE=NOT_RUN`. `FCCD-P06-001`, `FCCD-P06-002`, `FCCD-P06-003`, `FCCD-P06-004`, and `FCCD-P06-007` are CLOSED after exact PR-head validation, normal merge integration, exact post-merge canonical-main validation, and durable reconciliation evidence. `FCCD-P06-005`, `FCCD-P06-006`, and `FCCD-P06-008` remain PENDING; `FCCD-P06-005` is currently actively owned by fresh branch `worker/fccd-p06-005-local-code-editor` and must not be duplicated or stolen.

P04 remains acceptance-unresolved through `FCCD-P04-008` and its one-to-one queued `OWNER-P04-008-REAL-TARGET` obligation. P05 cloud implementation remains integrated, but its standalone exit observation remains queued as `OWNER-P05-EXIT-REAL-TARGET`. Their phase gates remain `P04=NOT_RUN;P05=NOT_RUN`; owner-last scheduling permits P06 cloud implementation but does not close either deferred acceptance requirement or permit release.

After this P06-007 reconciliation is integrated and exact resulting `main` remains green, re-run the Worker Protocol claim map. Recover/integrate any higher-priority legitimate work first. Because P06-005 is presently owned, select only another dependency-valid unclaimed P06 task whose semantic/file surface does not collide with fresh work; otherwise report `NO_SAFE_PARALLEL_WORK`. Do not begin P07 until P06 cloud work is complete and governance truthfully advances the current cloud phase.
'@
          $new = @'
`CURRENT_PHASE = P06` and P06 remains `IN_PROGRESS` with `PHASE_EXIT_GATE=NOT_RUN`. `FCCD-P06-001`, `FCCD-P06-002`, `FCCD-P06-003`, `FCCD-P06-004`, `FCCD-P06-005`, and `FCCD-P06-007` are CLOSED after exact PR-head validation, normal merge integration, exact post-merge canonical-main validation, and durable reconciliation evidence. `FCCD-P06-006` and `FCCD-P06-008` remain PENDING.

P04 remains acceptance-unresolved through `FCCD-P04-008` and its one-to-one queued `OWNER-P04-008-REAL-TARGET` obligation. P05 cloud implementation remains integrated, but its standalone exit observation remains queued as `OWNER-P05-EXIT-REAL-TARGET`. Their phase gates remain `P04=NOT_RUN;P05=NOT_RUN`; owner-last scheduling permits P06 cloud implementation but does not close either deferred acceptance requirement or permit release.

After this P06-005 reconciliation is integrated and exact resulting `main` remains green, re-run the Worker Protocol claim map. Recover/integrate any higher-priority legitimate work first. `FCCD-P06-006 — Editor tabs/save/reload/dirty state` is now dependency-valid after P06-005 integration; select it only if it remains unclaimed and its semantic/file surface does not collide with fresh P06-008 work. `FCCD-P06-008` remains separately owned by its live worker unless that claim later becomes genuinely stale. Do not begin P07 until P06 cloud work is complete and governance truthfully advances the current cloud phase.
'@
          if (-not $text.Contains($old)) { throw 'Expected stale current-next-action block was not found.' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $status = @(git status --porcelain)
          if ($status.Count -ne 1 -or -not ($status[0] -match 'docs/TASK_LEDGER.md')) { throw "Unexpected reconciliation diff: $($status -join '; ')" }

      - name: Commit ledger next action
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TASK_LEDGER.md
          git commit -m "docs: reconcile P06-005 next action"
          git push origin HEAD:worker-b/fccd-p06-005-reconcile
