name: P08 Closure Provenance Repair

on:
  push:
    branches:
      - closure/p08-phase-exit
    paths:
      - 'tools/reconcile/repair-p08-closure-stale-provenance.ps1'
      - '.github/workflows/p08-closure-provenance-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v7
        with:
          ref: closure/p08-phase-exit
          fetch-depth: 0

      - name: Apply fail-closed provenance repair
        shell: pwsh
        run: .\tools\reconcile\repair-p08-closure-stale-provenance.ps1

      - name: Remove temporary repair orchestration
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.\tools\reconcile\repair-p08-closure-stale-provenance.ps1' -Force
          Remove-Item -LiteralPath '.\.github\workflows\p08-closure-provenance-repair.yml' -Force

      - name: Validate durable diff and push repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          $changed = @(git status --porcelain=v1)
          if ($changed.Count -eq 0) { throw 'Repair produced no durable change.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_PHASE.md docs/TASK_LEDGER.md tools/reconcile/repair-p08-closure-stale-provenance.ps1 .github/workflows/p08-closure-provenance-repair.yml
          git commit -m 'docs: reconcile historical P08 closure provenance'
          git push origin HEAD:closure/p08-phase-exit
