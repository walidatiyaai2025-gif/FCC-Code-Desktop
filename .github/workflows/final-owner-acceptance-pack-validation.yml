name: Final Owner Acceptance Pack Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/final-acceptance/**'
      - 'docs/FINAL_OWNER_ACCEPTANCE_GUIDE.md'
      - 'docs/FINAL_OWNER_ACCEPTANCE_QUEUE.md'
      - 'docs/OWNER_LAST_EXECUTION_POLICY.md'
      - '.github/workflows/final-owner-acceptance-pack-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/final-acceptance/**'
      - 'docs/FINAL_OWNER_ACCEPTANCE_GUIDE.md'
      - 'docs/FINAL_OWNER_ACCEPTANCE_QUEUE.md'
      - 'docs/OWNER_LAST_EXECUTION_POLICY.md'
      - '.github/workflows/final-owner-acceptance-pack-validation.yml'

permissions:
  contents: read

jobs:
  validate-final-owner-pack:
    name: Final Owner Acceptance Pack
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Validate consolidated owner workflow
        shell: pwsh
        run: >-
          .\tools\final-acceptance\validate-final-owner-acceptance-pack.ps1
          -RepositoryRoot $env:GITHUB_WORKSPACE
          -RunNegativeFixtures
