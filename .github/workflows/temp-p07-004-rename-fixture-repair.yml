name: Temporary P07-004 rename fixture repair

on:
  push:
    branches:
      - worker-b/fccd-p07-004-stage-unstage

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Apply guarded rename fixture repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/FCCCodeDesktop.UnitTests/GitIndexMutationTests.cs')
          text = path.read_text(encoding='utf-8')
          old = 'var stage = await service.StageAsync(workspace.Path, ["renamed-target.txt"]);'
          new = 'var stage = await service.StageAsync(workspace.Path, unstage.EffectivePaths);'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'guard failed: expected one restage call, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-p07-004-rename-fixture-repair.yml
          git add tests/FCCCodeDesktop.UnitTests/GitIndexMutationTests.cs
          git commit -m "FCCD-P07-004: align rename restage fixture with effective paths"
          git push origin HEAD:worker-b/fccd-p07-004-stage-unstage
