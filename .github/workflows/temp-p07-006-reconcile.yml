name: Temp P07-006 Reconciliation

on:
  push:
    branches:
      - reconcile/fccd-p07-006-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply guarded canonical reconciliation
        run: python .github/temp/p07-006-reconcile.py
