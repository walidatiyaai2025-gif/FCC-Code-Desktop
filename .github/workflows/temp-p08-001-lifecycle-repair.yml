name: Temporary P08-001 lifecycle repair

on:
  push:
    branches:
      - repair/p08-001-post-merge-workspace-lock
    paths:
      - .github/workflows/temp-p08-001-lifecycle-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/p08-001-post-merge-workspace-lock
          fetch-depth: 0
      - name: Apply guarded repair
        run: python .github/temp/p08-001-lifecycle-repair.py
      - name: Verify durable scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx 'src/FCCCodeDesktop.Runtime/ProcessSupervisor.cs'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/temp-p08-001-lifecycle-repair.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/temp/p08-001-lifecycle-repair.py'
      - name: Commit repair and self-delete helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src/FCCCodeDesktop.Runtime/ProcessSupervisor.cs .github/workflows/temp-p08-001-lifecycle-repair.yml .github/temp/p08-001-lifecycle-repair.py
          git commit -m 'P08-001: make completion include active-registry cleanup'
          git push origin HEAD:repair/p08-001-post-merge-workspace-lock
