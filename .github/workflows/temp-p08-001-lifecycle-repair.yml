name: Temporary P08-001 lifecycle repair

on:
  push:
    branches:
      - repair/p08-001-post-merge-workspace-lock
    paths:
      - .github/workflows/temp-p08-001-lifecycle-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/p08-001-post-merge-workspace-lock
          fetch-depth: 0
      - name: Apply guarded lifecycle ordering repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/FCCCodeDesktop.Runtime/ProcessSupervisor.cs")
          text = path.read_text(encoding="utf-8")
          old = '''                _completion.TrySetResult(
                    new OwnedProcessExit(
                        OwnershipId,
                        RootProcessId,
                        rootExitCode,
                        StartedUtc,
                        DateTimeOffset.UtcNow,
                        Volatile.Read(ref _forcedTerminationRequested) != 0));
            }
            catch (Exception exception)
            {
                _completion.TrySetException(exception);
            }
            finally
            {
                _removeActive(OwnershipId);
            }
'''
          new = '''                var exit = new OwnedProcessExit(
                    OwnershipId,
                    RootProcessId,
                    rootExitCode,
                    StartedUtc,
                    DateTimeOffset.UtcNow,
                    Volatile.Read(ref _forcedTerminationRequested) != 0);

                _removeActive(OwnershipId);
                _completion.TrySetResult(exit);
            }
            catch (Exception exception)
            {
                _removeActive(OwnershipId);
                _completion.TrySetException(exception);
            }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one lifecycle block; found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          Path(".github/workflows/temp-p08-001-lifecycle-repair.yml").unlink()
      - name: Verify durable scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'src/FCCCodeDesktop.Runtime/ProcessSupervisor.cs'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/temp-p08-001-lifecycle-repair.yml'
      - name: Commit repair and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/FCCCodeDesktop.Runtime/ProcessSupervisor.cs .github/workflows/temp-p08-001-lifecycle-repair.yml
          git commit -m 'P08-001: make completion include active-registry cleanup'
          git push origin HEAD:repair/p08-001-post-merge-workspace-lock
