name: P09 Final Integrated Reconciliation Bootstrap

on:
  push:
    branches:
      - reconcile/fccd-p09-final-integrated-closures

permissions:
  contents: write
  actions: read

concurrency:
  group: p09-final-integrated-reconciliation-bootstrap
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: 864ed7842b9412f9cafccf89e1b5ae420f557b18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Wait for exact implementation-main permanent gates
        shell: bash
        run: |
          set -euo pipefail
          runs=(34192825959 34192826049 34192825878)
          for attempt in $(seq 1 40); do
            all_done=1
            all_success=1
            for run in "${runs[@]}"; do
              status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.status')
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.conclusion // ""')
              echo "run=${run} status=${status} conclusion=${conclusion}"
              if [[ "$status" != "completed" ]]; then all_done=0; fi
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then all_success=0; fi
            done
            if [[ "$all_done" == 1 ]]; then
              if [[ "$all_success" != 1 ]]; then
                echo "At least one exact implementation-main gate failed." >&2
                exit 1
              fi
              break
            fi
            if [[ "$attempt" == 40 ]]; then
              echo "Timed out waiting for exact implementation-main gates." >&2
              exit 1
            fi
            sleep 15
          done
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$CANDIDATE" ]]; then
            echo "Canonical main moved: expected $CANDIDATE, got $main_sha" >&2
            exit 1
          fi

      - name: Reconcile final P09 task state and evidence
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/reconcile_p09.py
          python /tmp/reconcile_p09.py
          grep -F 'FCCD-P09-007` — CLI/process generic adapter primitives — CLOSED.' CURRENT_PHASE.md
          grep -F 'FCCD-P09-008` — Optional protocol adapter seam (DAP/MCP/etc.) without core coupling — CLOSED.' CURRENT_PHASE.md
          grep -E '^\| FCCD-P09-00[1-8] .*\| CLOSED \|$' docs/TASK_LEDGER.md | tee /tmp/p09-closed.txt
          test "$(wc -l < /tmp/p09-closed.txt)" -eq 8
          grep -F 'CURRENT_PHASE_STATE: IN_PROGRESS' CURRENT_PHASE.md
          grep -F 'PHASE_EXIT_GATE: NOT_RUN' CURRENT_PHASE.md
          git diff --check

      - name: Commit durable reconciliation only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p09-final-reconciliation-bootstrap.yml
          git config user.name "walidatiyaai2025-gif"
          git config user.email "walidatiyaai2025@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "P09: reconcile final integrated task closures"
          git push origin HEAD:reconcile/fccd-p09-final-integrated-closures
