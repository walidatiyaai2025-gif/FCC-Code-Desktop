name: P09 Final Integrated Reconciliation Bootstrap

on:
  push:
    branches:
      - reconcile/fccd-p09-final-integrated-closures

permissions:
  contents: write
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: 864ed7842b9412f9cafccf89e1b5ae420f557b18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Guard exact accepted main
        shell: bash
        run: |
          set -euo pipefail
          for run in 34192825959 34192826049 34192825878; do
            test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${run} --jq .status)" = completed
            test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${run} --jq .conclusion)" = success
          done
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "$CANDIDATE"
      - name: Reconcile rows and evidence
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("CURRENT_PHASE.md"); s=p.read_text(encoding="utf-8"); lines=s.splitlines(True); ids=("FCCD-P09-007","FCCD-P09-008"); found={x:0 for x in ids}; out=[]; [(out.append(line.replace("PENDING.","CLOSED.",1)) if any(line.startswith("- `"+x+"`") and "PENDING." in line and not found.__setitem__(x,found[x]+1) for x in ids) else out.append(line)) for line in lines]; assert all(found[x]==1 for x in ids),found; p.write_text("".join(out),encoding="utf-8")'
          python -c 'from pathlib import Path; p=Path("docs/TASK_LEDGER.md"); s=p.read_text(encoding="utf-8"); lines=s.splitlines(True); ids=("FCCD-P09-007","FCCD-P09-008"); found={x:0 for x in ids}; out=[]; exec("for line in lines:\n m=None\n for x in ids:\n  if line.startswith(\"| \"+x+\" |\") and \"| PENDING |\" in line: m=x; break\n if m:\n  found[m]+=1; line=line.replace(\"| PENDING |\",\"| CLOSED |\",1)\n out.append(line)"); assert all(found[x]==1 for x in ids),found; p.write_text("".join(out),encoding="utf-8")'
          mkdir -p evidence/phases/P09
          printf '%s\n' '# FCCD-P09-007 Integrated Reconciliation' '' 'Canonical state: CLOSED' 'Implementation PR: #227' 'Exact head: 7150ed11f39cd987ad6fdd9aa55415d7ba3f8b84' 'Exact-head gates: Windows 34191859920 SUCCESS; Workspace 34191859912 SUCCESS; Large 34191859939 SUCCESS.' 'Normal merge / combined implementation main: 864ed7842b9412f9cafccf89e1b5ae420f557b18' 'Exact-main gates: Windows 34192825959 SUCCESS; Workspace 34192826049 SUCCESS; Large 34192825878 SUCCESS.' 'No owner-only evidence is required. P09 remains IN_PROGRESS until phase exit and closure.' > evidence/phases/P09/P09_007_INTEGRATED_RECONCILIATION_2026-09-08.md
          printf '%s\n' '# FCCD-P09-008 Integrated Reconciliation' '' 'Canonical state: CLOSED' 'Implementation PR: #226' 'Exact head: 4c1a8850775de561167765a06b886b7ac990495c' 'Exact-head gates: Windows 34191080131 SUCCESS; Workspace 34191080073 SUCCESS; Large 34191080038 SUCCESS.' 'Normal merge: ead2676ab1027f28ca73b8318fdb5dd28c0cf9a8' 'Immediate exact-main gates: Windows 34192160905 SUCCESS; Workspace 34192160895 SUCCESS; Large 34192160856 SUCCESS.' 'Combined implementation main 864ed7842b9412f9cafccf89e1b5ae420f557b18: Windows 34192825959 SUCCESS; Workspace 34192826049 SUCCESS; Large 34192825878 SUCCESS.' 'No owner-only evidence is required. P09 remains IN_PROGRESS until phase exit and closure.' > evidence/phases/P09/P09_008_INTEGRATED_RECONCILIATION_2026-09-08.md
          test "$(grep -E '^\| FCCD-P09-00[1-8] .*\| CLOSED \|$' docs/TASK_LEDGER.md | wc -l)" -eq 8
          grep -F 'CURRENT_PHASE_STATE: IN_PROGRESS' CURRENT_PHASE.md
          grep -F 'PHASE_EXIT_GATE: NOT_RUN' CURRENT_PHASE.md
          git diff --check
      - name: Commit durable reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p09-final-reconciliation-bootstrap.yml
          git config user.name walidatiyaai2025-gif
          git config user.email walidatiyaai2025@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'P09: reconcile final integrated task closures'
          git push origin HEAD:reconcile/fccd-p09-final-integrated-closures
