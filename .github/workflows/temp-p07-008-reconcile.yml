name: Temp P07-008 Reconciliation

on:
  push:
    branches:
      - reconcile/fccd-p07-008-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify exact canonical base ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 37bcd9ea636d278e852962a0fe05f112bc6adc6a HEAD
          test -f .github/temp/p07-008-reconcile.py
      - name: Apply guarded reconciliation
        shell: bash
        run: python .github/temp/p07-008-reconcile.py
