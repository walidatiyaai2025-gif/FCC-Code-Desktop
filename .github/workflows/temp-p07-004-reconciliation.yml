name: Temporary P07-004 reconciliation

on:
  push:
    branches:
      - reconcile/fccd-p07-004-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply guarded canonical reconciliation
        shell: bash
        run: |
          printf '%s' '   wNy0wMDQtcmVjb25jaWxpYXRpb24ueW1sIikudW5saW5rKCkK' | base64 -d | python3
      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fccd-reconciliation-bot"
          git config user.email "fccd-reconciliation-bot@users.noreply.github.com"
          git add CURRENT_PHASE.md PROJECT_CONTROL.md docs/TASK_LEDGER.md evidence/phases/P07/P07_004_INTEGRATED_RECONCILIATION_2026-09-06.md .github/workflows/temp-p07-004-reconciliation.yml
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "FCCD-P07-004: reconcile integrated closure"
          git push origin HEAD:reconcile/fccd-p07-004-integrated-closure
