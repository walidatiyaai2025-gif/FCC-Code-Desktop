name: Temporary P07-004 reconciliation

on:
  push:
    branches:
      - reconcile/fccd-p07-004-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard canonical base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "106ca224d01b2398c5a3e799a1943213df57b667"
          test "$(git merge-base HEAD origin/main)" = "106ca224d01b2398c5a3e799a1943213df57b667"

      - name: Apply guarded reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/temp/p07-004-reconcile.py

      - name: Verify reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            ".github/temp/p07-004-reconcile.py"
            ".github/workflows/temp-p07-004-reconciliation.yml"
            "CURRENT_PHASE.md"
            "PROJECT_CONTROL.md"
            "docs/TASK_LEDGER.md"
            "evidence/phases/P07/P07_004_INTEGRATED_RECONCILIATION_2026-09-06.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!changed[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          grep -F '`FCCD-P07-004` — Stage/unstage — CLOSED.' CURRENT_PHASE.md
          grep -F '| FCCD-P07-004 | Stage/unstage | CLOSED |' docs/TASK_LEDGER.md
          grep -F 'P07_004_INTEGRATED_RECONCILIATION_2026-09-06.md' PROJECT_CONTROL.md
          test -f evidence/phases/P07/P07_004_INTEGRATED_RECONCILIATION_2026-09-06.md
          test ! -e .github/temp/p07-004-reconcile.py
          test ! -e .github/workflows/temp-p07-004-reconciliation.yml

      - name: Commit and push reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fccd-cloud-worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: reconcile integrated P07-004 stage/unstage"
          git push origin HEAD:reconcile/fccd-p07-004-integrated-closure
