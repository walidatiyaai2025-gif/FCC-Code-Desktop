name: TEMP P07-010 Wire Safeguards

on:
  push:
    branches:
      - worker-b/fccd-p07-010-destructive-operation-safeguards

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'wire fail-closed destructive Git safeguards') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Wire guarded Git process boundary
        run: python .github/temp/p07-010-wire.py
