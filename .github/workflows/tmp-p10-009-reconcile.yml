name: Temporary P10-009 Canonical Reconciliation Author

on:
  push:
    branches:
      - worker/fccd-p10-009-reconciliation
    paths:
      - '.github/workflows/tmp-p10-009-reconcile.yml'

permissions:
  contents: write

jobs:
  author:
    if: github.event.head_commit.message == 'bootstrap P10-009 canonical reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v7
        with:
          ref: worker/fccd-p10-009-reconciliation
          fetch-depth: 0

      - name: Author deterministic P10-009 reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          accepted_candidate = 'ce8486cdee218f243fc74f6aa066ffd426a9834d'
          implementation_main = '0bf49f7ec10212253de1dda3e76970cb76523792'

          current_path = Path('CURRENT_PHASE.md')
          current = current_path.read_text(encoding='utf-8')
          pending = '- `FCCD-P10-009` — Project-owned Editor automation invocation — PENDING.'
          closed = '- `FCCD-P10-009` — Project-owned Editor automation invocation — CLOSED.'
          if current.count(pending) != 1:
              raise SystemExit('CURRENT_PHASE P10-009 pending marker was not uniquely present')
          current = current.replace(pending, closed, 1)

          current_anchor = '\n## P10-004 integration provenance\n'
          if current.count(current_anchor) != 1:
              raise SystemExit('CURRENT_PHASE provenance insertion anchor was not unique')
          if '## P10-009 integration provenance' in current:
              raise SystemExit('CURRENT_PHASE already contains P10-009 provenance')
          current_provenance = f'''\n## P10-009 integration provenance\n\n- Task: `FCCD-P10-009 — Project-owned Editor automation invocation` — `CLOSED` in this reconciliation candidate.\n- Implementation PR: #252 (`worker/fccd-p10-009-unity-editor-automation`).\n- Exact accepted implementation candidate: `{accepted_candidate}`.\n- Initial candidate `96f6cb254ead1623b6aedc596f65b40f6ff728bd` exposed a fixture-only C# declaration-order defect in P10-009 run `34256931168`; it was repaired on the same branch without suppressions or safety weakening.\n- Exact repaired candidate P10-009 Unity Editor Automation `34257173874`, Windows Release `34257173863`, Workspace Search `34257173895`, and Large Workspace Safeguards `34257173880` — SUCCESS.\n- Normal implementation merge / accepted implementation main: `{implementation_main}`.\n- Exact implementation-main P10-009 Unity Editor Automation `34258387291`, Windows Release `34258387311`, Workspace Search `34258387200`, and Large Workspace Safeguards `34258387225` — SUCCESS.\n- The integrated boundary uses typed `unity.execute-method` invocation, product-owned operation/result correlation, bounded fresh structured JSON evidence, and fail-closed validation for stale/missing/malformed/oversized/mismatched/project/process/cancellation outcomes; process exit code alone cannot establish success.\n- Integrated cloud evidence: `evidence/phases/P10/P10_009_INTEGRATED_RECONCILIATION_2026-09-08.md`.\n- No new owner-only evidence is required or added. P10 remains `IN_PROGRESS`; P10-010 through P10-013 remain PENDING; `PHASE_EXIT_GATE=NOT_RUN`; P11+ remain prohibited; `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item; `VERIFIED_FINAL_COMPLETE=false`.\n'''
          current = current.replace(current_anchor, current_provenance + current_anchor, 1)
          current_path.write_text(current, encoding='utf-8')

          ledger_path = Path('docs/TASK_LEDGER.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          pending_row = '| FCCD-P10-009 | Project-owned Editor automation invocation | PENDING |'
          closed_row = '| FCCD-P10-009 | Project-owned Editor automation invocation | CLOSED |'
          if ledger.count(pending_row) != 1:
              raise SystemExit('TASK_LEDGER P10-009 pending row was not uniquely present')
          ledger = ledger.replace(pending_row, closed_row, 1)

          heading = '## Current next action\n\n'
          start = ledger.find(heading)
          if start < 0 or ledger.find(heading, start + 1) >= 0:
              raise SystemExit('TASK_LEDGER current-next heading was not uniquely present')
          end_marker = '\n<!-- FCCD-P08-004-FINAL-CLOSURE-PROVENANCE -->'
          end = ledger.find(end_marker, start)
          if end < 0:
              raise SystemExit('TASK_LEDGER current-next end marker was not found')
          if '## FCCD-P10-009 canonical closure provenance' in ledger:
              raise SystemExit('TASK_LEDGER already contains P10-009 provenance')
          provenance = f'''## FCCD-P10-009 canonical closure provenance\n\n- Task: `FCCD-P10-009 — Project-owned Editor automation invocation` — `CLOSED` in this reconciliation candidate.\n- Implementation PR: #252; exact accepted implementation candidate `{accepted_candidate}`; normal implementation merge `{implementation_main}`.\n- Repaired exact-head P10-009 `34257173874`, Windows Release `34257173863`, Workspace Search `34257173895`, Large Workspace Safeguards `34257173880` — SUCCESS.\n- Exact implementation-main P10-009 `34258387291`, Windows Release `34258387311`, Workspace Search `34258387200`, Large Workspace Safeguards `34258387225` — SUCCESS.\n- Initial fixture-only compile failure `34256931168` was repaired without suppression or safety weakening.\n- Evidence: `evidence/phases/P10/P10_009_INTEGRATED_RECONCILIATION_2026-09-08.md`. No new owner-only evidence is required.\n\n---\n\n'''
          next_action = '''## Current next action\n\n`CURRENT_PHASE = P10` remains the sole active cloud implementation/convergence phase. `FCCD-P10-001` through `FCCD-P10-009` are CLOSED after normal implementation integration, exact-head/exact-main validation, required repair, and durable task reconciliation; `FCCD-P10-010` through `FCCD-P10-013` remain PENDING. After this P10-009 reconciliation itself passes exact-head CI, normal merge, and exact-main verification, the next legal cloud action is a fresh live claim/concurrency sweep and then `FCCD-P10-010 — Build target execution/artifact validation` only if it remains unclaimed and dependency-valid. P11 and later implementation remain prohibited until P10 is truthfully closed under canonical governance. Preserve `OWNER-P04-008-REAL-TARGET` as the sole unresolved release-blocking owner item, keep `P04=NOT_RUN`, and keep `VERIFIED_FINAL_COMPLETE=false`.\n'''
          ledger = ledger[:start] + provenance + next_action + ledger[end:]
          ledger_path.write_text(ledger, encoding='utf-8')

          evidence_path = Path('evidence/phases/P10/P10_009_INTEGRATED_RECONCILIATION_2026-09-08.md')
          if evidence_path.exists():
              raise SystemExit('P10-009 reconciliation evidence already exists')
          evidence = f'''# FCCD-P10-009 — Integrated Reconciliation Evidence\n\n**Task:** `FCCD-P10-009 — Project-owned Editor automation invocation`\n**Phase:** P10 — Unity first-class adapter\n**Date:** 2026-09-08\n**Reconciliation state:** cloud implementation integrated and exact-main verified; canonical closure candidate.\n\n## Live selection boundary\n\nThe scheduling hint for this slot was future `FCCD-P21-005 — Blender environment acceptance`. Live canonical state remained `CURRENT_PHASE=P10`. `FCCD-P10-009` was the sole legitimate stale/integration-pending current-phase unit: implementation PR #252 was open and exact-head green while the canonical P10-009 row still remained PENDING. No competing open P10-009 PR was present.\n\n## Implementation\n\nPR #252 implemented a production project-owned Unity Editor automation boundary with:\n\n- typed `unity.execute-method` process planning layered on the P10-003 Unity CLI builder;\n- product-owned operation GUID and structured-result path arguments that callers cannot override;\n- operation correlation binding into the tool-process contract;\n- bounded schema-v1 JSON result evidence;\n- safe P09 artifact validation, byte-stability and freshness checks;\n- fail-closed missing, empty, unsafe, unreadable, oversized, mutated, stale, malformed, schema-mismatched, operation/method-mismatched, project-reported failure, process-failure and cancellation classifications;\n- deterministic hosted-Windows positive/negative fixture coverage and dedicated P10-009 CI;\n- reuse of genuine P00 target evidence for real Unity `-executeMethod` semantics rather than fabricated hosted-runner Unity claims.\n\nA process exit code alone cannot establish P10-009 success.\n\n## Repair history\n\nInitial candidate `96f6cb254ead1623b6aedc596f65b40f6ff728bd` failed dedicated run `34256931168` because the new deterministic fixture declared its method-name constant after the top-level return, producing C# declaration-order/unreachable-code compiler errors. Production assemblies compiled before the fixture failure. The fixture was repaired on the same branch without analyzer suppression, warning demotion, test removal, or safety weakening.\n\n## Exact implementation candidate\n\nAccepted repaired candidate: `{accepted_candidate}`.\n\n- P10-009 Unity Editor Automation — run `34257173874` — SUCCESS.\n- Windows Release — run `34257173863` — SUCCESS.\n- Workspace Search — run `34257173895` — SUCCESS.\n- Large Workspace Safeguards — run `34257173880` — SUCCESS.\n\n## Normal integration and exact-main verification\n\nPR #252 was normally merged with the accepted candidate as a parent. Accepted implementation main: `{implementation_main}`.\n\n- P10-009 Unity Editor Automation — run `34258387291` — SUCCESS.\n- Windows Release — run `34258387311` — SUCCESS.\n- Workspace Search — run `34258387200` — SUCCESS.\n- Large Workspace Safeguards — run `34258387225` — SUCCESS.\n\nNo exact-main regression remains from the selected unit.\n\n## Owner-last classification\n\nNo new owner-local/manual evidence is required by P10-009. Real Unity `-executeMethod` positive/negative semantics were already genuinely exercised in the integrated P00 target evidence. This reconciliation does not mark the P10 phase exit gate, P21 Unity/Blender environment acceptance, or final acceptance as PASS.\n\n`OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner queue obligation; P04 remains `NOT_RUN`; `VERIFIED_FINAL_COMPLETE=false`.\n\n## Canonical consequence\n\nThis reconciliation candidate changes only P10-009 task state/provenance and the current next-action pointer. P10 remains `IN_PROGRESS`, `PHASE_EXIT_GATE=NOT_RUN`, P10-010 through P10-013 remain PENDING, and P11+ remain prohibited. After this reconciliation is normally merged and exact-main verified, the next legal cloud action is a fresh concurrency/claim sweep and then P10-010 only if it remains unclaimed and dependency-valid.\n'''
          evidence_path.write_text(evidence, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_PHASE.md docs/TASK_LEDGER.md evidence/phases/P10/P10_009_INTEGRATED_RECONCILIATION_2026-09-08.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'reconcile P10-009 integrated Editor automation'
          git push origin HEAD:worker/fccd-p10-009-reconciliation
