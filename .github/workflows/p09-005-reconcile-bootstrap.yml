name: P09-005 Reconciliation Bootstrap

on:
  push:
    branches:
      - reconcile/fccd-p09-005-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply fail-closed reconciliation
        run: python3 .github/p09-005-reconcile.py

      - name: Commit canonical reconciliation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "P09-005: reconcile integrated artifact validation closure"
          git push origin HEAD:refs/heads/reconcile/fccd-p09-005-integrated-closure
