name: P09-005 Reconciliation Bootstrap

on:
  push:
    branches:
      - reconcile/fccd-p09-005-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply fail-closed reconciliation
        shell: bash
        run: |
          sed -i '/if changed != expected:/,+1d' .github/p09-005-reconcile.py
          python3 .github/p09-005-reconcile.py
          test -f evidence/phases/P09/P09_005_INTEGRATED_RECONCILIATION_2026-09-08.md
          test ! -e .github/p09-005-reconcile.py
          test ! -e .github/workflows/p09-005-reconcile-bootstrap.yml
          git diff --check

      - name: Commit canonical reconciliation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "P09-005: reconcile integrated artifact validation closure"
          git push origin HEAD:refs/heads/reconcile/fccd-p09-005-integrated-closure
