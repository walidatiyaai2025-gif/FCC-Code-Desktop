name: TEMP P08-006 Reconciliation

on:
  push:
    branches:
      - reconcile/fccd-p08-006-integrated-closure
    paths:
      - .github/workflows/temp-p08-006-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v7
        with:
          ref: reconcile/fccd-p08-006-integrated-closure
          fetch-depth: 0

      - name: Guard exact accepted main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "e43ef53eb8b7826e8541875576a5fa097c5c81a4"
          test "$(git merge-base HEAD origin/main)" = "e43ef53eb8b7826e8541875576a5fa097c5c81a4"

      - name: Apply guarded canonical reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python .github/temp/p08-006-reconcile.py

      - name: Build final local reconciliation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "walidatiyaai2025-gif"
          git config user.email "walidatiyaai2025@gmail.com"
          git rm .github/temp/p08-006-reconcile.py .github/workflows/temp-p08-006-reconcile.yml
          git add CURRENT_PHASE.md PROJECT_CONTROL.md docs/TASK_LEDGER.md evidence/phases/P08/P08_006_INTEGRATED_RECONCILIATION_2026-09-07.md
          git commit -m "P08-006: reconcile integrated optional-shell closure"

      - name: Validate final durable scope
        shell: bash
        run: |
          set -euo pipefail
          expected=$'CURRENT_PHASE.md\nPROJECT_CONTROL.md\ndocs/TASK_LEDGER.md\nevidence/phases/P08/P08_006_INTEGRATED_RECONCILIATION_2026-09-07.md'
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          test "$actual" = "$expected"
          test "$(git rev-parse origin/main)" = "e43ef53eb8b7826e8541875576a5fa097c5c81a4"
          test "$(git merge-base HEAD origin/main)" = "e43ef53eb8b7826e8541875576a5fa097c5c81a4"

      - name: Push durable reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:reconcile/fccd-p08-006-integrated-closure
