name: P09-007 CI Diagnostic

on:
  push:
    branches:
      - diagnostic/p09-007-ci
    paths-ignore:
      - evidence/diagnostics/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: diagnostic/p09-007-ci

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Capture first baseline failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $resultPath = 'evidence/diagnostics/P09_007_CI_DIAGNOSIS.txt'
          New-Item -ItemType Directory -Force (Split-Path $resultPath) | Out-Null

          function Save-Failure {
              param([string]$Name, [int]$Code, [string[]]$Output)
              $tail = $Output | Select-Object -Last 180
              $lines = @(
                  "SOURCE_SHA=$env:GITHUB_SHA",
                  "FAILED_STAGE=$Name",
                  "EXIT_CODE=$Code",
                  '--- OUTPUT TAIL ---'
              ) + $tail
              $lines | Set-Content -LiteralPath $resultPath -Encoding utf8
          }

          function Invoke-Stage {
              param([string]$Name, [scriptblock]$Action)
              $output = @(& $Action 2>&1 | ForEach-Object { $_.ToString() })
              $code = $LASTEXITCODE
              if ($code -ne 0) {
                  Save-Failure -Name $Name -Code $code -Output $output
                  return $false
              }
              return $true
          }

          $ok = Invoke-Stage 'locked restore' { dotnet restore .\FCCCodeDesktop.sln --locked-mode --nologo }
          if ($ok) { $ok = Invoke-Stage 'format verification' { dotnet format .\FCCCodeDesktop.sln --verify-no-changes --no-restore } }
          if ($ok) { $ok = Invoke-Stage 'Release build' { dotnet build .\FCCCodeDesktop.sln -c Release --no-restore --nologo } }
          if ($ok) { $ok = Invoke-Stage 'unit/integration tests' { pwsh -NoProfile -File .\tools\testing\run-tests.ps1 -Suite all -Configuration Release -NoRestore -NoBuild } }

          if ($ok) {
              @(
                  "SOURCE_SHA=$env:GITHUB_SHA",
                  'RESULT=PASS',
                  'RESTORE=PASS',
                  'FORMAT=PASS',
                  'RELEASE_BUILD=PASS',
                  'TESTS=PASS'
              ) | Set-Content -LiteralPath $resultPath -Encoding utf8
          }

          git config user.name 'fccd-ci-diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git add -- $resultPath
          git commit -m 'ci(p09-007): capture diagnosis'
          git push origin HEAD:diagnostic/p09-007-ci
