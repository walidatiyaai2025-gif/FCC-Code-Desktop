name: P10-007 Unity EditMode Test Integration

on:
  push:
    branches:
      - main
    paths:
      - 'src/FCCCodeDesktop.Tools.Unity/UnityEditModeTestValidation.cs'
      - 'src/FCCCodeDesktop.Tools.Unity/UnityCliCommandBuilder.cs'
      - 'src/FCCCodeDesktop.Tools/ToolArtifactValidation.cs'
      - 'src/FCCCodeDesktop.Tools/CliProcessPrimitives.cs'
      - 'src/FCCCodeDesktop.Tools/ExternalToolContracts.cs'
      - 'tests/FCCCodeDesktop.UnityEditModeTestFixture/**'
      - 'tools/unity/validate-unity-editmode-tests.ps1'
      - '.github/workflows/p10-007-unity-editmode-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/FCCCodeDesktop.Tools.Unity/UnityEditModeTestValidation.cs'
      - 'src/FCCCodeDesktop.Tools.Unity/UnityCliCommandBuilder.cs'
      - 'src/FCCCodeDesktop.Tools/ToolArtifactValidation.cs'
      - 'src/FCCCodeDesktop.Tools/CliProcessPrimitives.cs'
      - 'src/FCCCodeDesktop.Tools/ExternalToolContracts.cs'
      - 'tests/FCCCodeDesktop.UnityEditModeTestFixture/**'
      - 'tools/unity/validate-unity-editmode-tests.ps1'
      - '.github/workflows/p10-007-unity-editmode-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10-007-unity-editmode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unity EditMode Test Integration
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Validate Unity EditMode integration
        shell: pwsh
        run: .\tools\unity\validate-unity-editmode-tests.ps1
