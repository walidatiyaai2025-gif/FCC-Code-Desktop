name: Repair Owner-Last P07 Transition Fixture

on:
  push:
    branches:
      - governance/p07-cloud-activation

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Repair phase-agnostic P22 negative fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $path = 'tools/final-acceptance/owner-last-policy-validator.ps1'
          $text = [IO.File]::ReadAllText((Join-Path $PWD $path))
          $old = "    Assert-Rejected { Assert-Contract `$root `$policyText `$queueText `$ledgerText (`$phaseText.Replace('CURRENT_PHASE: P06','CURRENT_PHASE: P22')) `$controlText `$targetText `$finalText `$false } 'P22 with queue unresolved'"
          $new = @'
              $phaseP22 = $phaseText -replace '(?m)^CURRENT_PHASE:\s*P\d{2}\s*$', 'CURRENT_PHASE: P22'
              $controlP22 = $controlText -replace '(?m)^CURRENT_PHASE:\s*P\d{2}\s*$', 'CURRENT_PHASE: P22'
              Assert-Rejected { Assert-Contract $root $policyText $queueText $ledgerText $phaseP22 $controlP22 $targetText $finalText $false } 'P22 with queue unresolved'
          '@.TrimEnd()
          if (-not $text.Contains($old, [StringComparison]::Ordinal)) {
            throw 'Expected stale P06-specific P22 negative fixture was not found.'
          }
          $text = $text.Replace($old, $new, [StringComparison]::Ordinal)
          [IO.File]::WriteAllText((Join-Path $PWD $path), $text, [Text.UTF8Encoding]::new($false))

          & .\tools\final-acceptance\owner-last-policy-validator.ps1 -RunNegativeFixtures
          if ($LASTEXITCODE -ne 0) { throw "Owner-last negative fixtures failed with exit code $LASTEXITCODE." }

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

          git rm -- .github/workflows/repair-owner-last-p07-transition.yml
          git add -- tools/final-acceptance/owner-last-policy-validator.ps1
          $status = @(git status --porcelain)
          if ($status.Count -ne 2) { throw "Expected validator repair plus temporary workflow deletion; status=$($status -join '; ')" }

          git config user.name 'fcc-cloud-worker'
          git config user.email 'fcc-cloud-worker@users.noreply.github.com'
          git commit -m 'test: make owner-last P22 fixture phase-agnostic'
          git push origin HEAD:governance/p07-cloud-activation
