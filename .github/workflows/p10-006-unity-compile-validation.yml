name: P10-006 Unity Compile Validation

on:
  push:
    branches:
      - main
    paths:
      - 'src/FCCCodeDesktop.Tools.Unity/UnityCompileValidation.cs'
      - 'src/FCCCodeDesktop.Tools.Unity/UnityLogCapture.cs'
      - 'src/FCCCodeDesktop.Tools/CliProcessPrimitives.cs'
      - 'src/FCCCodeDesktop.Tools/ExternalToolContracts.cs'
      - 'tests/FCCCodeDesktop.UnityCompileValidationFixture/**'
      - 'tools/unity/validate-unity-compile.ps1'
      - '.github/workflows/p10-006-unity-compile-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/FCCCodeDesktop.Tools.Unity/UnityCompileValidation.cs'
      - 'src/FCCCodeDesktop.Tools.Unity/UnityLogCapture.cs'
      - 'src/FCCCodeDesktop.Tools/CliProcessPrimitives.cs'
      - 'src/FCCCodeDesktop.Tools/ExternalToolContracts.cs'
      - 'tests/FCCCodeDesktop.UnityCompileValidationFixture/**'
      - 'tools/unity/validate-unity-compile.ps1'
      - '.github/workflows/p10-006-unity-compile-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10-006-unity-compile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unity Compile Validation
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Validate Unity compile outcome
        shell: pwsh
        run: .\tools\unity\validate-unity-compile.ps1
