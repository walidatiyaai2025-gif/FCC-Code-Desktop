name: P09-004 Reconciliation Bootstrap

on:
  push:
    branches:
      - reconcile/fccd-p09-004-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    name: Reconcile P09-004
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: reconcile/fccd-p09-004-integrated-closure
          fetch-depth: 0

      - name: Apply fail-closed reconciliation
        shell: bash
        run: python3 .github/p09-004-reconcile-bootstrap.py

      - name: Validate exact change set and push
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          printf '%s\n' "${changed[@]}"
          expected=(
            ".github/p09-004-reconcile-bootstrap.py"
            ".github/workflows/p09-004-reconcile-bootstrap.yml"
            "CURRENT_PHASE.md"
            "docs/TASK_LEDGER.md"
            "evidence/phases/P09/P09_004_INTEGRATED_RECONCILIATION_2026-09-08.md"
          )
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null || { echo "Missing expected change: $path"; exit 1; }
          done
          if [ "${#changed[@]}" -ne 5 ]; then
            echo "Unexpected reconciliation change count: ${#changed[@]}"
            exit 1
          fi
          git config user.name "fccd-reconciliation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "P09-004: reconcile integrated resource locking closure"
          git push origin HEAD:reconcile/fccd-p09-004-integrated-closure
