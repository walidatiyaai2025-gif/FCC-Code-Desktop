name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Windows Release
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Validate CI contract
        shell: pwsh
        run: .\tools\ci\validate-windows-ci.ps1 -RequireDotNet

      - name: Run Windows Release baseline
        shell: pwsh
        run: .\tools\ci\run-windows-ci.ps1

      - name: Validate P05-005 task state machine
        shell: pwsh
        run: .\tools\ui\validate-task-state-machine.ps1 -RunFixtures -RequireRuntime

      - name: Validate P05-006 stop cancel retry UX
        shell: pwsh
        run: .\tools\ui\validate-task-controls.ps1 -RunFixtures -RequireRuntime

      - name: Validate P05-007 Markdown code diff rendering
        shell: pwsh
        run: .\tools\ui\validate-conversation-content-rendering.ps1 -RunFixtures -RequireRuntime

      - name: Validate P05-008 conversation virtualization performance
        shell: pwsh
        run: .\tools\ui\validate-conversation-virtualization.ps1 -RunFixtures -RequireRuntime

      - name: Validate P06-001 project workflows
        shell: pwsh
        run: .\tools\projects\validate-project-workflows.ps1 -RunFixtures -RequireRuntime

      - name: Validate P06-002 project technology detection
        shell: pwsh
        run: .\tools\projects\validate-project-technology-detection.ps1 -RunFixtures -RequireRuntime

      - name: Validate P06-003 lazy file explorer
        shell: pwsh
        run: .\tools\projects\validate-lazy-file-explorer.ps1 -RunFixtures -RequireRuntime

      - name: Validate P06-005 local code editor
        shell: pwsh
        run: .\tools\ui\validate-local-code-editor.ps1 -RunFixtures -RequireRuntime
