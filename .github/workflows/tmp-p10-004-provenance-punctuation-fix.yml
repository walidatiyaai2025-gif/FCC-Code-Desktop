name: Temporary P10-004 Provenance Punctuation Repair

on:
  push:
    branches:
      - worker/fccd-p10-004-unity-resource-locking

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Repair provenance punctuation and self-remove
        shell: bash
        env:
          EXPECTED_PARENT: 3e6e62a1cd7bc219b7be278cdfc9f4a22f385e74
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          if [ "$actual_parent" != "$EXPECTED_PARENT" ]; then
            echo "Refusing stale repair: expected parent $EXPECTED_PARENT, got $actual_parent" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/TASK_LEDGER.md')
          text = p.read_text(encoding='utf-8')
          old = 'and does not disclose raw project paths PR #239 was normally merged as'
          new = 'and does not disclose raw project paths. PR #239 was normally merged as'
          if text.count(old) != 1:
              raise SystemExit(f'punctuation marker count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-p10-004-provenance-punctuation-fix.yml
          git add docs/TASK_LEDGER.md
          git diff --cached --check
          git commit -m "P10-004: fix reconciliation provenance punctuation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
