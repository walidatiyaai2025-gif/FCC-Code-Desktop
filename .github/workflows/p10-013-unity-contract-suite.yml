name: P10-013 Unity Contract Suite

on:
  push:
    branches:
      - main
    paths:
      - 'src/FCCCodeDesktop.Tools.Unity/**'
      - 'tests/FCCCodeDesktop.Unity*Fixture/**'
      - 'tools/unity/**'
      - '.github/workflows/p10-013-unity-contract-suite.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/FCCCodeDesktop.Tools.Unity/**'
      - 'tests/FCCCodeDesktop.Unity*Fixture/**'
      - 'tools/unity/**'
      - '.github/workflows/p10-013-unity-contract-suite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10-013-unity-contract-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unity Contract Suite
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Validate complete Unity contract suite
        shell: pwsh
        run: .\tools\unity\validate-unity-contract-suite.ps1
