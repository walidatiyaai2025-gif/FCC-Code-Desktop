name: P01-004 Minimal Solution Recovery

on:
  push:
    branches:
      - validation/p01-004-minimal-sln-fa809d2

permissions:
  contents: write

jobs:
  recover:
    runs-on: windows-2025
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Prepare worker checkout
        shell: pwsh
        run: |
          Copy-Item .\tools\validation\p01-004-minimal-sln.ps1 (Join-Path $env:RUNNER_TEMP 'p01-004-minimal-sln.ps1')
          git checkout worker/fccd-p01-004-test-infrastructure
          if ($LASTEXITCODE -ne 0) { throw 'Failed to checkout worker branch.' }
          if ((git rev-parse HEAD) -ne 'fa809d264a1eb4c9e94d3c9096684224bbf4788b') { throw 'Worker head moved unexpectedly.' }
          if ((dotnet --version) -ne '10.0.400') { throw 'SDK mismatch.' }

      - name: Restore minimal solution structure
        shell: pwsh
        run: '& (Join-Path $env:RUNNER_TEMP ''p01-004-minimal-sln.ps1'')'

      - name: Locked restore
        shell: pwsh
        run: dotnet restore .\FCCCodeDesktop.sln --locked-mode --nologo

      - name: Formatting
        shell: pwsh
        run: dotnet format .\FCCCodeDesktop.sln --verify-no-changes --no-restore

      - name: Release build
        shell: pwsh
        run: dotnet build .\FCCCodeDesktop.sln -c Release --no-restore --nologo

      - name: Validate test infrastructure
        shell: pwsh
        run: .\tools\testing\validate-test-infrastructure.ps1 -RequireDotNet

      - name: Validate dependency policy
        shell: pwsh
        run: .\tools\dependencies\validate-dependency-policy.ps1 -RequireDotNet

      - name: Validate quality policy
        shell: pwsh
        run: .\tools\quality\validate-quality-policy.ps1 -RequireDotNet

      - name: Commit minimal solution
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff hygiene failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- FCCCodeDesktop.sln
          $staged = git diff --cached --name-only
          if (($staged | Measure-Object).Count -ne 1 -or $staged -ne 'FCCCodeDesktop.sln') { throw "Unexpected staged files: $staged" }
          git commit -m 'P01-004: preserve canonical solution structure'
          git push origin HEAD:refs/heads/worker/fccd-p01-004-test-infrastructure
          Write-Host "RECOVERED_HEAD=$(git rev-parse HEAD)"
