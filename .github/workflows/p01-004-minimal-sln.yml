name: P01-004 Minimal Solution Recovery

on:
  push:
    branches:
      - validation/p01-004-minimal-sln-fa809d2

permissions:
  contents: write

jobs:
  recover:
    runs-on: windows-2025
    steps:
      - name: Checkout worker branch
        uses: actions/checkout@v4
        with:
          ref: worker/fccd-p01-004-test-infrastructure
          fetch-depth: 0

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Verify recovery base
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne 'fa809d264a1eb4c9e94d3c9096684224bbf4788b') { throw 'Worker head moved unexpectedly.' }
          if ((dotnet --version) -ne '10.0.400') { throw 'SDK mismatch.' }

      - name: Restore minimal solution structure
        shell: pwsh
        run: |
          git checkout a2d52fd144a345c4d3aaefed73e46799de6dc69b -- FCCCodeDesktop.sln
          $path = Join-Path $PWD 'FCCCodeDesktop.sln'
          $text = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")

          $projectBlock = @'
Project("{66A26720-8FB5-11D2-AA7E-00C04F688DDE}") = "tests", "tests", "{0AB3BF05-4346-4AA6-1389-037BE0695223}"
EndProject
Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "FCCCodeDesktop.Testing", "tests\FCCCodeDesktop.Testing\FCCCodeDesktop.Testing.csproj", "{6433EEF5-263A-4E38-AAB1-BB2E67EC114F}"
EndProject
Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "FCCCodeDesktop.UnitTests", "tests\FCCCodeDesktop.UnitTests\FCCCodeDesktop.UnitTests.csproj", "{269C3259-7F9A-4DB1-B474-534FCBFC2779}"
EndProject
Project("{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}") = "FCCCodeDesktop.IntegrationTests", "tests\FCCCodeDesktop.IntegrationTests\FCCCodeDesktop.IntegrationTests.csproj", "{86983556-6FCD-468C-A6DE-77097534C8EC}"
EndProject
'@
          $marker = "EndProject`nGlobal"
          if (-not $text.Contains($marker)) { throw 'Could not locate solution project/global boundary.' }
          $text = $text.Replace($marker, "EndProject`n$projectBlock" + "Global")

          $updaterConfigs = @'
		{06E71D8A-1992-5BE6-9081-A7747AB84204}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
		{06E71D8A-1992-5BE6-9081-A7747AB84204}.Debug|Any CPU.Build.0 = Debug|Any CPU
		{06E71D8A-1992-5BE6-9081-A7747AB84204}.Release|Any CPU.ActiveCfg = Release|Any CPU
		{06E71D8A-1992-5BE6-9081-A7747AB84204}.Release|Any CPU.Build.0 = Release|Any CPU
'@
          $testConfigs = @'
		{6433EEF5-263A-4E38-AAB1-BB2E67EC114F}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
		{6433EEF5-263A-4E38-AAB1-BB2E67EC114F}.Debug|Any CPU.Build.0 = Debug|Any CPU
		{6433EEF5-263A-4E38-AAB1-BB2E67EC114F}.Release|Any CPU.ActiveCfg = Release|Any CPU
		{6433EEF5-263A-4E38-AAB1-BB2E67EC114F}.Release|Any CPU.Build.0 = Release|Any CPU
		{269C3259-7F9A-4DB1-B474-534FCBFC2779}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
		{269C3259-7F9A-4DB1-B474-534FCBFC2779}.Debug|Any CPU.Build.0 = Debug|Any CPU
		{269C3259-7F9A-4DB1-B474-534FCBFC2779}.Release|Any CPU.ActiveCfg = Release|Any CPU
		{269C3259-7F9A-4DB1-B474-534FCBFC2779}.Release|Any CPU.Build.0 = Release|Any CPU
		{86983556-6FCD-468C-A6DE-77097534C8EC}.Debug|Any CPU.ActiveCfg = Debug|Any CPU
		{86983556-6FCD-468C-A6DE-77097534C8EC}.Debug|Any CPU.Build.0 = Debug|Any CPU
		{86983556-6FCD-468C-A6DE-77097534C8EC}.Release|Any CPU.ActiveCfg = Release|Any CPU
		{86983556-6FCD-468C-A6DE-77097534C8EC}.Release|Any CPU.Build.0 = Release|Any CPU
'@
          $configMarker = $updaterConfigs + "`tEndGlobalSection"
          if (-not $text.Contains($configMarker)) { throw 'Could not locate project configuration boundary.' }
          $text = $text.Replace($configMarker, $updaterConfigs + $testConfigs + "`tEndGlobalSection")

          $nestedMarker = "`t`t{06E71D8A-1992-5BE6-9081-A7747AB84204} = {62D5EF03-65C2-51DC-B8C4-28D4D1D66754}`n`tEndGlobalSection"
          $nestedReplacement = "`t`t{06E71D8A-1992-5BE6-9081-A7747AB84204} = {62D5EF03-65C2-51DC-B8C4-28D4D1D66754}`n`t`t{6433EEF5-263A-4E38-AAB1-BB2E67EC114F} = {0AB3BF05-4346-4AA6-1389-037BE0695223}`n`t`t{269C3259-7F9A-4DB1-B474-534FCBFC2779} = {0AB3BF05-4346-4AA6-1389-037BE0695223}`n`t`t{86983556-6FCD-468C-A6DE-77097534C8EC} = {0AB3BF05-4346-4AA6-1389-037BE0695223}`n`tEndGlobalSection"
          if (-not $text.Contains($nestedMarker)) { throw 'Could not locate nested-project boundary.' }
          $text = $text.Replace($nestedMarker, $nestedReplacement)

          if ($text -match '\|(x64|x86)') { throw 'Unexpected x64/x86 solution configuration introduced.' }
          foreach ($required in @('"src", "src"','"tests", "tests"','FCCCodeDesktop.Testing.csproj','FCCCodeDesktop.UnitTests.csproj','FCCCodeDesktop.IntegrationTests.csproj')) {
            if (-not $text.Contains($required)) { throw "Missing required solution entry: $required" }
          }
          $srcNestedCount = ([regex]::Matches($text, '= \{62D5EF03-65C2-51DC-B8C4-28D4D1D66754\}')).Count
          if ($srcNestedCount -ne 16) { throw "Expected 16 preserved src nesting entries, found $srcNestedCount." }
          $testsNestedCount = ([regex]::Matches($text, '= \{0AB3BF05-4346-4AA6-1389-037BE0695223\}')).Count
          if ($testsNestedCount -ne 3) { throw "Expected 3 tests nesting entries, found $testsNestedCount." }

          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Validate exact solution shape
        shell: pwsh
        run: |
          $listed = dotnet sln .\FCCCodeDesktop.sln list | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Solution list failed.' }
          foreach ($project in @('FCCCodeDesktop.Testing.csproj','FCCCodeDesktop.UnitTests.csproj','FCCCodeDesktop.IntegrationTests.csproj')) {
            if ($listed -notmatch [regex]::Escape($project)) { throw "Missing $project from solution list." }
          }
          $diff = git diff -- FCCCodeDesktop.sln | Out-String
          if ($diff -match 'Debug\|x64|Debug\|x86|Release\|x64|Release\|x86') { throw 'Platform configuration churn remains in solution diff.' }
          if ($diff -match '^-.*= \{62D5EF03-65C2-51DC-B8C4-28D4D1D66754\}') { throw 'Existing src nesting was removed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Solution diff hygiene failed.' }

      - name: Locked restore
        shell: pwsh
        run: dotnet restore .\FCCCodeDesktop.sln --locked-mode --nologo

      - name: Formatting
        shell: pwsh
        run: dotnet format .\FCCCodeDesktop.sln --verify-no-changes --no-restore

      - name: Release build
        shell: pwsh
        run: dotnet build .\FCCCodeDesktop.sln -c Release --no-restore --nologo

      - name: Validate test infrastructure
        shell: pwsh
        run: .\tools\testing\validate-test-infrastructure.ps1 -RequireDotNet

      - name: Validate dependency policy
        shell: pwsh
        run: .\tools\dependencies\validate-dependency-policy.ps1 -RequireDotNet

      - name: Validate quality policy
        shell: pwsh
        run: .\tools\quality\validate-quality-policy.ps1 -RequireDotNet

      - name: Commit minimal solution
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- FCCCodeDesktop.sln
          $other = git diff --cached --name-only | Where-Object { $_ -ne 'FCCCodeDesktop.sln' }
          if ($other) { throw "Unexpected staged files: $other" }
          git commit -m 'P01-004: preserve canonical solution structure'
          git push origin HEAD:refs/heads/worker/fccd-p01-004-test-infrastructure
          Write-Host "RECOVERED_HEAD=$(git rev-parse HEAD)"
