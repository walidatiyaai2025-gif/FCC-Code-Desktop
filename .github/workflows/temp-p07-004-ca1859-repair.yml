name: Temporary P07-004 CA1859 repair

on:
  push:
    branches:
      - worker-b/fccd-p07-004-stage-unstage

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Apply guarded analyzer repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/FCCCodeDesktop.Git/GitCliIndexService.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'private static IReadOnlyList<string> NormalizeMutationPaths(': 'private static List<string> NormalizeMutationPaths(',
              'private static IReadOnlyList<string> ExpandRenamePairs(': 'private static List<string> ExpandRenamePairs(',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guard failed for {old!r}: expected 1 occurrence, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-p07-004-ca1859-repair.yml
          git add src/FCCCodeDesktop.Git/GitCliIndexService.cs
          git commit -m "FCCD-P07-004: satisfy CA1859 analyzer"
          git push origin HEAD:worker-b/fccd-p07-004-stage-unstage
