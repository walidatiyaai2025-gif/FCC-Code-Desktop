name: P10-005 Integrated Reconciliation Bootstrap

on:
  push:
    branches:
      - worker/fccd-p10-005-integrated-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: windows-2025
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v7
        with:
          ref: worker/fccd-p10-005-integrated-reconciliation
          fetch-depth: 0

      - name: Reconcile P10-005 durable state and self-remove bootstrap
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedBase = 'af7f79ed81ca57b5412bba4dbb2cd11c2cd100c9'
          git merge-base --is-ancestor $expectedBase HEAD
          if ($LASTEXITCODE -ne 0) { throw "Expected base $expectedBase is not an ancestor of branch HEAD." }
          $bootstrapPath = '.github/workflows/fccd-p10-005-reconciliation-bootstrap.yml'
          $unexpected = @(git diff --name-only $expectedBase HEAD | Where-Object { $_ -ne $bootstrapPath })
          if ($unexpected.Count -ne 0) { throw "Unexpected pre-reconciliation branch changes: $($unexpected -join ', ')" }

          function Decode-Utf8([string]$value) {
            return [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($value))
          }

          $provenanceB64 = ''
          $nextActionB64 = ''
          $evidenceB64 = ''

          $currentPath = 'CURRENT_PHASE.md'
          $current = Get-Content -LiteralPath $currentPath -Raw
          $oldCurrentRow = '- `FCCD-P10-005` — Dedicated Unity log capture/parser — PENDING.'
          $newCurrentRow = '- `FCCD-P10-005` — Dedicated Unity log capture/parser — CLOSED.'
          if (([regex]::Matches($current, [regex]::Escape($oldCurrentRow))).Count -ne 1) { throw 'Expected exactly one P10-005 PENDING inventory row in CURRENT_PHASE.md.' }
          if ($current.Contains($newCurrentRow)) { throw 'CURRENT_PHASE.md already contains P10-005 CLOSED unexpectedly.' }
          $current = $current.Replace($oldCurrentRow, $newCurrentRow)
          if ($current.Contains('## P10-005 integration provenance')) { throw 'P10-005 provenance already exists unexpectedly.' }
          $current = $current.TrimEnd() + "`r`n`r`n" + (Decode-Utf8 $provenanceB64).TrimEnd() + "`r`n"
          [IO.File]::WriteAllText((Join-Path $PWD $currentPath), $current, [Text.UTF8Encoding]::new($false))

          $ledgerPath = 'docs/TASK_LEDGER.md'
          $ledger = Get-Content -LiteralPath $ledgerPath -Raw
          $oldLedgerRow = '| FCCD-P10-005 | Dedicated Unity log capture/parser | PENDING |'
          $newLedgerRow = '| FCCD-P10-005 | Dedicated Unity log capture/parser | CLOSED |'
          if (([regex]::Matches($ledger, [regex]::Escape($oldLedgerRow))).Count -ne 1) { throw 'Expected exactly one P10-005 PENDING ledger row.' }
          if ($ledger.Contains($newLedgerRow)) { throw 'TASK_LEDGER.md already contains P10-005 CLOSED unexpectedly.' }
          $ledger = $ledger.Replace($oldLedgerRow, $newLedgerRow)
          $nextActionPattern = '(?s)## Current next action\r?\n.*?(?=\r?\n<!-- FCCD-P08-004-FINAL-CLOSURE-PROVENANCE -->)'
          if ([regex]::Matches($ledger, $nextActionPattern).Count -ne 1) { throw 'Expected exactly one Current next action section.' }
          $ledger = [regex]::Replace($ledger, $nextActionPattern, (Decode-Utf8 $nextActionB64).TrimEnd())
          [IO.File]::WriteAllText((Join-Path $PWD $ledgerPath), $ledger, [Text.UTF8Encoding]::new($false))

          $evidencePath = 'evidence/phases/P10/P10_005_INTEGRATED_RECONCILIATION_2026-09-08.md'
          if (Test-Path -LiteralPath $evidencePath) { throw "$evidencePath already exists unexpectedly." }
          [IO.File]::WriteAllText((Join-Path $PWD $evidencePath), (Decode-Utf8 $evidenceB64), [Text.UTF8Encoding]::new($false))

          Remove-Item -LiteralPath $bootstrapPath
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CURRENT_PHASE.md docs/TASK_LEDGER.md $evidencePath $bootstrapPath
          $status = git status --short
          if (-not $status) { throw 'Reconciliation produced no durable changes.' }
          Write-Host $status
          git commit -m 'docs(P10-005): reconcile integrated closure'
          if ($LASTEXITCODE -ne 0) { throw 'Reconciliation commit failed.' }
          git push origin HEAD:worker/fccd-p10-005-integrated-reconciliation
          if ($LASTEXITCODE -ne 0) { throw 'Reconciliation push failed.' }
