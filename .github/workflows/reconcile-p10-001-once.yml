name: P10-001 Reconciliation Once

on:
  push:
    branches:
      - reconcile/fccd-p10-001-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile canonical P10-001 state
        shell: bash
        run: |
          set -euo pipefail
          expected_main=5dae18f48f7519a7d67fbdf56ccbdb3ef1a8ae9d
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected_main"
          python tools/reconciliation/p10_001_reconcile_once.py
          rm .github/workflows/reconcile-p10-001-once.yml
          rm tools/reconciliation/p10_001_reconcile_once.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile integrated P10-001 closure"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected_main"
          git push origin HEAD:reconcile/fccd-p10-001-integrated-closure
