name: TEMP P07-010 Reconcile

on:
  push:
    branches:
      - reconcile/fccd-p07-010-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run guarded reconciliation
        run: python .github/temp/p07-010-reconcile.py
