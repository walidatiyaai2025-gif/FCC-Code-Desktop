name: Temporary P07-009 Reconciliation

on:
  push:
    branches:
      - reconcile/fccd-p07-009-integrated-closure
    paths:
      - .github/workflows/temp-p07-009-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Guard exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b534fd7d1d23b1727cc68a7a588d8ab4e5ce5fcb"
          test "$(git merge-base HEAD origin/main)" = "b534fd7d1d23b1727cc68a7a588d8ab4e5ce5fcb"
      - name: Apply guarded reconciliation
        run: python .github/temp/p07-009-reconcile.py
      - name: Verify durable scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only origin/main -- | sort)
          printf '%s\n' "${files[@]}"
          expected=(
            "CURRENT_PHASE.md"
            "PROJECT_CONTROL.md"
            "docs/TASK_LEDGER.md"
            "evidence/phases/P07/P07_009_INTEGRATED_RECONCILIATION_2026-09-07.md"
          )
          if [ "${#files[@]}" -ne "${#expected[@]}" ]; then exit 1; fi
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
          ! grep -q 'FCCD-P07-010.*CLOSED' CURRENT_PHASE.md
          ! grep -q 'FCCD-P07-011.*CLOSED' CURRENT_PHASE.md
          grep -q 'KNOWN_RELEASE_BLOCKERS: 2' CURRENT_PHASE.md
          grep -q 'VERIFIED_FINAL_COMPLETE: false' CURRENT_PHASE.md
      - name: Commit canonical reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "walidatiyaai2025-gif"
          git config user.email "walidatiyaai2025@gmail.com"
          git add CURRENT_PHASE.md PROJECT_CONTROL.md docs/TASK_LEDGER.md evidence/phases/P07/P07_009_INTEGRATED_RECONCILIATION_2026-09-07.md .github/temp/p07-009-reconcile.py .github/workflows/temp-p07-009-reconcile.yml
          git commit -m "FCCD-P07-009: reconcile integrated dirty provenance closure"
          git push origin HEAD:reconcile/fccd-p07-009-integrated-closure
