name: P10-005 Unity Log Capture Parser

on:
  push:
    branches:
      - main
    paths:
      - 'src/FCCCodeDesktop.Tools.Unity/UnityLogCapture.cs'
      - 'tests/FCCCodeDesktop.UnityLogCaptureFixture/**'
      - 'tools/unity/validate-unity-log-capture.ps1'
      - '.github/workflows/p10-005-unity-log-capture.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/FCCCodeDesktop.Tools.Unity/UnityLogCapture.cs'
      - 'tests/FCCCodeDesktop.UnityLogCaptureFixture/**'
      - 'tools/unity/validate-unity-log-capture.ps1'
      - '.github/workflows/p10-005-unity-log-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10-005-unity-log-capture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unity Log Capture Parser Validation
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Validate Unity log capture/parser
        shell: pwsh
        run: .\tools\unity\validate-unity-log-capture.ps1
