name: P01-004 Exact Validation

on:
  push:
    branches:
      - validation/p01-004-exact-fa809d2

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: windows-2025
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: fa809d264a1eb4c9e94d3c9096684224bbf4788b
          fetch-depth: 0

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Verify exact candidate
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne 'fa809d264a1eb4c9e94d3c9096684224bbf4788b') { throw 'Candidate SHA mismatch.' }
          if ((dotnet --version) -ne '10.0.400') { throw 'SDK mismatch.' }
          git diff --check a2d52fd144a345c4d3aaefed73e46799de6dc69b..HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Locked restore
        shell: pwsh
        run: dotnet restore .\FCCCodeDesktop.sln --locked-mode --nologo

      - name: Formatting
        shell: pwsh
        run: dotnet format .\FCCCodeDesktop.sln --verify-no-changes --no-restore

      - name: Release build
        shell: pwsh
        run: dotnet build .\FCCCodeDesktop.sln -c Release --no-restore --nologo

      - name: Validate test infrastructure
        shell: pwsh
        run: .\tools\testing\validate-test-infrastructure.ps1 -RequireDotNet

      - name: Validate dependency policy
        shell: pwsh
        run: .\tools\dependencies\validate-dependency-policy.ps1 -RequireDotNet

      - name: Validate quality policy
        shell: pwsh
        run: .\tools\quality\validate-quality-policy.ps1 -RequireDotNet

      - name: Verify clean tracked worktree
        shell: pwsh
        run: |
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) { throw "Tracked worktree changed during exact validation:`n$dirty" }
