name: P09 Canonical Closure Bootstrap

on:
  push:
    branches:
      - close/p09-canonical

permissions:
  contents: write
  actions: read

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE: 499b042f93efe764465aa1d2ea0f2d0c62188a4b
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Wait for exact-main P09 gates
        shell: bash
        run: |
          set -euo pipefail
          runs=(34195027792 34195027743 34195027756 34195027724)
          for attempt in $(seq 1 80); do
            pending=0
            for run in "${runs[@]}"; do
              status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.status')
              conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.conclusion // ""')
              echo "run=${run} status=${status} conclusion=${conclusion}"
              if [[ "$status" != "completed" ]]; then pending=1; continue; fi
              if [[ "$conclusion" != "success" ]]; then exit 1; fi
            done
            if [[ "$pending" == 0 ]]; then break; fi
            if [[ "$attempt" == 80 ]]; then exit 1; fi
            sleep 15
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$CANDIDATE"
      - name: Guard canonical pre-closure state
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'CURRENT_PHASE: P09' CURRENT_PHASE.md
          grep -F 'CURRENT_PHASE_STATE: IN_PROGRESS' CURRENT_PHASE.md
          grep -F 'NEXT_PHASE: P10' CURRENT_PHASE.md
          grep -F 'PHASE_EXIT_GATE: NOT_RUN' CURRENT_PHASE.md
          test "$(grep -E '^\| FCCD-P09-00[1-8] .*\| CLOSED \|$' docs/TASK_LEDGER.md | wc -l)" -eq 8
          test ! -e evidence/phases/P09/CLOSURE.md
          grep -F 'OWNER-P04-008-REAL-TARGET' docs/FINAL_OWNER_ACCEPTANCE_QUEUE.md
      - name: Write canonical P09 closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          candidate = "499b042f93efe764465aa1d2ea0f2d0c62188a4b"

          cp = Path("CURRENT_PHASE.md")
          text = cp.read_text(encoding="utf-8")
          if text.count("CURRENT_PHASE_STATE: IN_PROGRESS") < 1 or text.count("PHASE_EXIT_GATE: NOT_RUN") < 1:
              raise SystemExit("CURRENT_PHASE state guard failed")
          text = text.replace("CURRENT_PHASE_STATE: IN_PROGRESS", "CURRENT_PHASE_STATE: CLOSED", 1)
          text = text.replace("PHASE_EXIT_GATE: NOT_RUN", "PHASE_EXIT_GATE: PASS", 1)
          lines = text.splitlines(keepends=True)
          out = []
          replaced_active = False
          replaced_invariant = False
          for line in lines:
              if line.startswith("P09 ") and "sole legal cloud implementation/convergence phase" in line:
                  out.append("P09 - External Tool Gateway - is canonically CLOSED in this closure state. All eight mandatory P09 tasks are normally integrated and exact-main verified on candidate `" + candidate + "`; dedicated P09 exit run `34195027724` passed on that exact candidate. Canonical closure evidence is `evidence/phases/P09/CLOSURE.md`.\n")
                  replaced_active = True
              elif line.strip() == "- Exactly one cloud implementation/convergence phase is active: P09.":
                  out.append("- P09 is CLOSED and retained as the current closure checkpoint until a separate validated transition activates P10; no P10 or later implementation is authorized yet.\n")
                  replaced_invariant = True
              else:
                  out.append(line)
          if not replaced_active or not replaced_invariant:
              raise SystemExit("CURRENT_PHASE narrative guard failed")
          text = "".join(out)
          marker = "<!-- P09-PHASE-EXIT-CLOSURE -->"
          if marker not in text:
              anchor = "## P08 cloud task inventory"
              block = f"""{marker}\n## P09 phase-exit provenance\n\n- Exact pre-closure canonical candidate: `{candidate}`.\n- All eight mandatory P09 task rows were CLOSED before the gate.\n- Exact candidate Windows CI: run `34195027792` / #635 - SUCCESS.\n- Exact candidate P06-007 Workspace Search: run `34195027743` / #364 - SUCCESS.\n- Exact candidate P06-008 Large Workspace Safeguards: run `34195027756` / #348 - SUCCESS.\n- Dedicated P09 External Tool Gateway Exit: run `34195027724` / job `101960766198` - SUCCESS.\n- Canonical closure evidence: `evidence/phases/P09/CLOSURE.md`.\n- P09 phase state: `CLOSED`; `PHASE_EXIT_GATE=PASS`; phase-local blockers/regressions: none.\n- `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item; `VERIFIED_FINAL_COMPLETE=false`.\n- P10 is only the authorized next phase and is not active until a separate governance transition is normally integrated and exact-main verified.\n\n"""
              if anchor not in text:
                  raise SystemExit("CURRENT_PHASE provenance anchor missing")
              text = text.replace(anchor, block + anchor, 1)
          cp.write_text(text, encoding="utf-8")

          pc = Path("PROJECT_CONTROL.md")
          text = pc.read_text(encoding="utf-8")
          if text.count("CURRENT_PHASE_STATE: IN_PROGRESS") < 1 or text.count("PHASE_EXIT_GATE: NOT_RUN") < 1:
              raise SystemExit("PROJECT_CONTROL state guard failed")
          text = text.replace("CURRENT_PHASE_STATE: IN_PROGRESS", "CURRENT_PHASE_STATE: CLOSED", 1)
          text = text.replace("PHASE_EXIT_GATE: NOT_RUN", "PHASE_EXIT_GATE: PASS", 1)
          closure_line = f"P09 - External Tool Gateway - is canonically CLOSED on exact candidate `{candidate}` after all eight tasks were integrated/reconciled and exact candidate Windows CI `34195027792`, Workspace Search `34195027743`, Large Workspace Safeguards `34195027756`, and dedicated P09 exit run `34195027724` completed SUCCESS. `CURRENT_PHASE` deliberately remains P09 until a separate post-closure transition activates P10. `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release blocker and `VERIFIED_FINAL_COMPLETE=false`.\n\n"
          if closure_line not in text:
              anchor = "---\n\n## 3. Complete v1.0.0 boundary"
              if anchor not in text:
                  raise SystemExit("PROJECT_CONTROL insertion anchor missing")
              text = text.replace(anchor, closure_line + anchor, 1)
          pc.write_text(text, encoding="utf-8")

          ledger = Path("docs/TASK_LEDGER.md")
          text = ledger.read_text(encoding="utf-8")
          old = "All eight mandatory P09 task rows are CLOSED in this reconciliation candidate. P09 remains `IN_PROGRESS` with `PHASE_EXIT_GATE=NOT_RUN`; P10 remains prohibited until the dedicated P09 exit gate and canonical phase closure complete."
          new = f"All eight mandatory P09 task rows are canonically CLOSED. Exact pre-closure candidate `{candidate}` passed Windows CI `34195027792`, Workspace Search `34195027743`, Large Workspace Safeguards `34195027756`, and dedicated P09 exit run `34195027724`; canonical phase closure is `evidence/phases/P09/CLOSURE.md`. P09 is `CLOSED` with `PHASE_EXIT_GATE=PASS`; P10 remains inactive until a separate governance transition is integrated and exact-main verified."
          if old not in text:
              raise SystemExit("TASK_LEDGER phase note guard missing")
          text = text.replace(old, new, 1)
          ledger.write_text(text, encoding="utf-8")
          PY
          cat > evidence/phases/P09/CLOSURE.md <<'EOF'
          # P09 Phase Closure - External Tool Gateway

          ```text
          PHASE: P09
          PHASE_NAME: External Tool Gateway
          CANDIDATE_SHA: 499b042f93efe764465aa1d2ea0f2d0c62188a4b
          DATE: 2026-09-08
          EXIT_GATE: PASS
          KNOWN_BLOCKERS: 0
          KNOWN_REGRESSIONS: 0
          MANDATORY_TASKS: 8/8 CLOSED
          EXACT_GATE_RUN: 34195027724
          EXACT_GATE_JOB: 101960766198
          PRE_CLOSURE_MAIN_WINDOWS_CI_RUN: 34195027792
          PRE_CLOSURE_WORKSPACE_SEARCH_RUN: 34195027743
          PRE_CLOSURE_LARGE_WORKSPACE_RUN: 34195027756
          OWNER_PENDING_P09: NONE
          GLOBAL_RELEASE_BLOCKERS: 1
          VERIFIED_FINAL_COMPLETE: false
          ```

          ## Mandatory task reconciliation

          All eight mandatory P09 tasks were canonically CLOSED before this phase decision. The integrated gateway includes the external-tool adapter contract, discovery/capability registry, structured invocation/results, resource locking, artifact validation, diagnostics/health, generic CLI/process primitives, and the optional provider-neutral protocol seam.

          ## Exact-candidate verification

          Exact canonical candidate `499b042f93efe764465aa1d2ea0f2d0c62188a4b` passed Windows CI `34195027792` / #635, P06-007 Workspace Search `34195027743` / #364, P06-008 Large Workspace Safeguards `34195027756` / #348, and dedicated P09 External Tool Gateway Exit run `34195027724` / job `101960766198`. The dedicated gate checked out the exact candidate, required a clean source tree, executed the complete Windows Release baseline, ran the focused `ExternalToolGatewayPhaseExitTests`, and verified the source remained clean afterward.

          ## Exit criterion

          The gateway contract is provider-neutral and project-owned. Tool discovery, structured invocation/result transport, locking, artifacts, diagnostics, process execution/cancellation, and optional protocol composition are covered without introducing transport SDK coupling into core orchestration or a second process owner.

          ## Owner-last classification

          No P09 phase-exit requirement is genuinely owner-only. `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item; `P04=NOT_RUN`; `KNOWN_RELEASE_BLOCKERS=1`; `VERIFIED_FINAL_COMPLETE=false`.

          ## Exit decision

          ```text
          ALL_P09_MANDATORY_TASKS_CLOSED: true
          P09_EXACT_GATE_PASS: true
          P09_CANDIDATE_MAIN_GREEN: true
          P09_KNOWN_PHASE_BLOCKERS: 0
          P09_KNOWN_REGRESSIONS: 0
          EXIT_GATE: PASS
          P09_PHASE_STATE: CLOSED
          AUTHORIZED_NEXT_PHASE: P10
          P10_IMPLEMENTATION_IN_THIS_CLOSURE: NONE
          VERIFIED_FINAL_COMPLETE: false
          ```

          P09 is truthfully closed on exact candidate `499b042f93efe764465aa1d2ea0f2d0c62188a4b`. This closure does not activate P10. A separate governance transition may activate P10 only after this closure state is normally merged and exact canonical `main` remains green.
          EOF
          sed -i 's/^          //' evidence/phases/P09/CLOSURE.md
          git diff --check
      - name: Commit durable closure only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p09-canonical-closure-bootstrap.yml
          git config user.name walidatiyaai2025-gif
          git config user.email walidatiyaai2025@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'P09: close External Tool Gateway phase'
          git push origin HEAD:close/p09-canonical
