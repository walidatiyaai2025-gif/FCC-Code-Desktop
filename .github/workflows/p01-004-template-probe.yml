name: P01-004 Template Probe

on:
  push:
    branches:
      - validation/p01-004-xunit-template-a2d52fd

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a2d52fd144a345c4d3aaefed73e46799de6dc69b
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - name: Probe SDK xUnit template
        shell: pwsh
        run: |
          if ((dotnet --version) -ne '10.0.400') { throw 'SDK mismatch.' }
          $root = Join-Path $env:RUNNER_TEMP 'fccd xunit template مساحة'
          dotnet new xunit -n TemplateProbe -o $root --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'xUnit template generation failed.' }
          Write-Host 'CSPROJ_BEGIN'
          Get-Content -LiteralPath (Join-Path $root 'TemplateProbe.csproj') -Raw
          Write-Host 'CSPROJ_END'
          Remove-Item -LiteralPath $root -Recurse -Force
