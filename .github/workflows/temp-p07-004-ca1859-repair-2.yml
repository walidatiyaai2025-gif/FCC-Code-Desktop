name: Temporary P07-004 CA1859 repair 2

on:
  push:
    branches:
      - worker-b/fccd-p07-004-stage-unstage

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Apply guarded private signature repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/FCCCodeDesktop.Git/GitCliIndexService.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'private Task<GitCommandResult> ExecuteStageAsync(\n        string repositoryRoot,\n        IReadOnlyList<string> paths,': 'private Task<GitCommandResult> ExecuteStageAsync(\n        string repositoryRoot,\n        List<string> paths,',
              'private async Task<GitCommandResult> ExecuteUnstageAsync(\n        string repositoryRoot,\n        IReadOnlyList<string> paths,': 'private async Task<GitCommandResult> ExecuteUnstageAsync(\n        string repositoryRoot,\n        List<string> paths,',
              'private static List<string> ExpandRenamePairs(\n        IReadOnlyList<string> requestedPaths,': 'private static List<string> ExpandRenamePairs(\n        List<string> requestedPaths,',
              'private static void AddLiteralPathspecs(List<string> arguments, IReadOnlyList<string> paths)': 'private static void AddLiteralPathspecs(List<string> arguments, List<string> paths)',
              'GitIndexMutationKind kind,\n        IReadOnlyList<string> requestedPaths) =>': 'GitIndexMutationKind kind,\n        List<string> requestedPaths) =>',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guard failed for {old!r}: expected 1 occurrence, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-p07-004-ca1859-repair-2.yml
          git add src/FCCCodeDesktop.Git/GitCliIndexService.cs
          git commit -m "FCCD-P07-004: finish private CA1859 signature repair"
          git push origin HEAD:worker-b/fccd-p07-004-stage-unstage
