name: Temporary P10-008 canonical reconciliation

on:
  push:
    branches:
      - worker/fccd-p10-008-reconciliation
    paths:
      - '.github/workflows/_p10-008-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: worker/fccd-p10-008-reconciliation
          fetch-depth: 0
      - name: Apply fail-closed canonical edits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {count}')
              return text.replace(old, new, 1)

          ledger_path = Path('docs/TASK_LEDGER.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger = replace_once(
              ledger,
              '| FCCD-P10-008 | PlayMode test integration | PENDING |',
              '| FCCD-P10-008 | PlayMode test integration | CLOSED |',
              'ledger P10-008 row')
          marker = '| FCCD-P10-013 | Unity contract fixture/suite | PENDING |\n\n`FCCD-P10-004` is CLOSED'
          provenance = '''| FCCD-P10-013 | Unity contract fixture/suite | PENDING |\n\n`FCCD-P10-008` is CLOSED from the fail-closed Unity PlayMode test integration implemented in PR #249. Exact accepted implementation candidate `46ea2d04bdbba9db723ba7c0e2dd77e39e43afd2` passed Unity PlayMode Test Integration `34246224836`, Windows Release `34246224826`, Workspace Search `34246224742`, and Large Workspace Safeguards `34246224740`. PR #249 was normally merged as `14b8c01c8c80cfb773ebab2de98adff85a042439`; that exact implementation main passed Unity PlayMode Test Integration `34247250447`, Workspace Search `34247250486`, and Large Workspace Safeguards `34247250466`, while Windows Release `34247250499` exposed an unrelated FCC environment-discovery regression. That regression was repaired without waiver by PR #250; current exact main `c49b4f6480c1daac5cde8c30c90c69ce368a1f9b` passed FCC Environment Discovery `34251804819`, Windows Release `34251804798`, Workspace Search `34251804735`, and Large Workspace Safeguards `34251804754`. Task evidence: `evidence/phases/P10/P10_008_INTEGRATED_RECONCILIATION_2026-09-08.md`. No owner-only evidence is required or queued. P10 remains `IN_PROGRESS`; P10-009 through P10-013 remain PENDING; `PHASE_EXIT_GATE=NOT_RUN`; P11+ remain prohibited; `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item; `VERIFIED_FINAL_COMPLETE=false`.\n\n`FCCD-P10-004` is CLOSED'''
          ledger = replace_once(ledger, marker, provenance, 'ledger P10-008 provenance insertion')
          old_next = '`CURRENT_PHASE = P10` remains the sole active cloud implementation/convergence phase. `FCCD-P10-001` through `FCCD-P10-007` are CLOSED after normal implementation integration, exact implementation-main validation, and durable task reconciliation; `FCCD-P10-008` through `FCCD-P10-013` remain PENDING. After this P10-007 reconciliation itself passes exact-head CI, normal merge, and exact-main verification, the next legal cloud action is a fresh live claim/concurrency sweep and then `FCCD-P10-008 — PlayMode test integration` only if it remains unclaimed and dependency-valid. P11 and later implementation remain prohibited until P10 is truthfully closed under canonical governance. Preserve `OWNER-P04-008-REAL-TARGET` as the sole unresolved release-blocking owner item, keep `P04=NOT_RUN`, and keep `VERIFIED_FINAL_COMPLETE=false`.'
          new_next = '`CURRENT_PHASE = P10` remains the sole active cloud implementation/convergence phase. `FCCD-P10-001` through `FCCD-P10-008` are CLOSED after normal implementation integration, exact-head/exact-main validation, repair of the intervening FCC discovery regression, and durable task reconciliation; `FCCD-P10-009` through `FCCD-P10-013` remain PENDING. After this P10-008 reconciliation itself passes exact-head CI, normal merge, and exact-main verification, the next legal cloud action is a fresh live claim/concurrency sweep and then `FCCD-P10-009 — Project-owned Editor automation invocation` only if it remains unclaimed and dependency-valid. P11 and later implementation remain prohibited until P10 is truthfully closed under canonical governance. Preserve `OWNER-P04-008-REAL-TARGET` as the sole unresolved release-blocking owner item, keep `P04=NOT_RUN`, and keep `VERIFIED_FINAL_COMPLETE=false`.'
          ledger = replace_once(ledger, old_next, new_next, 'ledger current next action')
          ledger_path.write_text(ledger, encoding='utf-8', newline='\n')

          phase_path = Path('CURRENT_PHASE.md')
          phase = phase_path.read_text(encoding='utf-8')
          phase = replace_once(
              phase,
              '- `FCCD-P10-008` — PlayMode test integration — PENDING.',
              '- `FCCD-P10-008` — PlayMode test integration — CLOSED.',
              'CURRENT_PHASE P10-008 row')
          phase_marker = '## P10-004 integration provenance'
          phase_section = '''## P10-008 integration provenance\n\n- Task: `FCCD-P10-008 — PlayMode test integration` — `CLOSED` in this reconciliation candidate.\n- Implementation PR: #249 (`worker/fccd-p10-008-unity-playmode-tests`).\n- Exact accepted implementation candidate: `46ea2d04bdbba9db723ba7c0e2dd77e39e43afd2`.\n- Exact candidate Unity PlayMode Test Integration `34246224836`, Windows Release `34246224826`, Workspace Search `34246224742`, and Large Workspace Safeguards `34246224740` — SUCCESS.\n- Normal implementation merge: `14b8c01c8c80cfb773ebab2de98adff85a042439`.\n- Exact implementation-main Unity PlayMode Test Integration `34247250447`, Workspace Search `34247250486`, and Large Workspace Safeguards `34247250466` — SUCCESS. Windows Release `34247250499` exposed an unrelated FCC environment-discovery regression and was not waived.\n- Regression repair PR #250 was normally merged; current exact main `c49b4f6480c1daac5cde8c30c90c69ce368a1f9b` passed FCC Environment Discovery `34251804819`, Windows Release `34251804798`, Workspace Search `34251804735`, and Large Workspace Safeguards `34251804754`.\n- Integrated cloud evidence: `evidence/phases/P10/P10_008_INTEGRATED_RECONCILIATION_2026-09-08.md`.\n- No owner-only evidence is required or added. P10 remains `IN_PROGRESS`; P10-009 through P10-013 remain PENDING; `PHASE_EXIT_GATE=NOT_RUN`; P11+ remain prohibited; `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item; `VERIFIED_FINAL_COMPLETE=false`.\n\n## P10-004 integration provenance'''
          phase = replace_once(phase, phase_marker, phase_section, 'CURRENT_PHASE provenance insertion')
          phase_path.write_text(phase, encoding='utf-8', newline='\n')
      - name: Remove bootstrap workflow and commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_p10-008-reconcile-once.yml
          git add docs/TASK_LEDGER.md CURRENT_PHASE.md evidence/phases/P10/P10_008_INTEGRATED_RECONCILIATION_2026-09-08.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile integrated P10-008 PlayMode task'
          git push origin HEAD:worker/fccd-p10-008-reconciliation
