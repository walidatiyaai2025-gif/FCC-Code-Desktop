name: Temporary P07-001 Reconciliation

on:
  push:
    branches:
      - reconcile/fccd-p07-001-integrated-closure
    paths:
      - .github/workflows/tmp-p07-001-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded reconciliation
        run: python3 .github/tmp-p07-001-reconcile.py
      - name: Commit reconciliation and remove temporary helpers
        run: |
          rm .github/workflows/tmp-p07-001-reconcile.yml .github/tmp-p07-001-reconcile.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile P07-001 integrated closure"
          git push
