name: P01-003 Recovery

on:
  push:
    branches:
      - validation/p01-003-recover-locks-cc22177

permissions:
  contents: write

jobs:
  recover-locks:
    runs-on: windows-2025
    steps:
      - name: Checkout worker branch
        uses: actions/checkout@v4
        with:
          ref: worker/fccd-p01-003-dependency-locking
          fetch-depth: 0

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Verify recovery base
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne 'cc221774e050c142dd78db64abbdd84468efd236') { throw "Worker branch moved unexpectedly: $actual" }
          if ((dotnet --version) -ne '10.0.400') { throw "Unexpected SDK: $(dotnet --version)" }

      - name: Regenerate final locks
        shell: pwsh
        run: |
          dotnet restore .\FCCCodeDesktop.sln -p:RestoreLockedMode=false --force-evaluate --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Lock regeneration failed.' }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          Get-ChildItem -Path .\src -Filter packages.lock.json -Recurse -File | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName).Replace("`r`n", "`n")
            [System.IO.File]::WriteAllText($_.FullName, $text, $utf8NoBom)
          }

      - name: Prove locked restore
        shell: pwsh
        run: |
          dotnet restore .\FCCCodeDesktop.sln --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed after regeneration.' }

      - name: Validate dependency policy
        shell: pwsh
        run: .\tools\dependencies\validate-dependency-policy.ps1 -RequireDotNet

      - name: Revalidate quality policy
        shell: pwsh
        run: .\tools\quality\validate-quality-policy.ps1 -RequireDotNet

      - name: Diff hygiene
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Commit exact regenerated locks
        shell: pwsh
        run: |
          $changed = @(git status --short -- src/*/packages.lock.json)
          if ($changed.Count -eq 0) { throw 'Expected regenerated lock changes but found none.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/*/packages.lock.json'
          git commit -m 'P01-003: regenerate consistent lock graph'
          git push origin HEAD:refs/heads/worker/fccd-p01-003-dependency-locking
          Write-Host "RECOVERED_HEAD=$(git rev-parse HEAD)"
