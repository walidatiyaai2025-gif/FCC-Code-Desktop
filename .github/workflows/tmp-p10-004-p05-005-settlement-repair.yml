name: Temporary P10-004 P05-005 Settlement Repair

on:
  push:
    branches:
      - recovery/p10-004-p05-005-settlement-flake

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact recovery branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Harden settlement fixture and self-remove
        shell: bash
        env:
          EXPECTED_PARENT: 15c92bf8957a8dbdfd172db4687903f5984445d5
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          if [ "$actual_parent" != "$EXPECTED_PARENT" ]; then
            echo "Refusing stale repair: expected parent $EXPECTED_PARENT, got $actual_parent" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/ui/validate-task-state-machine.ps1')
          text = p.read_text(encoding='utf-8')

          old_using = '''using System.Collections.Generic;\nusing System.Runtime.CompilerServices;'''
          new_using = '''using System.Collections.Generic;\nusing System.Diagnostics;\nusing System.Runtime.CompilerServices;'''
          if text.count(old_using) != 1:
              raise SystemExit(f'using marker count={text.count(old_using)}')
          text = text.replace(old_using, new_using, 1)

          old_wait = '''    private static async Task WaitForSettledAsync(TaskExecutionState state)\n    {\n        const int settlementTimeoutSeconds = 30;\n        var timeout = DateTimeOffset.UtcNow.AddSeconds(settlementTimeoutSeconds);\n        string? lastStartRejection = null;\n        while (DateTimeOffset.UtcNow < timeout)\n        {\n            if (!state.IsActive)\n            {\n                try\n                {\n                    state.ValidateCanStart();\n                    return;\n                }\n                catch (InvalidOperationException exception) when (exception.Message.Contains("still settling", StringComparison.Ordinal))\n                {\n                    lastStartRejection = exception.Message;\n                }\n            }\n            await Task.Delay(20);\n        }\n        throw new InvalidOperationException(\n            $"P05-005 assertion failed: task did not fully settle within {settlementTimeoutSeconds}s. " +\n            $"State={state.State}; IsActive={state.IsActive}; CanStop={state.CanStop}; CanRetry={state.CanRetry}; " +\n            $"LastStartRejection={lastStartRejection ?? "<none>"}.");\n    }'''

          new_wait = '''    private static async Task WaitForSettledAsync(TaskExecutionState state)\n    {\n        var settlementTimeout = TimeSpan.FromSeconds(60);\n        var pollInterval = TimeSpan.FromMilliseconds(20);\n        var stopwatch = Stopwatch.StartNew();\n        string? lastStartRejection = null;\n\n        while (stopwatch.Elapsed < settlementTimeout)\n        {\n            if (TryValidateSettled(state, out var startRejection))\n            {\n                return;\n            }\n\n            if (startRejection is not null)\n            {\n                lastStartRejection = startRejection;\n            }\n\n            await Task.Delay(pollInterval);\n        }\n\n        // Probe once after the monotonic deadline so a terminal transition that races\n        // the final loop condition is not reported as a false settlement timeout.\n        if (TryValidateSettled(state, out var finalStartRejection))\n        {\n            return;\n        }\n\n        if (finalStartRejection is not null)\n        {\n            lastStartRejection = finalStartRejection;\n        }\n\n        throw new InvalidOperationException(\n            $"P05-005 assertion failed: task did not fully settle within {settlementTimeout.TotalSeconds:0}s. " +\n            $"State={state.State}; IsActive={state.IsActive}; CanStop={state.CanStop}; CanRetry={state.CanRetry}; " +\n            $"LastStartRejection={lastStartRejection ?? "<none>"}.");\n    }\n\n    private static bool TryValidateSettled(TaskExecutionState state, out string? startRejection)\n    {\n        startRejection = null;\n        if (state.IsActive)\n        {\n            return false;\n        }\n\n        try\n        {\n            state.ValidateCanStart();\n            return true;\n        }\n        catch (InvalidOperationException exception) when (exception.Message.Contains("still settling", StringComparison.Ordinal))\n        {\n            startRejection = exception.Message;\n            return false;\n        }\n    }'''

          if text.count(old_wait) != 1:
              raise SystemExit(f'wait block count={text.count(old_wait)}')
          p.write_text(text.replace(old_wait, new_wait, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-p10-004-p05-005-settlement-repair.yml
          git add tools/ui/validate-task-state-machine.ps1
          git diff --cached --check
          git commit -m "test: harden P05-005 settlement wait"
          git push origin "HEAD:${GITHUB_REF_NAME}"
