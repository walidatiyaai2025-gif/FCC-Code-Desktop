name: Temporary P08-004 Reconciliation

on:
  push:
    branches:
      - reconcile/fccd-p08-004-integrated
    paths:
      - '.github/temp/p08-004-reconcile.py'
      - '.github/workflows/temp-p08-004-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v7
        with:
          ref: reconcile/fccd-p08-004-integrated
          fetch-depth: 0

      - name: Guard exact canonical base
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f86e8bc5e08b4def96fc50fc2cc3d3819621aa68 HEAD
          test "$(git merge-base HEAD f86e8bc5e08b4def96fc50fc2cc3d3819621aa68)" = "f86e8bc5e08b4def96fc50fc2cc3d3819621aa68"

      - name: Apply guarded reconciliation and self-delete orchestration
        shell: bash
        run: python .github/temp/p08-004-reconcile.py
