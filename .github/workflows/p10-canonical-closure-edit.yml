name: P10 Canonical Closure Reconciliation

on:
  push:
    branches:
      - worker/p10-canonical-closure
    paths:
      - '.github/workflows/p10-canonical-closure-edit.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify immutable accepted main is ancestor
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor de3187f435ff5b248e39a68bc8a9c20d4b5b8675 HEAD

      - name: Reconcile canonical P10 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          candidate = "de3187f435ff5b248e39a68bc8a9c20d4b5b8675"
          date = "2026-09-09"

          ledger_path = Path("docs/TASK_LEDGER.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          rows = re.findall(r"^\|\s*(FCCD-P10-\d{3})\s*\|[^|]*\|\s*([A-Z_]+)\s*\|", ledger, re.MULTILINE)
          if len(rows) != 13:
              raise SystemExit(f"Expected 13 P10 task rows, found {len(rows)}: {rows}")
          bad = [(task, state) for task, state in rows if state != "CLOSED"]
          if bad:
              raise SystemExit(f"P10 closure denied; non-CLOSED rows: {bad}")

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected {label}: {old!r}")
              return text.replace(old, new, 1)

          current_path = Path("CURRENT_PHASE.md")
          current = current_path.read_text(encoding="utf-8")
          current = replace_once(current, "CURRENT_PHASE_STATE: IN_PROGRESS", "CURRENT_PHASE_STATE: CLOSED", "CURRENT_PHASE state")
          current = replace_once(current, "PHASE_EXIT_GATE: NOT_RUN", "PHASE_EXIT_GATE: PASS", "CURRENT_PHASE gate")
          current = replace_once(current, "LAST_RECONCILED: 2026-09-08", "LAST_RECONCILED: 2026-09-09", "CURRENT_PHASE reconciliation date")
          current = replace_once(
              current,
              "P10 — Unity first-class adapter — is now the sole legal cloud implementation/convergence phase. Only dependency-valid, unclaimed P10 work may begin. P11 and later implementation remain prohibited until P10 is truthfully closed with its exit gate resolved under canonical governance.",
              "P10 — Unity first-class adapter — is canonically CLOSED. All thirteen mandatory P10 tasks are CLOSED, exact-main P10 Unity Adapter Exit run `34312651614` passed on accepted candidate `de3187f435ff5b248e39a68bc8a9c20d4b5b8675`, and the exact same main passed Windows CI `34312651653`, Workspace Search `34312651640`, Large Workspace Safeguards `34312651707`, and P09 regression gate `34312651670`. Canonical closure evidence is `evidence/phases/P10/CLOSURE.md`. P11 remains inactive until a separate governance transition is normally integrated and exact-main verified.",
              "P10 active-phase paragraph",
          )
          current = replace_once(
              current,
              "- Exactly one cloud implementation/convergence phase is active: P10.",
              "- P10 is CLOSED and retained as the current closure checkpoint until a separate validated transition activates P11; no P11 or later implementation is authorized by this closure commit.",
              "P10 active invariant",
          )
          for task, title in [
              ("FCCD-P10-011", "Unity structured UI events"),
              ("FCCD-P10-012", "Unity cancellation/recovery"),
              ("FCCD-P10-013", "Unity contract fixture/suite"),
          ]:
              old = f"- `{task}` — {title} — PENDING."
              new = f"- `{task}` — {title} — CLOSED."
              current = replace_once(current, old, new, task)

          checkpoint = f"""

## P10 canonical closure checkpoint — {date}

- `FCCD-P10-001` through `FCCD-P10-013`: CLOSED.
- Accepted pre-closure canonical main: `{candidate}`.
- P10 Unity Adapter Exit `34312651614`: SUCCESS on the accepted canonical main.
- Windows CI `34312651653`: SUCCESS on the same SHA.
- Workspace Search `34312651640`: SUCCESS on the same SHA.
- Large Workspace Safeguards `34312651707`: SUCCESS on the same SHA.
- P09 External Tool Gateway Exit regression `34312651670`: SUCCESS on the same SHA.
- `PHASE_EXIT_GATE=PASS`; `CURRENT_PHASE_STATE=CLOSED`.
- P11 is the authorized next phase but is not activated by this closure.
- `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item; `P04=NOT_RUN`; `VERIFIED_FINAL_COMPLETE=false`.

Any earlier P10 task-specific provenance text describing P10 as `IN_PROGRESS`, later P10 rows as `PENDING`, or `PHASE_EXIT_GATE=NOT_RUN` is a historical snapshot from the time that individual task was reconciled. This checkpoint and the top canonical status block supersede those historical scheduling statements.
"""
          if "## P10 canonical closure checkpoint — 2026-09-09" not in current:
              current = current.rstrip() + checkpoint + "\n"
          current_path.write_text(current, encoding="utf-8")

          project_path = Path("PROJECT_CONTROL.md")
          project = project_path.read_text(encoding="utf-8")
          project = replace_once(project, "CURRENT_PHASE_STATE: IN_PROGRESS", "CURRENT_PHASE_STATE: CLOSED", "PROJECT_CONTROL state")
          project = replace_once(project, "PHASE_EXIT_GATE: NOT_RUN", "PHASE_EXIT_GATE: PASS", "PROJECT_CONTROL gate")
          project_checkpoint = f"""

## P10 canonical closure checkpoint — {date}

P10 — Unity first-class adapter — is canonically CLOSED. All thirteen mandatory P10 task rows are CLOSED. Accepted canonical candidate `{candidate}` passed dedicated P10 Unity Adapter Exit run `34312651614`, Windows CI `34312651653`, Workspace Search `34312651640`, Large Workspace Safeguards `34312651707`, and P09 External Tool Gateway Exit regression run `34312651670`, all on that exact SHA. Canonical closure evidence is `evidence/phases/P10/CLOSURE.md`.

This closure does not activate P11. A separate governance transition is required before P11 implementation. `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item, `P04=NOT_RUN`, `KNOWN_RELEASE_BLOCKERS=1`, and `VERIFIED_FINAL_COMPLETE=false`.
"""
          if "## P10 canonical closure checkpoint — 2026-09-09" not in project:
              project = project.rstrip() + project_checkpoint + "\n"
          project_path.write_text(project, encoding="utf-8")

          next_action = """## Current next action

`P10` is canonically CLOSED and retained as the current closure checkpoint. All `FCCD-P10-001` through `FCCD-P10-013` rows are CLOSED, dedicated P10 Unity Adapter Exit run `34312651614` passed on exact accepted main `de3187f435ff5b248e39a68bc8a9c20d4b5b8675`, and same-SHA Windows CI `34312651653`, Workspace Search `34312651640`, Large Workspace Safeguards `34312651707`, and P09 regression gate `34312651670` all passed. Canonical evidence is `evidence/phases/P10/CLOSURE.md`. P11 is the authorized next phase but remains inactive until a separate governance transition is normally integrated and exact-main verified. Preserve `OWNER-P04-008-REAL-TARGET` as the sole unresolved release-blocking owner item, keep `P04=NOT_RUN`, and keep `VERIFIED_FINAL_COMPLETE=false`.
"""
          pattern = re.compile(r"## Current next action\n\n.*?(?=\n<!-- FCCD-P08-004-FINAL-CLOSURE-PROVENANCE -->)", re.DOTALL)
          if not pattern.search(ledger):
              raise SystemExit("Could not locate canonical Current next action block")
          ledger = pattern.sub(next_action.rstrip(), ledger, count=1)
          ledger_path.write_text(ledger, encoding="utf-8")

          closure = f"""# P10 Phase Closure — Unity first-class adapter

```text
PHASE: P10
PHASE_NAME: Unity first-class adapter
CANDIDATE_SHA: {candidate}
DATE: {date}
EXIT_GATE: PASS
KNOWN_BLOCKERS: 0
KNOWN_REGRESSIONS: 0
```

## 1. Mandatory task reconciliation

| Task ID | Final state |
|---|---|
""" + "\n".join(f"| FCCD-P10-{i:03d} | CLOSED |" for i in range(1, 14)) + f"""

All thirteen mandatory P10 tasks were CLOSED before this phase-exit decision. The final task reconciliation for P10-011 through P10-013 was normally integrated by PR #259 before this canonical closure decision.

## 2. Exact candidate verification

Accepted canonical main `{candidate}` passed all required cloud gates on the same exact SHA:

```text
P10 Unity Adapter Exit
RESULT: PASS — run 34312651614 / #2

Windows CI
RESULT: PASS — run 34312651653 / #722

P06-007 Workspace Search
RESULT: PASS — run 34312651640 / #451

P06-008 Large Workspace Safeguards
RESULT: PASS — run 34312651707 / #435

P09 External Tool Gateway Exit regression
RESULT: PASS — run 34312651670 / #41
```

The dedicated P10 exit workflow checked out the exact candidate SHA, required a clean source tree, ran the complete Windows Release baseline, ran the aggregate P10 Unity contract suite, and verified the source tree remained clean after validation.

## 3. P10 contract coverage

The aggregate P10 contract suite covers the phase-owned deterministic contracts for Unity project/version detection, installed Editor/Hub resolution, strongly typed Unity CLI construction, same-project/process resource locking, dedicated Unity log capture/parsing, compile validation, EditMode tests, PlayMode tests, project-owned Editor automation, build target/artifact validation, structured Unity UI events, and cancellation/recovery.

The suite is fail-closed: delegated validator failure fails the aggregate suite; stale, malformed, mismatched, or missing evidence cannot be converted into success; same-project locking and process ownership constraints cannot be bypassed; and no real Unity/provider execution success is fabricated by the cloud fixtures.

## 4. Runtime/environment verification

P10 closure is based on deterministic product-owned Windows contract acceptance. No owner-only P10 item is required or queued. This closure does not claim a real external Unity Editor/provider success beyond the repository's defined deterministic acceptance boundary.

## 5. Safety and recovery

P10 recovery preserves exact operation/project/process-run identity, rejects foreign or mismatched process ownership, forbids kill-by-name cleanup, blocks unsafe overlapping retry, rejects stale or wrong-correlation terminal evidence, and requires a fresh invocation identity after safe lease release when retry is permitted.

## 6. Known defects and regressions

```text
KNOWN_PHASE_LOCAL_DEFECTS: NONE
EARLIER_PHASE_REGRESSIONS: NONE
```

The same exact candidate passed the P09 phase regression gate in addition to the normal Windows/workspace regression gates.

## 7. Exit decision

```text
ALL_P10_MANDATORY_TASKS_CLOSED: true
P10_EXACT_GATE_PASS: true
P10_CANDIDATE_MAIN_GREEN: true
P10_KNOWN_PHASE_BLOCKERS: 0
P10_KNOWN_REGRESSIONS: 0
EXIT_GATE: PASS
P10_PHASE_STATE: CLOSED
AUTHORIZED_NEXT_PHASE: P11
P11_IMPLEMENTATION_IN_THIS_CLOSURE: NONE
OWNER_PENDING_P10: NONE
GLOBAL_RELEASE_BLOCKERS: 1
VERIFIED_FINAL_COMPLETE: false
```

`OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item. P10 closure does not activate P11; a separate governance transition is allowed only after this closure is normally merged and exact canonical `main` remains green.
"""
          closure_path = Path("evidence/phases/P10/CLOSURE.md")
          if closure_path.exists():
              raise SystemExit("P10 CLOSURE.md already exists; refusing duplicate closure")
          closure_path.write_text(closure, encoding="utf-8")
          PY

      - name: Validate closure state
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CURRENT_PHASE_STATE: CLOSED' CURRENT_PHASE.md
          grep -q 'PHASE_EXIT_GATE: PASS' CURRENT_PHASE.md
          grep -q 'CURRENT_PHASE_STATE: CLOSED' PROJECT_CONTROL.md
          grep -q 'PHASE_EXIT_GATE: PASS' PROJECT_CONTROL.md
          grep -q 'EXIT_GATE: PASS' evidence/phases/P10/CLOSURE.md
          test "$(grep -Ec '^\| FCCD-P10-[0-9]{3} \| CLOSED \|$' evidence/phases/P10/CLOSURE.md)" -eq 13

      - name: Commit canonical closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_PHASE.md PROJECT_CONTROL.md docs/TASK_LEDGER.md evidence/phases/P10/CLOSURE.md
          git commit -m 'P10 canonical phase closure'
          git push origin HEAD:worker/p10-canonical-closure
