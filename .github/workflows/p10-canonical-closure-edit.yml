name: P10 Canonical Closure Reconciliation

on:
  push:
    branches:
      - worker/p10-canonical-closure
    paths:
      - '.github/workflows/p10-canonical-closure-edit.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify accepted main ancestor
        run: git merge-base --is-ancestor de3187f435ff5b248e39a68bc8a9c20d4b5b8675 HEAD

      - name: Apply canonical P10 closure
        run: python tools/governance/p10-canonical-closure-edit.py

      - name: Validate closure state
        run: |
          grep -q 'CURRENT_PHASE_STATE: CLOSED' CURRENT_PHASE.md
          grep -q 'PHASE_EXIT_GATE: PASS' CURRENT_PHASE.md
          grep -q 'CURRENT_PHASE_STATE: CLOSED' PROJECT_CONTROL.md
          grep -q 'PHASE_EXIT_GATE: PASS' PROJECT_CONTROL.md
          grep -q 'EXIT_GATE: PASS' evidence/phases/P10/CLOSURE.md
          test "$(grep -Ec '^\| FCCD-P10-[0-9]{3} \| CLOSED \|$' evidence/phases/P10/CLOSURE.md)" -eq 13

      - name: Commit canonical closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_PHASE.md PROJECT_CONTROL.md evidence/phases/P10/CLOSURE.md
          git commit -m 'P10 canonical phase closure'
          git push origin HEAD:worker/p10-canonical-closure
