name: P10 Canonical Closure Reconciliation

on:
  push:
    branches:
      - worker/p10-canonical-closure
    paths:
      - '.github/workflows/p10-canonical-closure-edit.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: windows-2025
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify accepted main ancestor
        shell: pwsh
        run: git merge-base --is-ancestor de3187f435ff5b248e39a68bc8a9c20d4b5b8675 HEAD

      - name: Apply canonical P10 closure
        shell: pwsh
        run: python tools/governance/p10-canonical-closure-edit.py

      - name: Validate closure state
        shell: pwsh
        run: |
          if (-not (Select-String -Path CURRENT_PHASE.md -SimpleMatch 'CURRENT_PHASE_STATE: CLOSED')) { throw 'CURRENT_PHASE state not CLOSED' }
          if (-not (Select-String -Path CURRENT_PHASE.md -SimpleMatch 'PHASE_EXIT_GATE: PASS')) { throw 'CURRENT_PHASE gate not PASS' }
          if (-not (Select-String -Path PROJECT_CONTROL.md -SimpleMatch 'CURRENT_PHASE_STATE: CLOSED')) { throw 'PROJECT_CONTROL state not CLOSED' }
          if (-not (Select-String -Path PROJECT_CONTROL.md -SimpleMatch 'PHASE_EXIT_GATE: PASS')) { throw 'PROJECT_CONTROL gate not PASS' }
          if (-not (Select-String -Path evidence/phases/P10/CLOSURE.md -SimpleMatch 'EXIT_GATE: PASS')) { throw 'Closure gate not PASS' }
          $rows = @(Select-String -Path evidence/phases/P10/CLOSURE.md -Pattern '^\| FCCD-P10-[0-9]{3} \| CLOSED \|$')
          if ($rows.Count -ne 13) { throw "Expected 13 CLOSED rows, got $($rows.Count)" }

      - name: Commit canonical closure
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_PHASE.md PROJECT_CONTROL.md evidence/phases/P10/CLOSURE.md
          git commit -m 'P10 canonical phase closure'
          git push origin HEAD:worker/p10-canonical-closure
