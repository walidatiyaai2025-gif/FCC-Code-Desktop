name: P01-001 Main Validation

on:
  push:
    branches:
      - validation/p01-001-main-2b94152

permissions:
  contents: read

jobs:
  validate-main:
    name: Exact-main Windows .NET 10 restore/build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact integrated main SHA
        uses: actions/checkout@v4
        with:
          ref: 2b94152362d59425b0bbb02f19eb7c68b8d24656
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: SDK information
        run: dotnet --info

      - name: Verify exact head
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '2b94152362d59425b0bbb02f19eb7c68b8d24656') { throw "Unexpected HEAD: $actual" }

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\FCCCodeDesktop.sln --nologo

      - name: Build Release
        shell: pwsh
        run: dotnet build .\FCCCodeDesktop.sln -c Release --no-restore --nologo
