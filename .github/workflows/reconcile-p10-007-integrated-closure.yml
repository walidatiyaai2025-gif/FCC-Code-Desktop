name: Reconcile P10-007 integrated closure

on:
  push:
    branches:
      - worker/fccd-p10-007-integrated-reconciliation
    paths:
      - '.github/workflows/reconcile-p10-007-integrated-closure.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v7
        with:
          ref: worker/fccd-p10-007-integrated-reconciliation
          fetch-depth: 0

      - name: Reconcile canonical P10-007 state and evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          task = "FCCD-P10-007"
          implementation_candidate = "d5c9c7c780cf0a05a46ab69d3520ad5183b95cce"
          implementation_main = "cf8f2ef42459b11157107ee46d4319592a19ba70"

          current_phase_path = Path("CURRENT_PHASE.md")
          current_phase = current_phase_path.read_text(encoding="utf-8")
          pending_row = "| FCCD-P10-007 | EditMode test integration | PENDING |"
          closed_row = "| FCCD-P10-007 | EditMode test integration | CLOSED |"
          if current_phase.count(pending_row) != 1:
              raise SystemExit(f"Expected exactly one P10-007 pending row in CURRENT_PHASE.md, found {current_phase.count(pending_row)}")
          current_phase = current_phase.replace(pending_row, closed_row, 1)

          provenance_marker = "## P10-007 integration provenance"
          if provenance_marker in current_phase:
              raise SystemExit("P10-007 provenance already exists; refusing duplicate reconciliation")

          provenance = f'''\n\n---\n\n## P10-007 integration provenance\n\n- Task: `FCCD-P10-007 — EditMode test integration` — `CLOSED`.\n- Live scheduling hint `FCCD-P20-007 — Freeze exact release candidate SHA` remained future work and was not executed because canonical `CURRENT_PHASE=P10`.\n- Recovery-first selection continued the already-open integration-pending P10-007 lane rather than creating duplicate or later-phase work.\n- Implementation PR: #247 on `worker/fccd-p10-007-unity-editmode-tests`.\n- Exact accepted implementation candidate: `{implementation_candidate}`.\n- Exact candidate checks: P10-007 Unity EditMode Test Integration `34237835082` SUCCESS; Windows CI `34237835044` SUCCESS; Workspace Search `34237835184` SUCCESS; Large Workspace Safeguards `34237835056` SUCCESS.\n- Normal implementation merge / exact implementation main: `{implementation_main}`.\n- Exact implementation-main checks: P10-007 Unity EditMode Test Integration `34239031180` SUCCESS; Windows CI `34239031262` SUCCESS; Workspace Search `34239031249` SUCCESS; Large Workspace Safeguards `34239031144` SUCCESS.\n- The first candidate exposed a fixture-only ordering assumption around failed NUnit suite/test nodes. It was repaired on the same lane with order-independent assertions while retaining the 100-detail, 4096-character message, and 8192-character stack bounds. No analyzer suppression, warning demotion, test deletion, force-push, or safety weakening was used. A temporary repair workflow was removed and is absent from the durable implementation diff.\n- P10-007 now requires controlled `unity.run-tests.editmode` process evidence plus a fresh, bounded, safe NUnit3 `test-run` artifact. Missing, empty, oversized, stale, malformed, DTD/entity-bearing, zero-test, counter-inconsistent, or TOCTOU-changed artifacts fail closed; cancellation stays distinct; passing XML cannot override a failed controlled process; structured failure details remain bounded.\n- Cloud evidence: `evidence/phases/P10/P10_007_INTEGRATED_RECONCILIATION_2026-09-08.md`.\n- No new owner-only evidence is required for P10-007. `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item and is neither modified nor duplicated.\n- P10 remains `IN_PROGRESS`; P10-008 through P10-013 remain `PENDING`; `PHASE_EXIT_GATE=NOT_RUN`; P11+ implementation remains prohibited; `VERIFIED_FINAL_COMPLETE=false`.\n'''
          current_phase_path.write_text(current_phase.rstrip() + provenance + "\n", encoding="utf-8", newline="\n")

          ledger_path = Path("docs/TASK_LEDGER.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          if ledger.count(pending_row) != 1:
              raise SystemExit(f"Expected exactly one P10-007 pending row in TASK_LEDGER.md, found {ledger.count(pending_row)}")
          ledger = ledger.replace(pending_row, closed_row, 1)

          next_heading = "## Current next action"
          next_end = "<!-- FCCD-P08-004-FINAL-CLOSURE-PROVENANCE -->"
          if ledger.count(next_heading) != 1 or ledger.count(next_end) != 1:
              raise SystemExit("Canonical next-action anchors are not unique")
          start = ledger.index(next_heading)
          end = ledger.index(next_end, start)
          next_action = '''## Current next action\n\n`CURRENT_PHASE = P10` remains the sole active cloud implementation/convergence phase. `FCCD-P10-001` through `FCCD-P10-007` are CLOSED after normal implementation integration, exact implementation-main validation, and durable task reconciliation; `FCCD-P10-008` through `FCCD-P10-013` remain PENDING. After this P10-007 reconciliation itself passes exact-head CI, normal merge, and exact-main verification, the next legal cloud action is a fresh live claim/concurrency sweep and then `FCCD-P10-008 — PlayMode test integration` only if it remains unclaimed and dependency-valid. P11 and later implementation remain prohibited until P10 is truthfully closed under canonical governance. Preserve `OWNER-P04-008-REAL-TARGET` as the sole unresolved release-blocking owner item, keep `P04=NOT_RUN`, and keep `VERIFIED_FINAL_COMPLETE=false`.\n'''
          ledger = ledger[:start] + next_action + ledger[end:]
          ledger_path.write_text(ledger, encoding="utf-8", newline="\n")

          evidence_path = Path("evidence/phases/P10/P10_007_INTEGRATED_RECONCILIATION_2026-09-08.md")
          if evidence_path.exists():
              raise SystemExit("P10-007 integrated reconciliation evidence already exists")
          evidence = f'''# FCCD-P10-007 — EditMode test integration\n\nDate: 2026-09-08\nPhase: P10 — Unity first-class adapter\nTask: `FCCD-P10-007 — EditMode test integration`\nEvidence classification: CLOUD_ACCEPTED / INTEGRATED\n\n## Live-state recovery selection\n\n- Scheduling hint `FCCD-P20-007 — Freeze exact release candidate SHA` was future work and was not executed because canonical `CURRENT_PHASE=P10`.\n- At this slot start, exact main was `68712014c68e0ddb51e3f8f36dc29cea57a5ed03` and P10-007 already had the legitimate integration-pending PR #247 from the immediately preceding P10-007 implementation cycle. Recovery/convergence of that lane therefore took priority over any new task.\n- PR #247 exact final implementation head was `{implementation_candidate}`; no duplicate P10-007 implementation or P20 work was created.\n\n## Implementation boundary\n\nP10-007 adds fail-closed Unity EditMode test-result integration over the existing P09 controlled process contract and P10 strongly typed Unity CLI action. It consumes NUnit3 `test-run` output because P00 real-target Unity evidence established that contract with a nonzero EditMode test count. It intentionally does not own P10-008 PlayMode semantics or P10-009+ Editor automation/build/event/cancellation integration.\n\nSuccess requires a successful controlled `unity.run-tests.editmode` process and a fresh invocation result artifact. The validator snapshots pre-run artifact metadata, reuses P09 safe artifact validation, caps results at 16 MiB, rechecks length/SHA-256 after parsing, rejects DTD/entity expansion, validates NUnit counters and nonzero discovery, keeps cancellation distinct, refuses to let passing XML override controlled process failure, and bounds retained failed suite/test diagnostics. Missing, empty, oversized, stale, malformed, inconsistent, zero-test, or changed-during-validation artifacts cannot establish PASS.\n\n## Deterministic acceptance coverage\n\n`tests/FCCCodeDesktop.UnityEditModeTestFixture`, `tools/unity/validate-unity-editmode-tests.ps1`, locked restore data, and permanent `.github/workflows/p10-007-unity-editmode-tests.yml` cover passing and failing NUnit results, Arabic/Unicode data, process/launch/cancellation disagreement, stale/missing/empty/oversized artifacts, malformed XML, DTD/entity rejection, zero tests, inconsistent counters, bounded failure detail, operation/path guards, Release warnings-as-errors, and deterministic hosted-Windows execution.\n\n## Defect exposed and repaired before acceptance\n\nInitial candidate `7ea751bcd95023124792a256cb4669377e850ec6` built with zero warnings/errors but the runtime fixture exposed an ordering assumption: failed NUnit suite nodes may precede failed test-case nodes, so the first retained failure need not own `<failure>` text. The fixture was repaired on the same branch to assert bounded message/stack evidence independent of XML node order while retaining the original caps. No suppression, warning demotion, test removal, force-push, or safety weakening was used. The temporary repair workflow was removed and is absent from the final durable diff.\n\n## Exact accepted implementation-candidate validation\n\nAll applicable checks on exact final candidate `{implementation_candidate}` completed SUCCESS:\n\n- P10-007 Unity EditMode Test Integration: run `34237835082` — SUCCESS.\n- Windows CI: run `34237835044` — SUCCESS.\n- Workspace Search Validation: run `34237835184` — SUCCESS.\n- Large Workspace Safeguard Validation: run `34237835056` — SUCCESS.\n\nPR #247 was marked ready only after these exact-head gates were green and was normally merged with merge-commit flow guarded by the exact accepted head SHA.\n\n## Exact implementation-main validation\n\nNormal implementation merge / exact accepted implementation main:\n\n`{implementation_main}`\n\nAll applicable push checks on that exact main completed SUCCESS:\n\n- P10-007 Unity EditMode Test Integration: run `34239031180` — SUCCESS.\n- Windows CI: run `34239031262` — SUCCESS.\n- Workspace Search Validation: run `34239031249` — SUCCESS.\n- Large Workspace Safeguard Validation: run `34239031144` — SUCCESS.\n\nThe exact-main Windows run completed the Release baseline and all current P05/P06 tail validators successfully; Workspace Search and Large Workspace safeguards also passed on the same implementation main.\n\n## Owner-last / target boundary\n\nNo new owner-only evidence is required for P10-007. P00 already captured genuine installed-Unity EditMode NUnit contract evidence on the owner target; P10-007's owned integration/parser semantics are fully cloud-verifiable with deterministic hosted-Windows fixtures. No installed-Unity result, FCC/provider result, or manual target evidence is fabricated. `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner queue item and is neither modified nor duplicated.\n\n## Canonical reconciliation scope\n\nThis reconciliation changes only canonical state/evidence for the already-integrated and exact-main-green P10-007 implementation:\n\n- `CURRENT_PHASE.md`: P10-007 inventory `PENDING` → `CLOSED` plus integration provenance;\n- `docs/TASK_LEDGER.md`: P10-007 `PENDING` → `CLOSED` and next-action pointer advances to a fresh live sweep before P10-008;\n- this evidence file.\n\nNo product code, owner queue state, P10-008+ implementation, phase-exit state, or later-phase authority changes here. P10 remains `IN_PROGRESS`; P10-008 through P10-013 remain `PENDING`; `PHASE_EXIT_GATE=NOT_RUN`; P11+ implementation remains prohibited; `VERIFIED_FINAL_COMPLETE=false`.\n'''
          evidence_path.write_text(evidence, encoding="utf-8", newline="\n")
          PY

          rm .github/workflows/reconcile-p10-007-integrated-closure.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_PHASE.md docs/TASK_LEDGER.md evidence/phases/P10/P10_007_INTEGRATED_RECONCILIATION_2026-09-08.md .github/workflows/reconcile-p10-007-integrated-closure.yml
          git commit -m 'P10-007 reconcile integrated closure'
          git push origin HEAD:worker/fccd-p10-007-integrated-reconciliation
