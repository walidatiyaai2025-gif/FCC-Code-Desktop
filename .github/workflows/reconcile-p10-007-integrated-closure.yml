name: Reconcile P10-007 integrated closure

on:
  push:
    branches:
      - worker/fccd-p10-007-integrated-reconciliation
    paths:
      - '.github/workflows/reconcile-p10-007-integrated-closure.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v7
        with:
          ref: worker/fccd-p10-007-integrated-reconciliation
          fetch-depth: 0

      - name: Reconcile canonical P10-007 state and evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          implementation_candidate = "d5c9c7c780cf0a05a46ab69d3520ad5183b95cce"
          implementation_main = "cf8f2ef42459b11157107ee46d4319592a19ba70"

          cp_path = Path("CURRENT_PHASE.md")
          cp = cp_path.read_text(encoding="utf-8")
          cp_pending = "- `FCCD-P10-007` — EditMode test integration — PENDING."
          cp_closed = "- `FCCD-P10-007` — EditMode test integration — CLOSED."
          if cp.count(cp_pending) != 1:
              raise SystemExit(f"Expected one P10-007 pending inventory line, found {cp.count(cp_pending)}")
          if "## P10-007 integration provenance" in cp:
              raise SystemExit("P10-007 provenance already exists")
          cp = cp.replace(cp_pending, cp_closed, 1)
          cp += f'''\n\n---\n\n## P10-007 integration provenance\n\n- Task: `FCCD-P10-007 — EditMode test integration` — `CLOSED`.\n- Live hint `FCCD-P20-007 — Freeze exact release candidate SHA` remained future and was not executed because `CURRENT_PHASE=P10`. Recovery-first execution continued the legitimate P10-007 integration lane instead.\n- Implementation PR #247; exact accepted candidate `{implementation_candidate}`. Candidate checks: P10-007 `34237835082`, Windows CI `34237835044`, Workspace Search `34237835184`, Large Workspace `34237835056` — all SUCCESS.\n- Normal implementation merge / exact implementation main: `{implementation_main}`. Exact-main checks: P10-007 `34239031180`, Windows CI `34239031262`, Workspace Search `34239031249`, Large Workspace `34239031144` — all SUCCESS.\n- The initial fixture-only failed-node ordering assumption was repaired on the same lane with order-independent assertions while retaining the 100-detail, 4096-character message and 8192-character stack bounds. No suppression, warning demotion, test deletion, force-push, or safety weakening was used; temporary repair orchestration is absent from the durable implementation diff.\n- Cloud evidence: `evidence/phases/P10/P10_007_INTEGRATED_RECONCILIATION_2026-09-08.md`.\n- No new owner-only evidence is required. `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item.\n- P10 remains `IN_PROGRESS`; P10-008 through P10-013 remain `PENDING`; `PHASE_EXIT_GATE=NOT_RUN`; P11+ remains prohibited; `VERIFIED_FINAL_COMPLETE=false`.\n'''
          cp_path.write_text(cp, encoding="utf-8")

          ledger_path = Path("docs/TASK_LEDGER.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          ledger_pending = "| FCCD-P10-007 | EditMode test integration | PENDING |"
          ledger_closed = "| FCCD-P10-007 | EditMode test integration | CLOSED |"
          if ledger.count(ledger_pending) != 1:
              raise SystemExit(f"Expected one P10-007 pending ledger row, found {ledger.count(ledger_pending)}")
          ledger = ledger.replace(ledger_pending, ledger_closed, 1)

          start_marker = "## Current next action"
          end_marker = "<!-- FCCD-P08-004-FINAL-CLOSURE-PROVENANCE -->"
          start = ledger.find(start_marker)
          end = ledger.find(end_marker, start + len(start_marker))
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("Could not resolve canonical Current next action section")
          next_action = '''## Current next action\n\n`CURRENT_PHASE = P10` remains the sole active cloud implementation/convergence phase. `FCCD-P10-001` through `FCCD-P10-007` are CLOSED after normal implementation integration, exact implementation-main validation, and durable task reconciliation; `FCCD-P10-008` through `FCCD-P10-013` remain PENDING. After this P10-007 reconciliation itself passes exact-head CI, normal merge, and exact-main verification, the next legal cloud action is a fresh live claim/concurrency sweep and then `FCCD-P10-008 — PlayMode test integration` only if it remains unclaimed and dependency-valid. P11 and later implementation remain prohibited until P10 is truthfully closed under canonical governance. Preserve `OWNER-P04-008-REAL-TARGET` as the sole unresolved release-blocking owner item, keep `P04=NOT_RUN`, and keep `VERIFIED_FINAL_COMPLETE=false`.\n'''
          ledger = ledger[:start] + next_action + ledger[end:]
          ledger_path.write_text(ledger, encoding="utf-8")

          evidence_path = Path("evidence/phases/P10/P10_007_INTEGRATED_RECONCILIATION_2026-09-08.md")
          if evidence_path.exists():
              raise SystemExit("P10-007 reconciliation evidence already exists")
          evidence_path.write_text(f'''# FCCD-P10-007 — EditMode test integration\n\nDate: 2026-09-08\nPhase: P10 — Unity first-class adapter\nTask: `FCCD-P10-007 — EditMode test integration`\nEvidence classification: CLOUD_ACCEPTED / INTEGRATED\n\n## Live-state recovery selection\n\n- Slot hint `FCCD-P20-007 — Freeze exact release candidate SHA` was future work and was not executed because canonical `CURRENT_PHASE=P10`.\n- The slot recovered the legitimate integration-pending P10-007 lane rather than starting duplicate or later-phase work. At recovery start, implementation PR #247 was still pending final regression convergence on exact head `{implementation_candidate}`.\n- No second P10 task was selected.\n\n## Implementation boundary\n\nP10-007 adds fail-closed Unity EditMode result integration over the controlled P09 process/result contract and the typed Unity CLI action. P00 genuine target evidence established NUnit3 `test-run` output with a nonzero EditMode test count, so this layer validates that contract rather than inventing one. It intentionally does not own P10-008 PlayMode semantics or P10-009+ automation/build/event/cancellation work.\n\nA PASS requires a successful controlled `unity.run-tests.editmode` process plus a fresh result artifact. Pre-run fingerprinting prevents stale XML reuse; P09 safe artifact validation is reused; result size is capped at 16 MiB; length/SHA-256 are rechecked to detect TOCTOU changes; DTD/entities are rejected; counters must be coherent with nonzero discovery; cancellation stays distinct; a passing XML cannot override process failure; and retained failure details are bounded. Missing, empty, oversized, stale, malformed, inconsistent, zero-test, or changed artifacts fail closed.\n\n## Deterministic acceptance coverage\n\n`tests/FCCCodeDesktop.UnityEditModeTestFixture`, locked restore data, `tools/unity/validate-unity-editmode-tests.ps1`, and permanent `.github/workflows/p10-007-unity-editmode-tests.yml` cover pass/fail NUnit results, Unicode/Arabic values, process/launch/cancellation disagreement, missing/empty/stale/oversized artifacts, malformed XML, DTD/entity rejection, zero tests, inconsistent counters, bounded failure diagnostics, operation/path guards, Release warnings-as-errors, and hosted-Windows deterministic execution.\n\n## Defect exposed and repaired before acceptance\n\nInitial candidate `7ea751bcd95023124792a256cb4669377e850ec6` built with zero warnings/errors but the runtime fixture exposed an invalid ordering assumption: a failed NUnit suite may be retained before its failed test case. The same lane was repaired to assert bounded failure message/stack evidence independently of XML node ordering, keeping all production limits unchanged. No analyzer suppression, warning demotion, test removal, force-push, or safety weakening was used. Temporary repair orchestration was removed from the durable diff.\n\n## Exact accepted implementation-candidate validation\n\nExact accepted candidate: `{implementation_candidate}`.\n\n- P10-007 Unity EditMode Test Integration `34237835082` — SUCCESS.\n- Windows CI `34237835044` — SUCCESS.\n- Workspace Search `34237835184` — SUCCESS.\n- Large Workspace Safeguards `34237835056` — SUCCESS.\n\nPR #247 was then marked ready and normally merged with expected-head guarding.\n\n## Exact implementation-main validation\n\nNormal implementation merge / exact accepted implementation main: `{implementation_main}`.\n\n- P10-007 Unity EditMode Test Integration `34239031180` — SUCCESS.\n- Windows CI `34239031262` — SUCCESS, including the Release baseline and all current P05/P06 tail validators.\n- Workspace Search `34239031249` — SUCCESS.\n- Large Workspace Safeguards `34239031144` — SUCCESS.\n\n## Owner-last / target boundary\n\nNo new owner-only evidence is required for P10-007. P00 already contains genuine installed-Unity contract evidence; P10-007's owned parser/integration semantics are cloud-verifiable with deterministic hosted-Windows fixtures. No installed-Unity, FCC/provider, or manual evidence is fabricated. `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner queue item and is not changed or duplicated.\n\n## Canonical reconciliation scope\n\nThis reconciliation changes only `CURRENT_PHASE.md`, `docs/TASK_LEDGER.md`, and this evidence file for the already-integrated exact-main-green P10-007 implementation. No product code, owner queue state, P10-008+ implementation, phase exit, or later-phase authority changes. P10 remains `IN_PROGRESS`; P10-008 through P10-013 remain `PENDING`; `PHASE_EXIT_GATE=NOT_RUN`; P11+ implementation remains prohibited; `VERIFIED_FINAL_COMPLETE=false`.\n''', encoding="utf-8")
          PY

          rm .github/workflows/reconcile-p10-007-integrated-closure.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_PHASE.md docs/TASK_LEDGER.md evidence/phases/P10/P10_007_INTEGRATED_RECONCILIATION_2026-09-08.md .github/workflows/reconcile-p10-007-integrated-closure.yml
          git commit -m 'P10-007 reconcile integrated closure'
          git push origin HEAD:worker/fccd-p10-007-integrated-reconciliation
