name: P06-007 Workspace Search

on:
  push:
    branches:
      - main
      - worker/fccd-p06-007-workspace-search
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: p06-007-workspace-search-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-search:
    name: Workspace Search Validation
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Run Windows Release baseline
        shell: pwsh
        run: .\tools\ci\run-windows-ci.ps1

      - name: Validate P06-007 workspace search
        shell: pwsh
        run: .\tools\projects\validate-workspace-search.ps1 -RunFixtures -RequireRuntime
