name: Temporary P08-002 P05-005 settlement repair

on:
  push:
    branches: [repair/p08-002-p05-005-settlement-fixture]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python .github/temp/p08-002-p05-settlement-repair.py
      - run: |
          git status --short
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            ".github/temp/p08-002-p05-settlement-repair.py"
            ".github/workflows/temp-p08-002-p05-settlement-repair.yml"
            "tools/ui/validate-task-state-machine.ps1"
          )
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            echo "Unexpected working-tree scope"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P08-002 recovery: stabilize P05-005 settlement fixture"
          git push origin HEAD:repair/p08-002-p05-005-settlement-fixture