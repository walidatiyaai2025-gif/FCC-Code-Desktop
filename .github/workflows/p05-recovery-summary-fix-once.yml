name: P05 Recovery Summary Fix Once

on:
  push:
    branches:
      - reconcile/p05-owner-real-target-current-main
    paths:
      - tools/reconciliation/fix-p05-recovery-summary-drift.ps1
      - .github/workflows/p05-recovery-summary-fix-once.yml

permissions:
  contents: write

concurrency:
  group: p05-recovery-summary-fix-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repair summary drift and validate governance
        shell: pwsh
        run: .\tools\reconciliation\fix-p05-recovery-summary-drift.ps1
      - name: Remove one-shot machinery and commit
        shell: pwsh
        run: |
          Remove-Item '.\tools\reconciliation\fix-p05-recovery-summary-drift.ps1' -Force
          Remove-Item '.\.github\workflows\p05-recovery-summary-fix-once.yml' -Force
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed after cleanup.' }
          git config user.name 'fcc-cloud-reconciliation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff check failed.' }
          git commit -m 'P05: repair recovered owner-last summary drift'
          git push origin HEAD:reconcile/p05-owner-real-target-current-main
