name: P08-004 ConPTY Terminal Host

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FCCCodeDesktop.Application/Terminal/**'
      - 'src/FCCCodeDesktop.Terminal/**'
      - 'tests/FCCCodeDesktop.UnitTests/ConPtyTerminalContractTests.cs'
      - 'tools/terminal/validate-conpty-terminal-host.ps1'
      - '.github/workflows/p08-004-conpty-terminal-host.yml'
      - 'docs/terminal/CONPTY_TERMINAL_HOST.md'
  push:
    branches: [main]
    paths:
      - 'src/FCCCodeDesktop.Application/Terminal/**'
      - 'src/FCCCodeDesktop.Terminal/**'
      - 'tests/FCCCodeDesktop.UnitTests/ConPtyTerminalContractTests.cs'
      - 'tools/terminal/validate-conpty-terminal-host.ps1'
      - '.github/workflows/p08-004-conpty-terminal-host.yml'
      - 'docs/terminal/CONPTY_TERMINAL_HOST.md'

permissions:
  contents: read

jobs:
  conpty-terminal-host:
    name: ConPTY Terminal Host Validation
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
          cache: false

      - name: Validate P08-004 ConPTY terminal host
        shell: pwsh
        run: .\tools\terminal\validate-conpty-terminal-host.ps1 -Configuration Release
