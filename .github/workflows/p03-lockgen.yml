name: P03 Lock Generation

on:
  push:
    branches:
      - worker/fccd-p03-001-sqlite-bootstrap

permissions:
  contents: write

jobs:
  generate-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: worker/fccd-p03-001-sqlite-bootstrap

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Regenerate lock files
        shell: pwsh
        run: dotnet restore FCCCodeDesktop.sln --force-evaluate -p:RestoreLockedMode=false

      - name: Commit generated lock files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/**/packages.lock.json tests/**/packages.lock.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "P03-001: regenerate package locks"
            git push origin HEAD:worker/fccd-p03-001-sqlite-bootstrap
          }
