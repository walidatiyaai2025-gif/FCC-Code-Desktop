name: P08-006 Optional Shell Detection

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FCCCodeDesktop.Application/Terminal/OptionalShellDetection.cs'
      - 'src/FCCCodeDesktop.Terminal/WindowsOptionalShellDetector.cs'
      - 'tests/FCCCodeDesktop.UnitTests/OptionalShellDetectionTests.cs'
      - 'tools/terminal/validate-optional-shell-detection.ps1'
      - '.github/workflows/p08-006-optional-shell-detection.yml'
      - 'docs/terminal/OPTIONAL_SHELL_DETECTION.md'
  push:
    branches: [main]
    paths:
      - 'src/FCCCodeDesktop.Application/Terminal/OptionalShellDetection.cs'
      - 'src/FCCCodeDesktop.Terminal/WindowsOptionalShellDetector.cs'
      - 'tests/FCCCodeDesktop.UnitTests/OptionalShellDetectionTests.cs'
      - 'tools/terminal/validate-optional-shell-detection.ps1'
      - '.github/workflows/p08-006-optional-shell-detection.yml'
      - 'docs/terminal/OPTIONAL_SHELL_DETECTION.md'

permissions:
  contents: read

jobs:
  optional-shell-detection:
    name: Optional Shell Detection Validation
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
          cache: false

      - name: Validate P08-006 optional shell detection
        shell: pwsh
        run: .\tools\terminal\validate-optional-shell-detection.ps1 -Configuration Release
