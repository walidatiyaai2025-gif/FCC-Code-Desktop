name: P06-007 Reconciliation Worker

on:
  push:
    branches:
      - worker/fccd-p06-007-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply exact reconciliation
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Replace-Once {
            param([string]$Text, [string]$Old, [string]$New, [string]$Label)
            $count = ([regex]::Matches($Text, [regex]::Escape($Old))).Count
            if ($count -ne 1) { throw "$Label expected exactly one match, found $count." }
            return $Text.Replace($Old, $New)
          }

          $utf8 = [System.Text.UTF8Encoding]::new($false)

          $currentPath = 'CURRENT_PHASE.md'
          $current = [IO.File]::ReadAllText($currentPath)
          $oldSummary = 'P06 is now the sole legal cloud implementation/convergence phase. `FCCD-P06-001 — Add/open/recent project workflows`, `FCCD-P06-002 — Project technology/tool detection framework`, `FCCD-P06-003 — Lazy file explorer`, and `FCCD-P06-004 — Safe file service` have been normally integrated and exact-main verified. Live ownership currently shows `FCCD-P06-005 — Locally bundled code editor` on fresh branch `worker/fccd-p06-005-local-code-editor`; workers must not duplicate or steal that work.'
          $newSummary = 'P06 is now the sole legal cloud implementation/convergence phase. `FCCD-P06-001 — Add/open/recent project workflows`, `FCCD-P06-002 — Project technology/tool detection framework`, `FCCD-P06-003 — Lazy file explorer`, `FCCD-P06-004 — Safe file service`, and `FCCD-P06-007 — Workspace content/file/regex search` have been normally integrated and exact-main verified. Live ownership currently shows `FCCD-P06-005 — Locally bundled code editor` on fresh branch `worker/fccd-p06-005-local-code-editor`; workers must not duplicate or steal that work.'
          $current = Replace-Once $current $oldSummary $newSummary 'CURRENT_PHASE integrated-task summary'
          $current = Replace-Once $current '- `FCCD-P06-007` — Workspace content/file/regex search — PENDING.' '- `FCCD-P06-007` — Workspace content/file/regex search — CLOSED.' 'CURRENT_PHASE P06-007 inventory row'
          if ($current.Contains('## P06-007 integration provenance', [StringComparison]::Ordinal)) { throw 'CURRENT_PHASE already contains P06-007 provenance.' }
          $provenance = @(
            '## P06-007 integration provenance',
            '',
            '- Exact repaired implementation candidate: `fcf6ff496fc50837a401c15c8d1e0823439a0a41`.',
            '- PR #151 exact-head canonical Windows CI: run `34017478027` / run #277 — SUCCESS.',
            '- PR #151 exact-head P06-007 workspace-search CI: run `34017478002` / run #6 — SUCCESS.',
            '- Normal merge commit: `cc367f627a41850cae4535a0849897cded243a7e`.',
            '- Exact post-merge canonical-main Windows CI: run `34017817458` / run #278 — SUCCESS.',
            '- Exact post-merge P06-007 workspace-search CI: run `34017817476` / run #7 — SUCCESS.',
            '- Integrated evidence: `evidence/phases/P06/P06_007_INTEGRATED_RECONCILIATION_2026-09-06.md`.',
            '- Evidence class remains cloud/self-test for bounded cancellable filename/content/regex workspace search and Projects-surface mechanics; no new owner-only evidence, P05 exit-gate PASS, P06 phase closure, or release eligibility is implied.',
            '',
            ''
          ) -join "`n"
          $current = Replace-Once $current '## P05 cloud task inventory' ($provenance + '## P05 cloud task inventory') 'CURRENT_PHASE provenance insertion'
          [IO.File]::WriteAllText($currentPath, $current, $utf8)

          $ledgerPath = 'docs/TASK_LEDGER.md'
          $ledger = [IO.File]::ReadAllText($ledgerPath)
          $ledger = Replace-Once $ledger '| FCCD-P06-007 | Workspace content/file/regex search | PENDING |' '| FCCD-P06-007 | Workspace content/file/regex search | CLOSED |' 'TASK_LEDGER P06-007 row'
          if ($ledger.Contains('`FCCD-P06-007` is CLOSED from the production bounded workspace search', [StringComparison]::Ordinal)) { throw 'TASK_LEDGER already contains P06-007 reconciliation narrative.' }
          $ledgerNarrative = '`FCCD-P06-007` is CLOSED from the production bounded workspace search and permanent validation. The implementation provides filename, literal-content, and line-based regular-expression modes; asynchronous cancellable traversal; explicit file/result/file-size bounds; regex timeout; generated-directory exclusion; binary/unsupported-encoding skipping; reparse-point non-traversal; project-root containment; and a virtualized WPF search surface with explicit Search/Cancel behavior. Cloud-repairable defects were fixed rather than deferred, including analyzer `CA1822` and xUnit analyzer `xUnit2014`. Final exact candidate `fcf6ff496fc50837a401c15c8d1e0823439a0a41` passed canonical Windows CI run `34017478027` / run #277 and the dedicated P06-007 workspace-search run `34017478002` / run #6. PR #151 was normally merged as `cc367f627a41850cae4535a0849897cded243a7e`; exact post-merge canonical-main Windows CI run `34017817458` / run #278 and exact post-merge P06-007 workspace-search run `34017817476` / run #7 both completed SUCCESS on that exact merge SHA. Task evidence: `evidence/phases/P06/P06_007_INTEGRATED_RECONCILIATION_2026-09-06.md`. This evidence is cloud/self-test plus canonical integration provenance only; it adds no owner-only obligation and does not claim P05 exit-gate PASS, P06 phase closure, release eligibility, or `VERIFIED_FINAL_COMPLETE`.' + "`n`n"
          $ledger = Replace-Once $ledger '## P07 — Changes and Git' ($ledgerNarrative + '## P07 — Changes and Git') 'TASK_LEDGER P06-007 narrative insertion'
          $oldCurrent = '`CURRENT_PHASE = P06` and P06 remains `IN_PROGRESS` with `PHASE_EXIT_GATE=NOT_RUN`. `FCCD-P06-001`, `FCCD-P06-002`, `FCCD-P06-003`, and `FCCD-P06-004` are CLOSED after exact PR-head validation, normal merge integration, exact post-merge canonical-main Windows CI, and durable reconciliation evidence. `FCCD-P06-005` through `FCCD-P06-008` remain PENDING; `FCCD-P06-005` is currently actively owned by fresh branch `worker/fccd-p06-005-local-code-editor` and must not be duplicated or stolen.'
          $newCurrent = '`CURRENT_PHASE = P06` and P06 remains `IN_PROGRESS` with `PHASE_EXIT_GATE=NOT_RUN`. `FCCD-P06-001`, `FCCD-P06-002`, `FCCD-P06-003`, `FCCD-P06-004`, and `FCCD-P06-007` are CLOSED after exact PR-head validation, normal merge integration, exact post-merge canonical-main validation, and durable reconciliation evidence. `FCCD-P06-005`, `FCCD-P06-006`, and `FCCD-P06-008` remain PENDING; `FCCD-P06-005` is currently actively owned by fresh branch `worker/fccd-p06-005-local-code-editor` and must not be duplicated or stolen.'
          $ledger = Replace-Once $ledger $oldCurrent $newCurrent 'TASK_LEDGER current-next-action summary'
          $ledger = Replace-Once $ledger 'After this P06-004 reconciliation is integrated and exact resulting `main` remains green, re-run the Worker Protocol claim map.' 'After this P06-007 reconciliation is integrated and exact resulting `main` remains green, re-run the Worker Protocol claim map.' 'TASK_LEDGER next-action provenance'
          [IO.File]::WriteAllText($ledgerPath, $ledger, $utf8)

          $evidencePath = 'evidence/phases/P06/P06_007_INTEGRATED_RECONCILIATION_2026-09-06.md'
          if (Test-Path -LiteralPath $evidencePath) { throw "Evidence path already exists: $evidencePath" }
          $evidence = @(
            '# P06-007 Integrated Reconciliation — 2026-09-06',
            '',
            '## Task',
            '',
            '- Task: `FCCD-P06-007 — Workspace content/file/regex search`.',
            '- Reconciliation classification: cloud integration evidence only.',
            '- Canonical task closure is justified by production integration plus exact PR-head and exact-post-merge validation; no provider-backed, manual, target-machine, or owner-only evidence is claimed here.',
            '',
            '## Live-state recovery',
            '',
            '- Canonical `CURRENT_PHASE` remained `P06`; P08 and later work were not legal.',
            '- Production P06-007 code was already normally merged by PR #151, but `CURRENT_PHASE.md` and `docs/TASK_LEDGER.md` still recorded the task as `PENDING`.',
            '- Recovery/integration-pending work therefore took precedence over selecting a new implementation task.',
            '- P06-005 remains separately owned by PR #149 / `worker/fccd-p06-005-local-code-editor`; this reconciliation does not modify, duplicate, or steal that work.',
            '',
            '## Production integration',
            '',
            '- Final repaired implementation candidate: `fcf6ff496fc50837a401c15c8d1e0823439a0a41`.',
            '- Implementation PR: #151 — `FCCD-P06-007 — Workspace content/file/regex search`.',
            '- Normal merge commit: `cc367f627a41850cae4535a0849897cded243a7e`.',
            '- Integrated implementation covers filename search, literal-content search, line-based regex search, asynchronous cancellation, bounded files/results/file sizes, regex timeout, generated-directory exclusion, binary/unsupported-encoding handling, reparse-point non-traversal, project-root containment, and virtualized Search/Cancel WPF presentation.',
            '- Search remains read-only and does not bypass the P06-004 safe file-write boundary.',
            '',
            '## Validation provenance',
            '',
            '### Exact PR head',
            '',
            '- Canonical Windows CI run `34017478027` / run #277 — `SUCCESS`.',
            '- Dedicated P06-007 Workspace Search run `34017478002` / run #6 — `SUCCESS`.',
            '- Cloud-repairable defects discovered before final green were fixed rather than deferred: analyzer `CA1822` and xUnit analyzer `xUnit2014`.',
            '',
            '### Exact post-merge canonical main',
            '',
            '- Exact SHA: `cc367f627a41850cae4535a0849897cded243a7e`.',
            '- Canonical Windows CI run `34017817458` / run #278 — `SUCCESS`.',
            '- Dedicated P06-007 Workspace Search run `34017817476` / run #7 — `SUCCESS`.',
            '- The dedicated post-merge job passed both the complete Windows Release baseline and `validate-workspace-search.ps1 -RunFixtures -RequireRuntime`.',
            '',
            '## Owner-last boundary',
            '',
            '- P06-007 introduces no new owner-only/manual/FCC/provider/Unity/Blender/clean-machine evidence requirement.',
            '- `docs/FINAL_OWNER_ACCEPTANCE_QUEUE.md` is intentionally unchanged.',
            '- Existing `OWNER-P04-008-REAL-TARGET` and `OWNER-P05-EXIT-REAL-TARGET` remain queued and release-blocking.',
            '- P04/P05 deferred phase gates remain `NOT_RUN`.',
            '- P06 remains `IN_PROGRESS` with `PHASE_EXIT_GATE=NOT_RUN`.',
            '- No P07/P08 authorization, P06 phase closure, release eligibility, or `VERIFIED_FINAL_COMPLETE` claim is made.',
            '',
            '## Reconciliation result',
            '',
            '- Mark `FCCD-P06-007` `CLOSED` in the canonical task ledger and P06 inventory.',
            '- Record exact implementation, merge, and post-merge CI provenance.',
            '- Leave P06-005, P06-006, and P06-008 unresolved.',
            '- Re-run live claim/recovery selection only after this reconciliation is integrated and exact resulting main remains green.',
            ''
          ) -join "`n"
          [IO.File]::WriteAllText($evidencePath, $evidence, $utf8)

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }
          foreach ($required in @('CURRENT_PHASE.md', 'docs/TASK_LEDGER.md', 'evidence/phases/P06/P06_007_INTEGRATED_RECONCILIATION_2026-09-06.md')) {
            if (($required -eq 'evidence/phases/P06/P06_007_INTEGRATED_RECONCILIATION_2026-09-06.md' -and -not (Test-Path -LiteralPath $required)) -or ($required -ne 'evidence/phases/P06/P06_007_INTEGRATED_RECONCILIATION_2026-09-06.md' -and @(git diff --name-only) -notcontains $required)) { throw "Expected reconciliation change missing: $required" }
          }

      - name: Commit exact reconciliation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_PHASE.md docs/TASK_LEDGER.md evidence/phases/P06/P06_007_INTEGRATED_RECONCILIATION_2026-09-06.md
          git commit -m "Reconcile FCCD-P06-007 integrated closure"
          git push origin HEAD:worker/fccd-p06-007-reconcile
