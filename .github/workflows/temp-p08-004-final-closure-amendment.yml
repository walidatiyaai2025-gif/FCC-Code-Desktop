name: P08-004 Final Closure Evidence Amendment

on:
  push:
    branches:
      - reconcile/fccd-p08-004-final-closure-evidence

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard canonical base and append final closure provenance
        shell: bash
        run: |
          set -euo pipefail
          expected_base="7228fac7f32abf1d80a39ac697120c2d16306044"
          git merge-base --is-ancestor "$expected_base" HEAD
          changed="$(git diff --name-only "$expected_base"...HEAD)"
          if [ "$changed" != ".github/workflows/temp-p08-004-final-closure-amendment.yml" ]; then
            echo "Unexpected pre-amendment branch delta:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          files = [
              Path("CURRENT_PHASE.md"),
              Path("PROJECT_CONTROL.md"),
              Path("docs/TASK_LEDGER.md"),
              Path("evidence/phases/P08/P08_004_INTEGRATED_RECONCILIATION_2026-09-07.md"),
          ]
          marker = "<!-- FCCD-P08-004-FINAL-CLOSURE-PROVENANCE -->"
          lines = [
              "",
              marker,
              "## FCCD-P08-004 final canonical closure provenance",
              "",
              "- Task: `FCCD-P08-004 — ConPTY terminal host` — `CLOSED`.",
              "- Implementation PR: #196; exact implementation candidate `218cc7d93fafb690a5e2cf7192970bf6be0caa1f`; normal implementation merge `da9caf9fb1542b7e080ddd768b77f73e653bb08b`.",
              "- Canonical closure reconciliation PR: #203; exact reconciliation head `d09653191cf36a9f1b428d785ec572c5d1183382`; normal reconciliation merge / exact resulting main `7228fac7f32abf1d80a39ac697120c2d16306044`.",
              "- Exact resulting-main Windows CI: run `34122854398` / #539 — `SUCCESS`.",
              "- Exact resulting-main P06-007 Workspace Search: run `34122854368` / #268 — `SUCCESS`.",
              "- Exact resulting-main P06-008 Large Workspace Safeguards: run `34122854364` / #252 — `SUCCESS`.",
              "- These exact-main runs completed after PR #203 merged and exposed no post-reconciliation regression. They are the final task-closure baseline and supersede the earlier pre-reconciliation `f86e8bc5...` main only as the canonical closure endpoint; the earlier implementation/integration provenance remains valid historical evidence.",
              "- P08 remains `IN_PROGRESS`; `FCCD-P08-007` and `FCCD-P08-008` remain `PENDING`; `PHASE_EXIT_GATE=NOT_RUN`; no later phase is authorized by this task closure.",
              "- No owner-only evidence is required for P08-004. Existing owner-last obligations are unchanged and `VERIFIED_FINAL_COMPLETE=false`.",
              "",
          ]
          block = "\n".join(lines)
          for path in files:
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  raise SystemExit(f"Final closure provenance already present in {path}")
              path.write_text(text.rstrip() + block + "\n", encoding="utf-8")
          PY

      - name: Commit durable canonical files only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-p08-004-final-closure-amendment.yml
          git add CURRENT_PHASE.md PROJECT_CONTROL.md docs/TASK_LEDGER.md evidence/phases/P08/P08_004_INTEGRATED_RECONCILIATION_2026-09-07.md .github/workflows/temp-p08-004-final-closure-amendment.yml
          if git diff --cached --quiet; then
            echo "No canonical amendment delta produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P08-004: record final exact-main closure provenance"
          git push origin HEAD:reconcile/fccd-p08-004-final-closure-evidence
