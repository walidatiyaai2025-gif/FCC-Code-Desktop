name: P10-012 Unity Cancellation Recovery

on:
  push:
    branches:
      - main
    paths:
      - 'src/FCCCodeDesktop.Tools.Unity/UnityOperationRecovery.cs'
      - 'tests/FCCCodeDesktop.UnityRecoveryFixture/**'
      - 'tools/unity/validate-unity-recovery.ps1'
      - '.github/workflows/p10-012-unity-recovery.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/FCCCodeDesktop.Tools.Unity/UnityOperationRecovery.cs'
      - 'tests/FCCCodeDesktop.UnityRecoveryFixture/**'
      - 'tools/unity/validate-unity-recovery.ps1'
      - '.github/workflows/p10-012-unity-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p10-012-unity-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unity Cancellation Recovery
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Validate Unity cancellation/recovery contract
        shell: pwsh
        run: .\tools\unity\validate-unity-recovery.ps1
