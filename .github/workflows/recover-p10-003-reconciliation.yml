name: Recover P10-003 reconciliation

on:
  push:
    branches:
      - worker/fccd-p10-003-integrated-reconciliation
    paths:
      - .github/workflows/recover-p10-003-reconciliation.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: windows-2025
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Merge exact current main and reconcile P10-003
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedPriorHead = '3e9bf46cae3878343c4cf7219736b26f3007a0ca'
          $expectedMain = 'ad2395e23d1bf6c3bbf664dedda4b464408cb675'
          $branch = 'worker/fccd-p10-003-integrated-reconciliation'
          $workflowPath = '.github/workflows/recover-p10-003-reconciliation.yml'

          git config user.name 'fccd-recovery-bot'
          git config user.email 'fccd-recovery-bot@users.noreply.github.com'

          $triggerParent = (git rev-parse "$env:GITHUB_SHA^").Trim()
          if ($triggerParent -ne $expectedPriorHead) {
            throw "Recovery bootstrap parent moved: expected $expectedPriorHead, got $triggerParent"
          }

          git fetch origin main --no-tags
          $liveMain = (git rev-parse origin/main).Trim()
          if ($liveMain -ne $expectedMain) {
            throw "Canonical main moved before recovery: expected $expectedMain, got $liveMain"
          }

          git switch -C recovery-work $env:GITHUB_SHA
          git merge --no-commit --no-ff origin/main
          $mergeExit = $LASTEXITCODE
          $unmerged = @(git diff --name-only --diff-filter=U)
          $allowedConflicts = @('CURRENT_PHASE.md', 'docs/TASK_LEDGER.md')

          if ($mergeExit -ne 0) {
            $unexpected = @($unmerged | Where-Object { $_ -notin $allowedConflicts })
            if ($unexpected.Count -gt 0) {
              throw "Unexpected merge conflicts: $($unexpected -join ', ')"
            }
            if ($unmerged.Count -eq 0) {
              throw 'Merge failed without conflict paths.'
            }
            foreach ($path in $unmerged) {
              git checkout --theirs -- $path
            }
          }

          function Replace-ExactlyOnce([string]$Path, [string]$Old, [string]$New) {
            $text = [IO.File]::ReadAllText($Path)
            $count = ([regex]::Matches($text, [regex]::Escape($Old))).Count
            if ($count -ne 1) {
              throw "Expected exactly one match in $Path but found $count for: $Old"
            }
            [IO.File]::WriteAllText($Path, $text.Replace($Old, $New), [Text.UTF8Encoding]::new($false))
          }

          Replace-ExactlyOnce 'CURRENT_PHASE.md' '- `FCCD-P10-003` — Strongly typed Unity CLI command builder — PENDING.' '- `FCCD-P10-003` — Strongly typed Unity CLI command builder — CLOSED.'
          Replace-ExactlyOnce 'docs/TASK_LEDGER.md' '| FCCD-P10-003 | Strongly typed Unity CLI command builder | PENDING |' '| FCCD-P10-003 | Strongly typed Unity CLI command builder | CLOSED |'

          Replace-ExactlyOnce 'CURRENT_PHASE.md' '- Concurrent P10-003 implementation was normally merged as `165708a542faee753149fedc19c787297a75f38d`; its canonical row remains PENDING and is not modified here. P10-001 also remains independently owned/PENDING.' '- Concurrent P10-003 implementation was normally merged as `165708a542faee753149fedc19c787297a75f38d`; at P10-002 reconciliation time its canonical row remained PENDING and was not modified there. It is reconciled CLOSED separately by the P10-003 evidence below. P10-001 remains independently owned/PENDING.'
          Replace-ExactlyOnce 'docs/TASK_LEDGER.md' 'Concurrent P10-003 implementation merge `165708a542faee753149fedc19c787297a75f38d` is preserved with its canonical row still PENDING; P10-001 is likewise unchanged.' 'Concurrent P10-003 implementation merge `165708a542faee753149fedc19c787297a75f38d` is preserved and reconciled CLOSED by `evidence/phases/P10/P10_003_INTEGRATED_RECONCILIATION_2026-09-08.md`; P10-001 remains unchanged.'

          $currentPhase = [IO.File]::ReadAllText('CURRENT_PHASE.md')
          if ($currentPhase.Contains('<!-- FCCD-P10-003-INTEGRATED-CLOSURE -->')) {
            throw 'P10-003 provenance marker unexpectedly already exists on canonical main.'
          }
          $provenance = @'

<!-- FCCD-P10-003-INTEGRATED-CLOSURE -->
## P10-003 integration provenance

- Task: `FCCD-P10-003 — Strongly typed Unity CLI command builder` — `CLOSED` in this reconciliation candidate.
- Implementation PR: #233 (`worker/fccd-p10-003-unity-cli-command-builder`).
- Exact accepted implementation candidate: `cbe73e901443a7847e4fae3f3da1e582fad93be4`.
- Exact implementation-head P10-003 Unity CLI Command Builder: run `34202055613` / #2 — SUCCESS.
- Exact implementation-head Windows CI: run `34202055606` / #644 — SUCCESS.
- Exact implementation-head P06-007 Workspace Search: run `34202055667` / #373 — SUCCESS.
- Exact implementation-head P06-008 Large Workspace Safeguards: run `34202055612` / #357 — SUCCESS.
- Normal implementation merge / accepted implementation main: `165708a542faee753149fedc19c787297a75f38d`.
- Exact implementation-main P10-003 Unity CLI Command Builder: run `34202965959` / #3 — SUCCESS.
- Exact implementation-main Windows CI: run `34202965960` / #645 — SUCCESS.
- Exact implementation-main P06-007 Workspace Search: run `34202965953` / #374 — SUCCESS.
- Exact implementation-main P06-008 Large Workspace Safeguards: run `34202965909` / #358 — SUCCESS.
- Integrated evidence: `evidence/phases/P10/P10_003_INTEGRATED_RECONCILIATION_2026-09-08.md`.
- Recovery preserved the already-integrated P10-002 CLOSED state from PR #234 and reused existing PR #235 rather than creating duplicate work.
- No owner-only evidence is required or added. P10 remains `IN_PROGRESS`; all other unresolved P10 task rows retain their canonical states; `PHASE_EXIT_GATE=NOT_RUN`; P11 and later implementation remain prohibited; `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item; `VERIFIED_FINAL_COMPLETE=false`.
'@
          [IO.File]::WriteAllText('CURRENT_PHASE.md', ($currentPhase.TrimEnd() + $provenance + "`n"), [Text.UTF8Encoding]::new($false))

          $evidencePath = 'evidence/phases/P10/P10_003_INTEGRATED_RECONCILIATION_2026-09-08.md'
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            throw "Expected existing P10-003 evidence file is missing: $evidencePath"
          }
          $evidence = [IO.File]::ReadAllText($evidencePath)
          if ($evidence.Contains('## Concurrency recovery after P10-002 reconciliation')) {
            throw 'Recovery note unexpectedly already exists in P10-003 evidence.'
          }
          $recoveryNote = @'

## Concurrency recovery after P10-002 reconciliation

Before final integration, PR #234 normally merged the independent P10-002 canonical reconciliation and advanced exact canonical `main` to `ad2395e23d1bf6c3bbf664dedda4b464408cb675`. That made this existing PR #235 non-mergeable because both reconciliations touched `CURRENT_PHASE.md` and `docs/TASK_LEDGER.md`.

Recovery reused PR #235 and its already-green P10-003 reconciliation history. Exact current main was merged into the same branch without force-push; only the two canonical text conflicts were resolved, preserving P10-002 as CLOSED while applying P10-003 CLOSED. The durable candidate remains limited to `CURRENT_PHASE.md`, `docs/TASK_LEDGER.md`, and this P10-003 evidence file relative to exact recovery main. No product implementation, P10-001 state, owner evidence, later-phase work, or release-complete claim is introduced.
'@
          [IO.File]::WriteAllText($evidencePath, ($evidence.TrimEnd() + $recoveryNote + "`n"), [Text.UTF8Encoding]::new($false))

          if (-not ([IO.File]::ReadAllText('CURRENT_PHASE.md').Contains('- `FCCD-P10-002` — Unity install/Hub editor resolver — CLOSED.'))) {
            throw 'P10-002 CLOSED state was not preserved in CURRENT_PHASE.md.'
          }
          if (-not ([IO.File]::ReadAllText('docs/TASK_LEDGER.md').Contains('| FCCD-P10-002 | Unity install/Hub editor resolver | CLOSED |'))) {
            throw 'P10-002 CLOSED state was not preserved in TASK_LEDGER.md.'
          }

          git rm -- $workflowPath
          git add -- CURRENT_PHASE.md docs/TASK_LEDGER.md $evidencePath

          $finalDiff = @(git diff --name-only origin/main -- | Sort-Object -Unique)
          $expectedDiff = @('CURRENT_PHASE.md', 'docs/TASK_LEDGER.md', $evidencePath) | Sort-Object
          if (($finalDiff -join "`n") -ne ($expectedDiff -join "`n")) {
            throw "Unexpected durable diff relative to exact main. Expected: $($expectedDiff -join ', '); actual: $($finalDiff -join ', ')"
          }

          git status --short
          git commit -m 'Recover PR #235 on P10-002-reconciled main'
          git push origin HEAD:$branch
