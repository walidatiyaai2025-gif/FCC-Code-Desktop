name: P10-002 reconciliation bootstrap

on:
  push:
    branches:
      - reconcile/fccd-p10-002-integrated-closure
    paths:
      - .github/workflows/reconcile-p10-002-bootstrap.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: reconcile/fccd-p10-002-integrated-closure

      - name: Apply exact canonical reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          current_path = Path('CURRENT_PHASE.md')
          ledger_path = Path('docs/TASK_LEDGER.md')
          evidence_path = Path('evidence/phases/P10/P10_002_INTEGRATED_RECONCILIATION_2026-09-08.md')

          current = current_path.read_text(encoding='utf-8')
          old_current = '- `FCCD-P10-002` — Unity install/Hub editor resolver — PENDING.'
          new_current = '- `FCCD-P10-002` — Unity install/Hub editor resolver — CLOSED.'
          if current.count(old_current) != 1:
              raise SystemExit('CURRENT_PHASE P10-002 inventory anchor is missing or duplicated')
          current = current.replace(old_current, new_current)

          provenance = """## P10-002 integration provenance

          - Task: `FCCD-P10-002 — Unity install/Hub editor resolver` — `CLOSED` in this reconciliation candidate.
          - Live recovery boundary: the scheduling hint was future P18-005 while canonical `CURRENT_PHASE=P10`; P10-001 remained branch-owned and P10-003 remained actively owned by draft PR #233, so neither was modified.
          - Implementation PR: #232 (`worker/fccd-p10-002-unity-editor-resolver`).
          - Exact accepted implementation candidate: `0d411d877f3e56a7cde08aef3f0c50ff65997733`.
          - Exact implementation-head P10-002 Unity Editor Resolution: run `34201337027` / #2 — SUCCESS.
          - Exact implementation-head Windows CI: run `34201337061` / #641 — SUCCESS.
          - Exact implementation-head P06-007 Workspace Search: run `34201336981` / #370 — SUCCESS.
          - Exact implementation-head P06-008 Large Workspace Safeguards: run `34201337068` / #354 — SUCCESS.
          - Normal implementation merge / accepted implementation main: `844edc01c9073048d800a59cafa78d59a78b2668`.
          - Exact implementation-main P10-002 Unity Editor Resolution: run `34202036522` / #3 — SUCCESS.
          - Exact implementation-main Windows CI: run `34202036486` / #643 — SUCCESS.
          - Exact implementation-main P06-007 Workspace Search: run `34202036528` / #372 — SUCCESS.
          - Exact implementation-main P06-008 Large Workspace Safeguards: run `34202036385` / #356 — SUCCESS.
          - Integrated evidence: `evidence/phases/P10/P10_002_INTEGRATED_RECONCILIATION_2026-09-08.md`.
          - No owner-only evidence is required or added. P10 remains `IN_PROGRESS`; `PHASE_EXIT_GATE=NOT_RUN`; P11 and later phases remain prohibited; `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item; `VERIFIED_FINAL_COMPLETE=false`.
          """
          current_anchor = '## P10 cloud activation provenance'
          if current.count(current_anchor) != 1:
              raise SystemExit('CURRENT_PHASE P10 activation anchor is missing or duplicated')
          current = current.replace(current_anchor, provenance + '\n' + current_anchor)
          current_path.write_text(current, encoding='utf-8')

          ledger = ledger_path.read_text(encoding='utf-8')
          old_ledger = '| FCCD-P10-002 | Unity install/Hub editor resolver | PENDING |'
          new_ledger = '| FCCD-P10-002 | Unity install/Hub editor resolver | CLOSED |'
          if ledger.count(old_ledger) != 1:
              raise SystemExit('TASK_LEDGER P10-002 row anchor is missing or duplicated')
          ledger = ledger.replace(old_ledger, new_ledger)
          ledger_section = """`FCCD-P10-002` is CLOSED from the exact-version Unity install/Hub editor resolver integrated in PR #232. Exact accepted implementation candidate `0d411d877f3e56a7cde08aef3f0c50ff65997733` passed P10-002 Unity Editor Resolution `34201337027` / #2, Windows CI `34201337061` / #641, P06-007 Workspace Search `34201336981` / #370, and P06-008 Large Workspace Safeguards `34201337068` / #354. The implementation was normally merged as `844edc01c9073048d800a59cafa78d59a78b2668`; that exact implementation main passed P10-002 Unity Editor Resolution `34202036522` / #3, Windows CI `34202036486` / #643, Workspace Search `34202036528` / #372, and Large Workspace Safeguards `34202036385` / #356. Coverage includes exact requested-version resolution only, configured-root precedence before the default Unity Hub editor root, Hub-collection and direct-install roots, mandatory `Editor/Unity.exe` existence, immutable source provenance, path/version-input validation, root normalization/de-duplication, China revision suffix support, missing-executable handling, and cancellation propagation. An initial analyzer CA1859 failure was repaired by tightening the internal helper to `HashSet<string>` rather than suppressing analyzers or weakening quality gates. Task evidence: `evidence/phases/P10/P10_002_INTEGRATED_RECONCILIATION_2026-09-08.md`. No owner-only evidence is required. P10 remains `IN_PROGRESS`; P10-001 and P10-003 states are preserved from the live canonical baseline; P10-004 through P10-013 remain PENDING; `PHASE_EXIT_GATE=NOT_RUN`; P11+ remain prohibited; `VERIFIED_FINAL_COMPLETE=false`.
          """
          ledger_anchor = '## P11 — Blender first-class adapter'
          if ledger.count(ledger_anchor) != 1:
              raise SystemExit('TASK_LEDGER P11 anchor is missing or duplicated')
          ledger = ledger.replace(ledger_anchor, ledger_section + '\n' + ledger_anchor)
          ledger_path.write_text(ledger, encoding='utf-8')

          evidence = """# FCCD-P10-002 — Integrated Reconciliation Evidence

          Date: 2026-09-08
          Task: `FCCD-P10-002 — Unity install/Hub editor resolver`
          Classification: CLOUD / HOSTED-WINDOWS / INTEGRATED
          Canonical task result: CLOSED after normal implementation integration, exact-main validation, and canonical reconciliation.

          ## Live-state recovery and concurrency

          The scheduling request carried future hint `FCCD-P18-005`, but canonical live state remained `CURRENT_PHASE=P10`. The implementation for P10-002 was already normally merged while both canonical inventories still listed the task as PENDING, making reconciliation the highest-priority recoverable unit. `worker/fccd-p10-001-unity-project-detector` remained separately branch-owned, and P10-003 was actively owned by draft PR #233 / `worker/fccd-p10-003-unity-cli-command-builder`; neither implementation or canonical state was modified by this reconciliation.

          Pre-reconciliation canonical main: `844edc01c9073048d800a59cafa78d59a78b2668`.

          ## Implementation

          - Implementation PR: #232 — `P10-002: resolve exact Unity Hub editor installations`.
          - Branch: `worker/fccd-p10-002-unity-editor-resolver`.
          - Exact accepted implementation candidate: `0d411d877f3e56a7cde08aef3f0c50ff65997733`.
          - Adds project-owned typed read-only `IUnityEditorResolver` / `UnityEditorResolver` contracts under `FCCCodeDesktop.Tools.Unity`.
          - Resolves only the exact requested Unity Editor version; it never silently substitutes a nearby editor version.
          - Searches configured editor roots before the Unity Hub default editor root under `Program Files/Unity/Hub/Editor`.
          - Supports configured roots that identify either a Hub-style version collection or a direct version installation.
          - Reports a match only when the requested installation contains `Editor/Unity.exe`.
          - Returns immutable resolution status, resolved installation path, and source provenance.
          - Normalizes and de-duplicates roots, rejects malformed/path-like version input, supports canonical China revision suffixes, and propagates cancellation.
          - Focused deterministic validation covers configured/default precedence, direct roots, missing executables, de-duplication, version validation, path-injection rejection, and cancellation.
          - Permanent validator: `tools/unity/validate-unity-editor-resolution.ps1`.
          - Permanent workflow: `.github/workflows/p10-002-unity-editor-resolution.yml`.

          ## Repair history

          The first focused CI execution exposed analyzer `CA1859` on an internal helper accepting an interface-typed set. The implementation was repaired by tightening the helper to `HashSet<string>`; no analyzer suppression, warning downgrade, or gate weakening was introduced. Final accepted head is `0d411d877f3e56a7cde08aef3f0c50ff65997733`.

          ## Exact implementation-head validation

          On exact head `0d411d877f3e56a7cde08aef3f0c50ff65997733`:

          - P10-002 Unity Editor Resolution `34201337027` / #2 — SUCCESS.
          - Windows CI `34201337061` / #641 — SUCCESS.
          - P06-007 Workspace Search `34201336981` / #370 — SUCCESS.
          - P06-008 Large Workspace Safeguards `34201337068` / #354 — SUCCESS.

          ## Normal implementation integration

          PR #232 was normally merged as `844edc01c9073048d800a59cafa78d59a78b2668`. The merge preserves accepted implementation head `0d411d877f3e56a7cde08aef3f0c50ff65997733` as its second parent, with previous main `8c96656510d74c735aa5374e1769ef61eec70958` as its first parent. No squash, rebase, force-push, or fabricated evidence is claimed. The accepted head and merge commit share Git tree `80cad4f502c547c8f0a8b913cb4d3abcae1693ff`, so the integrated product bytes are identical to the exact tested implementation head.

          ## Exact implementation-main validation

          On exact implementation main `844edc01c9073048d800a59cafa78d59a78b2668`:

          - P10-002 Unity Editor Resolution `34202036522` / #3 — SUCCESS.
          - Windows CI `34202036486` / #643 — SUCCESS, including the full permanent Windows validation baseline.
          - P06-007 Workspace Search `34202036528` / #372 — SUCCESS.
          - P06-008 Large Workspace Safeguards `34202036385` / #356 — SUCCESS.

          ## Owner-last classification

          P10-002 has no genuine owner-only/manual/provider/installed-Unity target requirement for this task boundary. Its resolver semantics are completely verifiable using deterministic hosted-Windows filesystem fixtures. No new owner queue item is added. `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item and is unchanged.

          ## Reconciliation boundary

          This reconciliation closes only `FCCD-P10-002`. P10 remains `IN_PROGRESS`; `PHASE_EXIT_GATE=NOT_RUN`; live state for P10-001 and P10-003 is preserved; P10-004 through P10-013 remain PENDING; P11 and later phases remain prohibited; `VERIFIED_FINAL_COMPLETE=false`.

          The reconciliation candidate itself must pass exact-head CI, be normally merged, and the resulting exact canonical main must remain green before this task closure is treated as the durable endpoint.
          """
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(evidence, encoding='utf-8')
          PY

          rm -f .github/workflows/reconcile-p10-002-bootstrap.yml
          git add -A
          expected=$'CURRENT_PHASE.md\ndocs/TASK_LEDGER.md\nevidence/phases/P10/P10_002_INTEGRATED_RECONCILIATION_2026-09-08.md'
          actual="$(git diff --cached --name-only origin/main | sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Unexpected prospective diff versus origin/main:\n%s\n' "$actual" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: reconcile integrated P10-002 closure'
          git push origin HEAD:reconcile/fccd-p10-002-integrated-closure
