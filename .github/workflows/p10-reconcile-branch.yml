name: P10 Reconcile Closure Branch

on:
  push:
    branches:
      - worker/p10-phase-closure
    paths:
      - '.github/workflows/p10-reconcile-branch.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v7
        with:
          ref: worker/p10-phase-closure
          fetch-depth: 0

      - name: Reconcile P10 task ledger
        shell: pwsh
        run: |
          $path = 'docs/TASK_LEDGER.md'
          $text = Get-Content -LiteralPath $path -Raw

          $required = @(
            '| FCCD-P10-011 | Unity structured UI events | PENDING |',
            '| FCCD-P10-012 | Unity cancellation/recovery | PENDING |',
            '| FCCD-P10-013 | Unity contract fixture/suite | PENDING |'
          )
          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) {
              throw "Expected unreconciled ledger row not found: $needle"
            }
          }

          $text = $text.Replace('| FCCD-P10-011 | Unity structured UI events | PENDING |', '| FCCD-P10-011 | Unity structured UI events | CLOSED |')
          $text = $text.Replace('| FCCD-P10-012 | Unity cancellation/recovery | PENDING |', '| FCCD-P10-012 | Unity cancellation/recovery | CLOSED |')
          $text = $text.Replace('| FCCD-P10-013 | Unity contract fixture/suite | PENDING |', '| FCCD-P10-013 | Unity contract fixture/suite | CLOSED |')

          $start = $text.IndexOf('## Current next action')
          $marker = $text.IndexOf('<!-- FCCD-P08-004-FINAL-CLOSURE-PROVENANCE -->')
          if ($start -lt 0 -or $marker -le $start) {
            throw 'Unable to locate canonical Current next action section boundaries.'
          }

          $replacement = @'
          ## Current next action

          `CURRENT_PHASE = P10` remains the sole active cloud phase for phase-exit convergence only. `FCCD-P10-001` through `FCCD-P10-013` are now CLOSED after normal implementation integration, task-specific/exact-main validation, and durable reconciliation. The next legal cloud action is the dedicated P10 Unity Adapter Exit gate on an immutable exact candidate. P11 and later implementation remain prohibited until P10 has `PHASE_EXIT_GATE=PASS`, canonical `evidence/phases/P10/CLOSURE.md`, normal closure integration, and exact-main verification. Preserve `OWNER-P04-008-REAL-TARGET` as the sole unresolved release-blocking owner item, keep `P04=NOT_RUN`, and keep `VERIFIED_FINAL_COMPLETE=false`.

          '@
          $text = $text.Substring(0, $start) + $replacement + $text.Substring($marker)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8NoBOM -NoNewline

      - name: Commit reconciliation
        shell: bash
        run: |
          if git diff --quiet -- docs/TASK_LEDGER.md; then
            echo 'No ledger changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TASK_LEDGER.md
          git commit -m 'P10 reconcile final task rows'
          git push origin HEAD:worker/p10-phase-closure
