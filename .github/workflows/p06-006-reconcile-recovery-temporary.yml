name: P06-006 Reconciliation Recovery Temporary

on:
  push:
    branches:
      - worker-b/fccd-p06-006-reconcile-recovery

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: worker-b/fccd-p06-006-reconcile-recovery
          fetch-depth: 0

      - name: Repair stale owner-last negative fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/final-acceptance/owner-last-policy-validator.ps1')
          text = path.read_text(encoding='utf-8')
          old = "    Assert-Rejected { Assert-Contract $root $policyText $queueText $ledgerText ($phaseText.Replace('CURRENT_PHASE: P06','CURRENT_PHASE: P07')) ($controlText.Replace('CURRENT_PHASE: P06','CURRENT_PHASE: P07')) $targetText $finalText $false } 'skip P06 with unqueued current-phase work'"
          new = "    Assert-Rejected { Assert-Contract $root $policyText $queueText ($ledgerText.Replace('| FCCD-P06-006 | Editor tabs/save/reload/dirty state | CLOSED |','| FCCD-P06-006 | Editor tabs/save/reload/dirty state | PENDING |')) ($phaseText.Replace('CURRENT_PHASE: P06','CURRENT_PHASE: P07')) ($controlText.Replace('CURRENT_PHASE: P06','CURRENT_PHASE: P07')) $targetText $finalText $false } 'skip P06 with unqueued current-phase work'"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale P06 skip fixture, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          git diff --check
          git diff -- tools/final-acceptance/owner-last-policy-validator.ps1

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/final-acceptance/owner-last-policy-validator.ps1
          git rm .github/workflows/p06-006-reconcile-recovery-temporary.yml
          git diff --cached --quiet && { echo "No recovery changes produced"; exit 1; }
          git commit -m "test: preserve owner-last P06 skip negative fixture"
          git push origin HEAD:worker-b/fccd-p06-006-reconcile-recovery
