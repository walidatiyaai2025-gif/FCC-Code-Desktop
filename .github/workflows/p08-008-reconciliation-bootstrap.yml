name: P08-008 Reconciliation Bootstrap

on:
  push:
    branches:
      - reconcile/fccd-p08-008-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v7
        with:
          ref: reconcile/fccd-p08-008-integrated-closure
          fetch-depth: 0

      - name: Apply guarded P08-008 reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python tools/reconciliation/reconcile-p08-008-after-p08-007.py
          python - <<'PY'
          from pathlib import Path
          phase = Path('CURRENT_PHASE.md')
          phase.write_text(phase.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8', newline='\n')
          evidence = Path('evidence/phases/P08/P08_008_INTEGRATED_RECONCILIATION_2026-09-08.md')
          normalized = '\n'.join(line.rstrip() for line in evidence.read_text(encoding='utf-8').splitlines()) + '\n'
          evidence.write_text(normalized, encoding='utf-8', newline='\n')
          PY
          git rm tools/reconciliation/reconcile-p08-008-after-p08-007.py .github/workflows/p08-008-reconciliation-bootstrap.yml
          git diff --check
          git diff --cached --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_PHASE.md docs/TASK_LEDGER.md evidence/phases/P08/P08_008_INTEGRATED_RECONCILIATION_2026-09-08.md
          git diff --cached --check
          git commit -m 'docs: reconcile P08-008 integrated closure'
          git push origin HEAD:reconcile/fccd-p08-008-integrated-closure
