name: P01-003 Exact Validation

on:
  push:
    branches:
      - validation/p01-003-exact-2cf2bb6

permissions:
  contents: read

jobs:
  exact-candidate:
    runs-on: windows-2025
    steps:
      - name: Checkout exact P01-003 candidate
        uses: actions/checkout@v4
        with:
          ref: 2cf2bb63c1d73f5b878264e63d6196616d21dbbb
          fetch-depth: 0

      - name: Setup exact .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Verify exact candidate
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '2cf2bb63c1d73f5b878264e63d6196616d21dbbb') { throw 'Candidate mismatch.' }
          if ((dotnet --version) -ne '10.0.400') { throw 'SDK mismatch.' }

      - name: Diff hygiene
        shell: pwsh
        run: git diff --check 0b84859edaccc4a9bb9c407b68a8c4b842d436d1 2cf2bb63c1d73f5b878264e63d6196616d21dbbb

      - name: Validate dependency policy
        shell: pwsh
        run: .\tools\dependencies\validate-dependency-policy.ps1 -RequireDotNet

      - name: Revalidate quality policy
        shell: pwsh
        run: .\tools\quality\validate-quality-policy.ps1 -RequireDotNet

      - name: Verify clean worktree
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) { throw "Validation mutated candidate:`n$dirty" }
