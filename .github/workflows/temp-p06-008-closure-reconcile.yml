name: Temporary P06-008 Closure Reconciliation

on:
  push:
    branches:
      - reconcile/fccd-p06-008-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconcile canonical P06-008 state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          function Replace-Exact {
            param([string]$Path, [string]$Old, [string]$New)
            $text = [IO.File]::ReadAllText($Path)
            $count = ([regex]::Matches($text, [regex]::Escape($Old))).Count
            if ($count -ne 1) { throw "Expected exactly one match in $Path but found $count for: $Old" }
            [IO.File]::WriteAllText($Path, $text.Replace($Old, $New), $utf8NoBom)
          }

          Replace-Exact 'docs/TASK_LEDGER.md' '| FCCD-P06-008 | Large file/tree safeguards | PENDING |' '| FCCD-P06-008 | Large file/tree safeguards | CLOSED |'

          $p06008Ledger = @'
          `FCCD-P06-008` is CLOSED from the production large-workspace safeguard integration plus permanent CI enforcement. Production candidate `b5e999440c9a5431e8181efffc885ff9570e705d` passed Windows CI `34022991731` / run #309, P06-007 regression `34022991732` / run #38, and dedicated P06-008 `34022991748` / run #18 before normal merge `c77473fcebb3317168ab1effdf67cc7ecd95bd99`; exact post-merge main then passed Windows CI `34023363325` / #310, P06-007 `34023363291` / #39, and P06-008 `34023363358` / #19. Recovery PR #155 was closed as superseded after preserving its legitimate unintegrated permanent-baseline idea. Repair candidate `faba60a8dacc34104b7fce70d12ad430a120bad9` then passed Windows CI `34023727676` / #311, P06-007 `34023727648` / #40, and P06-008 `34023727646` / #20; PR #156 was normally merged as `dc0a92683f292ac75706601b18bba36e6959656c`, and that exact main passed Windows CI `34024101741` / #312, P06-007 `34024101733` / #41, and P06-008 `34024101754` / #21. Task evidence: `evidence/phases/P06/P06_008_INTEGRATED_RECONCILIATION_2026-09-06.md`. This cloud/self-test and canonical integration evidence adds no owner-only obligation and does not claim P06 phase closure, P07 authorization, release eligibility, or `VERIFIED_FINAL_COMPLETE`.

          '@
          Replace-Exact 'docs/TASK_LEDGER.md' '## P07 — Changes and Git' ($p06008Ledger + '## P07 — Changes and Git')

          $oldNext = @'
          `CURRENT_PHASE = P06` and P06 remains `IN_PROGRESS` with `PHASE_EXIT_GATE=NOT_RUN`. `FCCD-P06-001`, `FCCD-P06-002`, `FCCD-P06-003`, `FCCD-P06-004`, `FCCD-P06-005`, and `FCCD-P06-007` are CLOSED after exact PR-head validation, normal merge integration, exact post-merge canonical-main validation, and durable reconciliation evidence. `FCCD-P06-006` and `FCCD-P06-008` remain PENDING.

          P04 remains acceptance-unresolved through `FCCD-P04-008` and its one-to-one queued `OWNER-P04-008-REAL-TARGET` obligation. P05 cloud implementation remains integrated, but its standalone exit observation remains queued as `OWNER-P05-EXIT-REAL-TARGET`. Their phase gates remain `P04=NOT_RUN;P05=NOT_RUN`; owner-last scheduling permits P06 cloud implementation but does not close either deferred acceptance requirement or permit release.

          After this P06-005 reconciliation is integrated and exact resulting `main` remains green, re-run the Worker Protocol claim map. Recover/integrate any higher-priority legitimate work first. `FCCD-P06-006 — Editor tabs/save/reload/dirty state` is now dependency-valid after P06-005 integration; select it only if it remains unclaimed and its semantic/file surface does not collide with fresh P06-008 work. `FCCD-P06-008` remains separately owned by its live worker unless that claim later becomes genuinely stale. Do not begin P07 until P06 cloud work is complete and governance truthfully advances the current cloud phase.
          '@
          $newNext = @'
          `CURRENT_PHASE = P06` and P06 remains `IN_PROGRESS` with `PHASE_EXIT_GATE=NOT_RUN`. `FCCD-P06-001`, `FCCD-P06-002`, `FCCD-P06-003`, `FCCD-P06-004`, `FCCD-P06-005`, `FCCD-P06-007`, and `FCCD-P06-008` are CLOSED after exact PR-head validation, normal merge integration, exact post-merge canonical-main validation, permanent CI coverage where applicable, and durable reconciliation evidence. `FCCD-P06-006 — Editor tabs/save/reload/dirty state` is the sole remaining P06 task and remains PENDING.

          P04 remains acceptance-unresolved through `FCCD-P04-008` and its one-to-one queued `OWNER-P04-008-REAL-TARGET` obligation. P05 cloud implementation remains integrated, but its standalone exit observation remains queued as `OWNER-P05-EXIT-REAL-TARGET`. Their phase gates remain `P04=NOT_RUN;P05=NOT_RUN`; owner-last scheduling permits P06 cloud implementation but does not close either deferred acceptance requirement or permit release.

          After this P06-008 reconciliation is integrated and exact resulting `main` remains green, re-run the Worker Protocol claim map. Recover/integrate any higher-priority legitimate work first. If still unclaimed, select `FCCD-P06-006 — Editor tabs/save/reload/dirty state` as the next legal cloud action. Do not begin P07, run the P06 phase exit gate, or advance the canonical phase until P06-006 is genuinely completed and the remaining P06 governance requirements are satisfied.
          '@
          Replace-Exact 'docs/TASK_LEDGER.md' $oldNext $newNext

          $oldSchedule = 'P06 is now the sole legal cloud implementation/convergence phase. `FCCD-P06-001 — Add/open/recent project workflows`, `FCCD-P06-002 — Project technology/tool detection framework`, `FCCD-P06-003 — Lazy file explorer`, `FCCD-P06-004 — Safe file service`, `FCCD-P06-005 — Locally bundled code editor`, and `FCCD-P06-007 — Workspace content/file/regex search` have been normally integrated and exact-main verified. Subject to the normal live recovery/ownership check in `docs/WORKER_PROTOCOL.md`, select only a dependency-valid unclaimed P06 task whose file/semantic surface does not collide with fresh owned work. P07 and later work remain prohibited until P06 cloud work is complete and governance truthfully advances the single current cloud phase.'
          $newSchedule = 'P06 is now the sole legal cloud implementation/convergence phase. `FCCD-P06-001 — Add/open/recent project workflows`, `FCCD-P06-002 — Project technology/tool detection framework`, `FCCD-P06-003 — Lazy file explorer`, `FCCD-P06-004 — Safe file service`, `FCCD-P06-005 — Locally bundled code editor`, `FCCD-P06-007 — Workspace content/file/regex search`, and `FCCD-P06-008 — Large file/tree safeguards` have been normally integrated and exact-main verified. `FCCD-P06-006 — Editor tabs/save/reload/dirty state` is the sole remaining P06 task. Subject to the normal live recovery/ownership check in `docs/WORKER_PROTOCOL.md`, select P06-006 only if it remains unclaimed and no higher-priority recovery work exists. P07 and later work remain prohibited until P06 cloud work is complete and governance truthfully advances the single current cloud phase.'
          Replace-Exact 'CURRENT_PHASE.md' $oldSchedule $newSchedule
          Replace-Exact 'CURRENT_PHASE.md' '- `FCCD-P06-008` — Large file/tree safeguards — PENDING.' '- `FCCD-P06-008` — Large file/tree safeguards — CLOSED.'

          $p06008Checkpoint = @'
          ## P06-008 integration provenance

          - Exact production implementation candidate: `b5e999440c9a5431e8181efffc885ff9570e705d`.
          - PR #152 exact-head Windows CI: run `34022991731` / run #309 — SUCCESS.
          - PR #152 exact-head P06-007 workspace-search CI: run `34022991732` / run #38 — SUCCESS.
          - PR #152 exact-head P06-008 large-workspace CI: run `34022991748` / run #18 — SUCCESS.
          - Production normal merge commit: `c77473fcebb3317168ab1effdf67cc7ecd95bd99`.
          - Exact post-production-merge Windows CI: run `34023363325` / run #310 — SUCCESS.
          - Exact post-production-merge P06-007 workspace-search CI: run `34023363291` / run #39 — SUCCESS.
          - Exact post-production-merge P06-008 large-workspace CI: run `34023363358` / run #19 — SUCCESS.
          - Superseded recovery PR #155 was closed without merging stale production code; its legitimate permanent-Windows-baseline idea was recovered separately.
          - Exact permanent-baseline repair candidate: `faba60a8dacc34104b7fce70d12ad430a120bad9`.
          - PR #156 exact-head Windows CI: run `34023727676` / run #311 — SUCCESS.
          - PR #156 exact-head P06-007 workspace-search CI: run `34023727648` / run #40 — SUCCESS.
          - PR #156 exact-head P06-008 large-workspace CI: run `34023727646` / run #20 — SUCCESS.
          - Permanent-baseline repair normal merge commit: `dc0a92683f292ac75706601b18bba36e6959656c`.
          - Exact final post-merge canonical-main Windows CI: run `34024101741` / run #312 — SUCCESS.
          - Exact final post-merge P06-007 workspace-search CI: run `34024101733` / run #41 — SUCCESS.
          - Exact final post-merge P06-008 large-workspace CI: run `34024101754` / run #21 — SUCCESS.
          - Integrated evidence: `evidence/phases/P06/P06_008_INTEGRATED_RECONCILIATION_2026-09-06.md`.
          - Evidence class remains cloud/self-test for bounded large-workspace file/tree/search behavior plus permanent CI enforcement; no new owner-only evidence, P06 phase closure, P07 authorization, or release eligibility is implied.

          '@
          Replace-Exact 'CURRENT_PHASE.md' '## P05 cloud task inventory' ($p06008Checkpoint + '## P05 cloud task inventory')

          $oldProject = 'Under the owner-last scheduling amendment, P06 is now the sole legal **cloud implementation phase**. `FCCD-P06-001` through `FCCD-P06-008` remain pending and must be implemented/recovered only from live current-phase state. P07 and later implementation remain prohibited until P06 cloud work is complete and canonical governance advances sequentially. This transition preserves both queued owner blockers, `P04=NOT_RUN`, `P05=NOT_RUN`, and `VERIFIED_FINAL_COMPLETE=false`. P22 and `VERIFIED_FINAL_COMPLETE=true` remain impossible until all queued owner evidence is genuinely executed, reviewed, integrated, and reconciled and every normal mandatory release gate passes.'
          $newProject = 'Under the owner-last scheduling amendment, P06 is now the sole legal **cloud implementation phase**. `FCCD-P06-001`, `FCCD-P06-002`, `FCCD-P06-003`, `FCCD-P06-004`, `FCCD-P06-005`, `FCCD-P06-007`, and `FCCD-P06-008` are CLOSED after canonical integration and exact-main validation; `FCCD-P06-006 — Editor tabs/save/reload/dirty state` is the sole remaining P06 task and remains PENDING. P06 remains `IN_PROGRESS` with `PHASE_EXIT_GATE=NOT_RUN`; P07 and later implementation remain prohibited until P06 cloud work is complete and canonical governance advances sequentially. This preserves both queued owner blockers, `P04=NOT_RUN`, `P05=NOT_RUN`, and `VERIFIED_FINAL_COMPLETE=false`. P22 and `VERIFIED_FINAL_COMPLETE=true` remain impossible until all queued owner evidence is genuinely executed, reviewed, integrated, and reconciled and every normal mandatory release gate passes.'
          Replace-Exact 'PROJECT_CONTROL.md' $oldProject $newProject

          $evidence = @'
          # FCCD-P06-008 Integrated Reconciliation — 2026-09-06

          ## Decision

          `FCCD-P06-008 — Large file/tree safeguards` is **CLOSED** as a cloud-actionable task. P06 itself remains `IN_PROGRESS`; `PHASE_EXIT_GATE=NOT_RUN`; `FCCD-P06-006 — Editor tabs/save/reload/dirty state` remains mandatory and PENDING. No P07 work is authorized by this reconciliation.

          ## Production integration

          The accepted production candidate is `b5e999440c9a5431e8181efffc885ff9570e705d` from PR #152. It centralizes bounded workspace policy across tree exploration, safe file inspection/materialization, and workspace search; enforces project-root containment and reparse/generated-path safeguards; bounds traversal depth, file counts, file sizes, result counts and per-file matches; supports cancellation; detects binary/unsupported inputs; and fails closed on overflow/policy violations without source mutation.

          Exact PR-head gates on that candidate:

          - Windows CI run `34022991731` / #309 — SUCCESS.
          - P06-007 Workspace Search run `34022991732` / #38 — SUCCESS.
          - P06-008 Large Workspace Safeguards run `34022991748` / #18 — SUCCESS.

          PR #152 was normally merged as `c77473fcebb3317168ab1efffc885ff9570e705d`. Exact post-merge main gates on that SHA:

          - Windows CI run `34023363325` / #310 — SUCCESS.
          - P06-007 Workspace Search run `34023363291` / #39 — SUCCESS.
          - P06-008 Large Workspace Safeguards run `34023363358` / #19 — SUCCESS.

          ## Recovery convergence and permanent CI

          PR #155 duplicated older P06-008 production work and was closed as superseded rather than merged over the newer accepted implementation. Its unique legitimate contribution was retained: P06-008 must remain a permanent canonical Windows baseline gate, with the CI self-contract rejecting accidental removal.

          That repair was isolated in PR #156. Exact repair candidate `faba60a8dacc34104b7fce70d12ad430a120bad9` passed:

          - Windows CI run `34023727676` / #311 — SUCCESS, including the new permanent P06-008 step and CI self-contract.
          - P06-007 Workspace Search run `34023727648` / #40 — SUCCESS.
          - P06-008 Large Workspace Safeguards run `34023727646` / #20 — SUCCESS.

          PR #156 was normally merged as `dc0a92683f292ac75706601b18bba36e6959656c`. Exact final canonical-main gates on that SHA passed:

          - Windows CI run `34024101741` / #312 — SUCCESS.
          - P06-007 Workspace Search run `34024101733` / #41 — SUCCESS.
          - P06-008 Large Workspace Safeguards run `34024101754` / #21 — SUCCESS.

          ## Owner-last classification

          No P06-008 acceptance requirement is genuinely owner-only. The canonical final-owner queue remains unchanged with exactly the existing `OWNER-P04-008-REAL-TARGET` and `OWNER-P05-EXIT-REAL-TARGET` release-blocking items. No cloud defect, missing test, CI gap, or documentation defect is deferred to the owner by this closure.

          ## Remaining phase state

          - `CURRENT_PHASE=P06`.
          - `CURRENT_PHASE_STATE=IN_PROGRESS`.
          - `PHASE_EXIT_GATE=NOT_RUN`.
          - `FCCD-P06-006` remains PENDING and is the sole remaining P06 task.
          - `KNOWN_RELEASE_BLOCKERS=2`, both pre-existing owner-only queue obligations.
          - `VERIFIED_FINAL_COMPLETE=false`.
          - P07/P08 and later implementation remain prohibited until canonical P06 governance advances them.
          '@
          [IO.Directory]::CreateDirectory('evidence/phases/P06') | Out-Null
          [IO.File]::WriteAllText('evidence/phases/P06/P06_008_INTEGRATED_RECONCILIATION_2026-09-06.md', $evidence.TrimStart(), $utf8NoBom)

          git diff --check
          git diff --exit-code -- docs/FINAL_OWNER_ACCEPTANCE_QUEUE.md
          git diff -- docs/TASK_LEDGER.md CURRENT_PHASE.md PROJECT_CONTROL.md evidence/phases/P06/P06_008_INTEGRATED_RECONCILIATION_2026-09-06.md

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TASK_LEDGER.md CURRENT_PHASE.md PROJECT_CONTROL.md evidence/phases/P06/P06_008_INTEGRATED_RECONCILIATION_2026-09-06.md
          git diff --cached --check
          git commit -m "docs: reconcile FCCD-P06-008 integrated closure"
          git push origin HEAD:reconcile/fccd-p06-008-closure
