name: P09-006 Reconciliation Bootstrap

on:
  push:
    branches:
      - reconcile/fccd-p09-006-integrated-closure

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconcile P09-006 canonical state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          current_path = Path('CURRENT_PHASE.md')
          ledger_path = Path('docs/TASK_LEDGER.md')
          evidence_path = Path('evidence/phases/P09/P09_006_INTEGRATED_RECONCILIATION_2026-09-08.md')

          current = current_path.read_text(encoding='utf-8')
          old_current = '- `FCCD-P09-006` — Tool diagnostics/health framework — PENDING.'
          new_current = '- `FCCD-P09-006` — Tool diagnostics/health framework — CLOSED.'
          if current.count(old_current) != 1:
              raise SystemExit(f'CURRENT_PHASE row count mismatch: {current.count(old_current)}')
          if '<!-- FCCD-P09-006-INTEGRATED-CLOSURE -->' in current:
              raise SystemExit('P09-006 provenance already exists')
          current = current.replace(old_current, new_current, 1)
          provenance = '''

          <!-- FCCD-P09-006-INTEGRATED-CLOSURE -->
          ## P09-006 integration provenance

          - Task: `FCCD-P09-006 — Tool diagnostics/health framework` — `CLOSED` in this reconciliation candidate.
          - Implementation PR: #224 (`worker/fccd-p09-006-tool-diagnostics-health`).
          - Exact accepted implementation candidate: `556d9eaacaa58460ec4220ec036cd5d0ecb91619`.
          - Exact implementation-head Windows CI: run `34187700957` / #612 — SUCCESS.
          - Exact implementation-head P06-007 Workspace Search: run `34187700916` / #341 — SUCCESS.
          - Exact implementation-head P06-008 Large Workspace Safeguards: run `34187700973` / #325 — SUCCESS.
          - Normal implementation merge / accepted implementation main: `06bc1272fd617fdece54271014c1f23d2107ef53`.
          - Accepted implementation head and normal merge have the same Git tree `3fd9a55225826075a06b00e479522f91d7b30a24`.
          - Exact implementation-main Windows CI: run `34188169573` / #613 — SUCCESS.
          - Exact implementation-main P06-007 Workspace Search: run `34188169493` / #342 — SUCCESS.
          - Exact implementation-main P06-008 Large Workspace Safeguards: run `34188169513` / #326 — SUCCESS.
          - Integrated evidence: `evidence/phases/P09/P09_006_INTEGRATED_RECONCILIATION_2026-09-08.md`.
          - No owner-only evidence is required or added. P09 remains `IN_PROGRESS`; `FCCD-P09-007` and `FCCD-P09-008` remain PENDING; `PHASE_EXIT_GATE=NOT_RUN`; P10 and later implementation remain prohibited; `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item; `VERIFIED_FINAL_COMPLETE=false`.
          '''
          current_path.write_text(current.rstrip('\n') + '\n' + provenance.strip() + '\n', encoding='utf-8')

          ledger = ledger_path.read_text(encoding='utf-8')
          old_ledger = '| FCCD-P09-006 | Tool diagnostics/health framework | PENDING |'
          new_ledger = '| FCCD-P09-006 | Tool diagnostics/health framework | CLOSED |'
          if ledger.count(old_ledger) != 1:
              raise SystemExit(f'TASK_LEDGER row count mismatch: {ledger.count(old_ledger)}')
          ledger_path.write_text(ledger.replace(old_ledger, new_ledger, 1), encoding='utf-8')

          if evidence_path.exists():
              raise SystemExit('P09-006 evidence already exists')
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text('''# FCCD-P09-006 — Integrated Reconciliation Evidence

          Date: 2026-09-08
          Task: `FCCD-P09-006 — Tool diagnostics/health framework`
          Classification: CLOUD / HOSTED-WINDOWS / INTEGRATED
          Canonical task result: CLOSED after normal implementation integration, exact-main validation, and this reconciliation.

          ## Live-state recovery

          The supplied scheduling hint targeted future P17 work, but canonical live state had P08 already CLOSED and `CURRENT_PHASE=P09`. P09-001 through P09-005 were canonically CLOSED, and the legitimate P09-006 branch was recovered rather than starting duplicate or future-phase work. Exact source main `2111c3c44e6faab93e7728d69d9046f8c912fb39` had Windows CI `34186945984`, Workspace Search `34186945981`, and Large Workspace Safeguards `34186945995` all SUCCESS before P09-006 implementation was accepted.

          Pre-reconciliation canonical main: `06bc1272fd617fdece54271014c1f23d2107ef53`.

          ## Implementation

          - Implementation PR: #224 — `P09-006: add tool diagnostics health framework`.
          - Branch: `worker/fccd-p09-006-tool-diagnostics-health`.
          - Exact accepted implementation candidate: `556d9eaacaa58460ec4220ec036cd5d0ecb91619`.
          - Product implementation: `src/FCCCodeDesktop.Tools/ToolDiagnostics.cs`.
          - Focused tests: `tests/FCCCodeDesktop.UnitTests/ToolDiagnosticsTests.cs`.
          - Adds provider-neutral health states and structured diagnostic severity/code/summary/detail contracts.
          - Adds immutable UTC-normalized `ToolHealthReport` snapshots and `ToolHealthReportEvent` on the existing tool-event seam.
          - Adds optional adapter-owned `IExternalToolHealthProvider` without breaking the established `IExternalToolAdapter` contract.
          - Adds project-owned targeted and deterministic catalog-wide `IExternalToolHealthService` orchestration.
          - Discovery fallback classifies discoverable-without-specialized-probe as degraded and unavailable tools as unavailable.
          - Per-tool provider/discovery failures are isolated as structured unhealthy results while caller-requested cancellation propagates.
          - Provider identity/null contract violations fail closed, and framework-generated failures do not copy exception messages into diagnostics.
          - Tests cover validation/immutability, specialized provider routing, fallback health, batch isolation, contract failures, cancellation, and exception-message secret suppression.
          - Scope excludes P09-007 CLI/process primitives, P09-008 protocol seams, Unity/Blender adapters, and all P10+ implementation.

          ## Exact implementation-head validation

          On `556d9eaacaa58460ec4220ec036cd5d0ecb91619`:

          - Windows CI `34187700957` / #612 — SUCCESS.
          - P06-007 Workspace Search `34187700916` / #341 — SUCCESS.
          - P06-008 Large Workspace Safeguards `34187700973` / #325 — SUCCESS.

          ## Normal implementation integration

          PR #224 was normally merged as `06bc1272fd617fdece54271014c1f23d2107ef53`, preserving the accepted implementation head as a merge parent. No squash, rebase, force-push, or fabricated evidence is claimed. The accepted head and merge commit share Git tree `3fd9a55225826075a06b00e479522f91d7b30a24`, so the integrated product bytes are identical to the exact tested head.

          ## Exact implementation-main validation

          On exact canonical main `06bc1272fd617fdece54271014c1f23d2107ef53`:

          - Windows CI `34188169573` / #613 — SUCCESS, including the complete Release baseline and permanent Windows validators.
          - P06-007 Workspace Search `34188169493` / #342 — SUCCESS.
          - P06-008 Large Workspace Safeguards `34188169513` / #326 — SUCCESS.

          ## Owner-last classification

          P09-006 has no genuine owner-machine/manual/provider/Unity/Blender acceptance requirement. Its provider-neutral diagnostics contracts and orchestration are fully cloud/hosted-Windows verifiable, so no owner queue item is added. `OWNER-P04-008-REAL-TARGET` remains the sole unresolved release-blocking owner item and is unchanged.

          ## Reconciliation boundary

          This reconciliation closes only `FCCD-P09-006`. P09 remains `IN_PROGRESS`; P09-007 and P09-008 remain PENDING; `PHASE_EXIT_GATE=NOT_RUN`; P10 and later phases remain prohibited until sequential P09 convergence completes; `VERIFIED_FINAL_COMPLETE=false`.

          The reconciliation PR itself must pass exact-head CI, be normally merged, and the resulting exact canonical main must remain green before this task closure is treated as the durable endpoint.
          '''.strip() + '\n', encoding='utf-8')
          PY

      - name: Remove bootstrap workflow and verify exact final diff
        shell: bash
        run: |
          rm .github/workflows/p09-006-reconcile-bootstrap.yml
          git add -N evidence/phases/P09/P09_006_INTEGRATED_RECONCILIATION_2026-09-08.md
          git diff --check
          git diff --name-only origin/main -- | sort > /tmp/changed.txt
          printf '%s\n' \
            CURRENT_PHASE.md \
            docs/TASK_LEDGER.md \
            evidence/phases/P09/P09_006_INTEGRATED_RECONCILIATION_2026-09-08.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit canonical reconciliation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A CURRENT_PHASE.md docs/TASK_LEDGER.md evidence/phases/P09/P09_006_INTEGRATED_RECONCILIATION_2026-09-08.md .github/workflows/p09-006-reconcile-bootstrap.yml
          git diff --cached --check
          git commit -m "P09-006: reconcile integrated diagnostics health closure"
          git push origin HEAD:${GITHUB_REF_NAME}
